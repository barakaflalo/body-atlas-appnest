<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>אטלס הגוף — AppNest</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --gold:#d8b25a; --gold-2:#b8924a; --gold-soft:#e7cd8a;
  --bg:#0d0d0f; --bg2:#15151a; --card:#1b1b22; --card2:#22222b;
  --line:#2c2c36; --ink:#f4f2ea; --muted:#9a99a5; --ok:#5fbf8f; --bad:#e06a5c;
  --radius:18px; --shadow:0 14px 40px #00000055;
}
/* ---- palettes ---- */
[data-pal="onyx"]{ --gold:#d8b25a; --gold-2:#b8924a; --gold-soft:#e7cd8a; }
[data-pal="jade"]{ --gold:#6fc9a6; --gold-2:#3f9c7c; --gold-soft:#a6e6cf; }
[data-pal="ruby"]{ --gold:#e08a7d; --gold-2:#c05f52; --gold-soft:#f2b7ad; }
[data-pal="sky"]{ --gold:#7fb2e6; --gold-2:#4f86c6; --gold-soft:#b6d6f4; }
[data-pal="amethyst"]{ --gold:#b79ae0; --gold-2:#8a68c6; --gold-soft:#d8c6f2; }
/* ---- day mode ---- */
[data-theme="day"]{
  --bg:#f6f3ec; --bg2:#efeadf; --card:#ffffff; --card2:#f4f1e8;
  --line:#e0dccf; --ink:#1c1b18; --muted:#6d6a60; --shadow:0 14px 40px #1b160a14;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font:16px/1.55 -apple-system,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(120% 60% at 90% -10%, color-mix(in srgb,var(--gold) 12%, transparent), transparent 60%), var(--bg);
  color:var(--ink); -webkit-tap-highlight-color:transparent; min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
.hide{display:none!important}
.gold{color:var(--gold)}
h1,h2,h3{margin:0;font-weight:800}
small{color:var(--muted)}
.wrap{width:min(1120px,100% - 28px);margin:auto}

/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:11px 0}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.logo{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,#1a1a20,#2a2a34);border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));box-shadow:inset 0 0 0 1px #0004}
.logo svg{width:24px;height:24px}
.brand b{font-size:17px;letter-spacing:.2px}
.brand small{display:block;letter-spacing:.28em;font-size:10px;margin-top:1px}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:13px;background:var(--card);padding:0 42px 0 14px}
.search svg{position:absolute;inset-inline-start:auto;inset-inline-end:13px;top:11px;width:20px;height:20px;color:var(--muted)}
.iconbtn{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.iconbtn:hover{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}

/* nav */
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 15px;color:var(--muted);font-weight:600;display:flex;gap:7px;align-items:center}
.tab svg{width:17px;height:17px}
.tab.active{background:linear-gradient(160deg,var(--gold),var(--gold-2));color:#141018;border-color:transparent;font-weight:800}

main{padding:18px 0 90px}
.screen{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* home */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:6px 0 20px}
.eyebrow{color:var(--gold);font-weight:700;font-size:13px}
.hero h1{font-size:clamp(25px,5vw,38px);margin-top:6px}
.hero p{color:var(--muted);margin:6px 0 0;max-width:46ch}
.favpill{border:1px solid var(--line);background:var(--card);border-radius:30px;padding:10px 15px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.favpill svg{width:17px;height:17px;color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{text-align:start;border:1px solid var(--line);background:linear-gradient(165deg,var(--card),var(--card2));border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;min-height:120px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:16px}
.tile small{display:block;margin-top:3px}
.tile .cnt{margin-top:auto;font-size:13px;color:var(--gold);font-weight:700}

.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:24px 0 14px;gap:12px}
.section-head h2{font-size:20px}
.card{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}

/* workspace (map + list) */
.workspace{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.9fr);gap:14px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}
.toolbar .seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.chip svg{width:16px;height:16px}
.chip.active{background:linear-gradient(160deg,var(--gold),var(--gold-2));color:#141018;border-color:transparent}
select.chip{padding-inline-end:26px}
.stage{position:relative;background:var(--bg2);min-height:360px;display:grid;place-items:center;overflow:auto;max-height:72vh;padding:14px}
.stage.body{background:#050507;padding:0}
.stage img{display:block;width:var(--zoom,100%);max-width:none;height:auto;margin:auto}
.stage.body img{width:100%;max-width:520px}
.pin{position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--gold-2);color:#fff;font-weight:800;box-shadow:0 4px 12px #0009;display:grid;place-items:center;transform:translate(50%,-50%)}
.acupin{position:absolute;width:15px;height:15px;padding:0;border-radius:50%;border:2px solid #fff;background:var(--gold);box-shadow:0 1px 6px #000a;transform:translate(-50%,-50%);transition:.12s}
.acupin:hover,.acupin:focus{width:24px;height:24px;z-index:3;outline:none}
.map-note{margin:0;padding:12px 15px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.zoombar{display:flex;gap:8px;align-items:center;padding:11px 15px;border-top:1px solid var(--line)}
.zoombar input{flex:1}
.zoombar button{width:38px;height:38px;border:1px solid var(--line);background:var(--bg2);border-radius:10px;font-weight:800}
.zonegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;padding:13px 15px;border-top:1px solid var(--line)}
.zonegrid button{min-height:42px;border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));background:color-mix(in srgb,var(--gold) 10%,transparent);color:var(--gold);border-radius:10px;font-weight:800}
.zonegrid button:hover{background:linear-gradient(160deg,var(--gold),var(--gold-2));color:#141018}

.list{max-height:72vh;overflow:auto;padding:8px}
.list-head{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 8px 12px;flex-wrap:wrap}
.list-head b{font-size:15px}
.count{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:13px;color:var(--muted)}
.row{width:100%;text-align:start;border:1px solid transparent;background:transparent;border-radius:13px;padding:10px;display:grid;grid-template-columns:48px 1fr 16px;gap:10px;align-items:center;color:var(--ink)}
.row:hover{background:var(--card2);border-color:var(--line)}
.code{direction:ltr;min-width:48px;height:48px;padding:0 6px;border-radius:12px;background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:14px}
.row b{display:block;font-size:15px}
.row small{display:block}
.row em{font-style:normal;font-size:11px;color:var(--gold);font-weight:700}
.row .chev{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:34px 14px}

/* meridians grid */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mcard{text-align:start;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:6px}
.mcard:hover{border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.mcard .ab{direction:ltr;font-weight:800;color:var(--gold);letter-spacing:1px}
.mcard b{font-size:15px}
.mcard small{color:var(--muted)}
.mdot{width:100%;height:6px;border-radius:6px;margin-top:4px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}

/* detail sheet */
.scrim{position:fixed;inset:0;background:#0009;z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-block:0;inset-inline-end:0;width:min(94vw,440px);background:var(--card);z-index:41;box-shadow:var(--shadow);transform:translateX(110%);transition:transform .25s;overflow:auto;padding:22px}
[dir=rtl] .sheet{transform:translateX(-110%)}
.sheet.open{transform:none!important}
.sheet .x{position:absolute;inset-inline-start:16px;top:16px;border:1px solid var(--line);background:var(--bg2);border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
.sheet .bigcode{direction:ltr;width:70px;height:70px;border-radius:18px;background:linear-gradient(160deg,var(--gold),var(--gold-2));color:#141018;display:grid;place-items:center;font-weight:800;font-size:20px;margin-top:34px}
.sheet .type{color:var(--gold);font-weight:700;font-size:13px;margin-top:14px}
.sheet h2{font-size:25px;margin:4px 0 2px}
.sheet .zh{direction:ltr;color:var(--muted)}
.sheet section{border-top:1px solid var(--line);padding:15px 0 0;margin-top:15px}
.sheet section b{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}
.sheet section p{margin:0;line-height:1.7}
.sheet .en{direction:ltr;font-size:14px;color:var(--muted)}
.warn{background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:14px;padding:13px;margin-top:16px;font-size:14px;line-height:1.6}
.btn{width:100%;border:0;border-radius:13px;padding:13px;font-weight:800;background:linear-gradient(160deg,var(--gold),var(--gold-2));color:#141018;margin-top:16px;display:flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
.btn svg{width:18px;height:18px}

/* learn */
.learn-wrap{max-width:640px;margin:auto}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px;gap:14px}
.flash .code{width:auto;height:auto;padding:8px 16px;font-size:22px}
.flash .q{font-size:20px;font-weight:700}
.flash .a{color:var(--muted);line-height:1.7}
.opts{display:grid;gap:10px;margin-top:8px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:13px 15px;text-align:start;font-weight:600}
.opt:hover{border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.opt.correct{background:color-mix(in srgb,var(--ok) 22%,transparent);border-color:var(--ok)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 20%,transparent);border-color:var(--bad)}
.progress{height:8px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:14px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));width:0;transition:.3s}

/* settings/forms */
.field{margin:14px 0}
.field label{display:block;font-weight:700;margin-bottom:7px;font-size:14px}
.field input,.field select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:0 13px}
.pals{display:flex;gap:10px;flex-wrap:wrap}
.pals button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);position:relative}
.pals button.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
.seg-toggle{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg-toggle button{flex:1;padding:12px;background:var(--bg2);font-weight:700}
.seg-toggle button.active{background:linear-gradient(160deg,var(--gold),var(--gold-2));color:#141018}
.setrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.setrow .btn{margin-top:0;flex:1;min-width:140px}

/* onboarding */
.modal{position:fixed;inset:0;z-index:60;background:#000a;display:grid;place-items:center;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:440px;width:100%;box-shadow:var(--shadow)}
.modal h2{font-size:24px}
.modal .steps{color:var(--muted);line-height:1.8;margin:14px 0}

footer{border-top:1px solid var(--line);padding:18px 0 26px;color:var(--muted);font-size:13px;display:flex;gap:6px;justify-content:space-between;flex-wrap:wrap}
footer a{color:var(--gold)}

@media(max-width:820px){
  .tiles{grid-template-columns:1fr 1fr}
  .workspace{grid-template-columns:1fr}
  .brand small{display:none}
  .hero{flex-direction:column;align-items:stretch}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<header>

  </div>
  <div class="wrap"><nav id="nav"></nav></div>
</header>

<script>window.ATLAS={"points":[{"c":"LU 1","py":"Zhongfu","zh":"中府","m":"LU","loc":"Laterosuperior to the sternum, 1 cun below Yunmen (LU 2), at the level of the first intercostal space, 6 cun lateral to the anterior midline.","ind":"cough, asthma, pain in the chest, shoulder and back, fullness in the chest.","mth":"Puncture obliquely 0.5-0.8 cun towards the lateral aspect of the chest. To avoid injuring the lung, never puncture deeply towards the medial aspect. Moxibustion is applicable.","heN":"דְזוֹנְג פוּ","heL":"בחלק העליון־צדדי של דופן בית החזה הקדמית, צוּן אחד מתחת ליוּנמֶן (LU 2), בגובה מרווח הצלעות הראשון, 6 צוּן לרוחב מקו האמצע הקדמי.","heA":"נקודת ה‑מוּ הקדמית של מרידיאן הריאות; במסורת הסינית המרידיאן משויך לנשימה ולחזה."},{"c":"LU 2","py":"Yunmen","zh":"雲(云)門(门)","m":"LU","loc":"In the superior lateral part of the anterior thoracic wall, superior to the coracoid process of scapula, in the depression of the infraclavicular fossa, 6 cun lateral to the anterior midline.","ind":"cough, asthma, pain in the chest, shoulder and arm, fullness in the chest.","mth":"Puncture obliquely 0.5-0.8 inch towards the lateral aspect of the chest. To avoid injuring the lung, never puncture deeply towards the medial aspect. Moxibustion is applicable.","heN":"יוּן מֶן","heL":"בחלק העליון־צדדי של דופן בית החזה הקדמית, מעל הזיז המקורי (coracoid) של השכם, בשקע הבור התת־בריחי, 6 צוּן לרוחב מקו האמצע הקדמי."},{"c":"LU 3","py":"Tianfu","zh":"天府","m":"LU","loc":"On the medial aspect of the upper arm, 3 cun below the end of axillary fold, on the radial side of m. biceps brachii.","ind":"asthma, epistaxis, pain in the medial aspect of the upper arm.","mth":"Puncture perpendicularly 0.5-1 inch.","heN":"טְיֵין פוּ","heL":"בצד הפנימי (מֶדיאלי) של הזרוע העליונה, 3 צוּן מתחת לקצה קפל בית השחי, בצד הרדיאלי של השריר הדו־ראשי הזרועי."},{"c":"LU 4","py":"Xiabai","zh":"俠(侠)白","m":"LU","loc":"On the medial aspect of the upper arm, 4 cun below the anterior end of the axillary fold, or 5 cun above the cubital crease, on the radial side of m. biceps brachii.","ind":"cough, fullness in the chest, pain in the medial aspect of the upper arm.","mth":"Puncture perpendicularly 0.5-1 inch. Moxibustion is applicable.","heN":"שְׂיָה בַּאי","heL":"בצד הפנימי של הזרוע העליונה, 4 צוּן מתחת לקצה הקדמי של קפל בית השחי (או 5 צוּן מעל קפל המרפק), בצד הרדיאלי של השריר הדו־ראשי."},{"c":"LU 5","py":"Chize","zh":"尺澤(泽,沢)","m":"LU","loc":"On the cubital crease, in the depression of the radial side of the tendon of m. biceps brachii. This point is located with the elbow slightly flexed.","ind":"cough, hemoptysis, afternoon fever, asthma, sore throat, fullness in the chest, infantile convulsion, spasmodic pain of the elbow and arm, mastitis.","mth":"puncture perpendicularly 0.5-1 inch.","heN":"צְ'ה דְזֶה","heL":"על קפל המרפק, בשקע שבצד הרדיאלי של גיד השריר הדו־ראשי. הנקודה מאותרת כשהמרפק כפוף מעט."},{"c":"LU 6","py":"Kongzui","zh":"孔最","m":"LU","loc":"On the palmar aspect of the forearm, on the line joining Taiyuan (LU 9) and Chize (LU 5), 7 cun above the transverse crease of the wrist.","ind":"cough, pain in the chest, asthma, hemoptysis, sore throat, spasmodic pain of the elbow and arm.","mth":"Puncture perpendicularly 0.5-1 inch. Moxibustion is applicable.","heN":"קוֹנְג דְזוֹאִי","heL":"בצד כף־היד של האמה, על הקו המחבר בין טַאי יוּאָן (LU 9) לצְ'ה דְזֶה (LU 5), 7 צוּן מעל קפל שורש כף היד."},{"c":"LU 7","py":"Lieque","zh":"列缺","m":"LU","loc":"Superior to the styloid process of the radius, 1.5 cun above the transverse crease of the wrist between the tendons of brachioradial muscle and abductor pollicis longus muscle. When the index fingers and thumbs of both hands are crossed with the index finger of one hand placed on the styloid process of the radius of the other, the point is in the depression right under the tip of the index finger.","ind":"headache, migraine, neck rigidity, cough, asthma, sore throat, facial paralysis, toothache, pain and weakness of the wrist.","mth":"","heN":"לְיֵה צְ'וֵוה","heL":"בצד האגודל של האמה, בערך רוחב שתי אצבעות מעל קפל שורש כף היד, בתוך השקע שבין הגידים.","heA":"במסורת הסינית הנקודה שייכת למרידיאן הריאות ומשויכת לאזור הנשימה, הגרון, הראש והעורף."},{"c":"LU 8","py":"Jingqu","zh":"經(经,経)渠","m":"LU","loc":"1 cun above the transverse crease of the wrist in the depression on the lateral side of the radial artery.","ind":"cough, asthma, fever, pain in the chest, sore throat, pain in the wrist.","mth":"Puncture perpendicularly 0.1-0.3 inch. Avoid puncturing the radial artery.","heN":"גִּ'ינְג צ'וּ","heL":"צוּן אחד מעל קפל שורש כף היד, בשקע שבצד החיצוני (לרוחב) של עורק הרדיוס."},{"c":"LU 9","py":"Taiyuan","zh":"太淵(渊)","m":"LU","loc":"At the radial end of the transverse crease of the wrist, in the depression on the lateral side of the radial artery.","ind":"cough, asthma, hemoptysis, sore throat, palpitation, pain in the chest, wrist and arm.","mth":"Puncture perpendicularly 0.2-0.3 inch. Avoid puncturing the radial artery. Moxibustion is applicable.","heN":"טַאי יוּאָן","heL":"בקצה הרדיאלי של קפל שורש כף היד, בשקע שבצד החיצוני של עורק הרדיוס."},{"c":"LU 10","py":"Yuji","zh":"魚(鱼)際(际)","m":"LU","loc":"On the radial aspect of the midpoint of the first metacarpal bone, on the junction of the red and white skin (i.e., the junction of the dorsum and palm of the hand).","ind":"cough, hemoptysis, sore throat, loss of voice, fever, feverish sensation in the palm.","mth":"Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.","heN":"יוּ גִּ'י","heL":"בצד הרדיאלי של אמצע עצם כף־היד הראשונה, במפגש העור האדום והלבן (המעבר בין גב כף היד לצידה הפנימי)."},{"c":"LU 11","py":"Shaoshang","zh":"少商","m":"LU","loc":"On the radial side of the thumb, about 0.1 cun posterior to the corner of the nail.","ind":"sore throat, cough, asthma, epistaxis, fever, loss of consciousness, mania, spasmodic pain of the thumb.","mth":"Puncture 0.1 inch, or prick the point to cause bleeding.","heN":"שָׁאוֹ שָׁאנְג","heL":"בצד הרדיאלי של האגודל, כ־0.1 צוּן מאחורי פינת הציפורן."},{"c":"LI 1","py":"Shangyang","zh":"商陽(阳)","m":"LI","loc":"On the radial side of the index finger, about 0.1 cun posterior to the corner of the nail.","ind":"toothache, sore throat, swelling of the submandibular region, numbness of fingers, febrile diseases with anhidrosis, loss of consciousness.","mth":"Puncture 0.1 inch, or prick the point to cause bleeding.","heN":"שָׁאנְג יָאנְג","heL":"בצד הרדיאלי של האצבע המורה, כ־0.1 צוּן מאחורי פינת הציפורן."},{"c":"LI 2","py":"Erjian","zh":"二間(间)","m":"LI","loc":"In the depression of the radial side of the index finger, distal to the 2nd metacarpal-phalangeal (MCP) joint. The point is located with the finger slightly flexed.","ind":"blurred vision, epistaxis, toothache, sore throat, febrile diseases.","mth":"Puncture perpendicularly 0.2-0.3 inch. Moxibustion is applicable.","heN":"אֵר גְ'יֶן","heL":"בשקע שבצד הרדיאלי של האצבע המורה, דיסטלית למפרק כף־היד–אצבע (MCP) השני. הנקודה מאותרת כשהאצבע כפופה מעט."},{"c":"LI 3","py":"Sanjian","zh":"三間(间)","m":"LI","loc":"When a loose fist is made, the point is on the radial side of the index finger, in the depression proximal to the head of the second metacarpal bone.","ind":"toothache, ophthalmalgia, sore throat, redness and swelling of fingers and the dorsum of the hand.","mth":"Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.","heN":"סָאן גְ'יֶן","heL":"כשאוגרפים אגרוף רפוי — בצד הרדיאלי של האצבע המורה, בשקע פרוקסימלית לראש עצם כף־היד (המסרק) השנייה."},{"c":"LI 4","py":"Hegu, Hoku","zh":"合谷","m":"LI","loc":"On the dorsum of the hand, between the 1st and 2nd metacarpal bones; approximately in the middle of the 2nd metacarpal bone on the radial side. Or, place in coincident position the transverse crease of the interphalangeal joint of the thumb with the margin of the web between the thumb and the index finger of the other hand. The point is where the tip of the thumb touches.","ind":"headache, pain in the neck, redness, swelling and pain of the eye, epistaxis, nasal obstruction, rhinorrhea, toothache, deafness, swelling of the face, sore throat, parotitis, trismus, facial paralysis, febrile diseases with anhidrosis, hyperhidrosis, abdominal pain, dysentery, constipation, amenorrhea, delayed labor, infantile convulsion, pain, weakness and motor impairment of the upper limbs.","mth":"Puncture perpendicularly 0.5-1 inch. Moxibustion is applicable.","heN":"חֶה גוּ","heL":"בגב כף היד, בתוך השריר שבין האגודל לאצבע. הצמידו אגודל ואצבע וחפשו את שיא הבליטה שנוצרת.","heA":"נקודה מרכזית במרידיאן המעי הגס. במסורת היא משויכת בעיקר לראש, לפנים, ללסת ולמתח באזור הצוואר והיד.","heC":"בהריון אין ללחוץ על נקודה זו ללא הנחיה מקצועית."},{"c":"LI 5","py":"Yangxi","zh":"陽(阳)谿(溪)","m":"LI","loc":"On the radial side of the wrist. When the thumb is tilted upward, it is in the depression between the tendons of m. extensor pollicis longus and brevis.","ind":"headache, redness, pain and swelling of the eye, toothache, sore throat, pain in the wrist.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"יָאנְג שִׂי","heL":"בצד הרדיאלי של שורש כף היד. כשמטים את האגודל כלפי מעלה, הנקודה בשקע שבין גידי מיישר האגודל הארוך והקצר."},{"c":"LI 6","py":"Pianli","zh":"偏歷(历)","m":"LI","loc":"With the elbow flexed and the radial side of arm upward, the point is on the line joining Yangxi (LI 5) and Quchi (LI 11), 3 cun above the crease of the wrist.","ind":"redness of the eye, tinnitus, deafness, epistaxis, aching of the hand and arm, sore throat, edema.","mth":"Puncture perpendicularly or obliquely 0.5-0.8 inch. Moxibustion is applicable.","heN":"פְּיֶן לִי","heL":"כשהמרפק כפוף והצד הרדיאלי של הזרוע כלפי מעלה — על הקו המחבר בין יָאנְג שִׂי (LI 5) לצ'וּ צְ'ה (LI 11), 3 צוּן מעל קפל שורש כף היד."},{"c":"LI 7","py":"Wenliu","zh":"溫(温)溜","m":"LI","loc":"With the elbow flexed and the radial side of arm upward, the point is on the line connecting Yangxi (LI 5) and Quchi (LI 11), 5 cun above the crease of the wrist.","ind":"headache, swelling of the face, sore throat, borborygmus, abdominal pain, aching of the shoulder and arm.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"וֶן לְיוּ","heL":"על אותו קו כמו LI 6, 5 צוּן מעל קפל שורש כף היד."},{"c":"LI 8","py":"Xialian","zh":"下廉","m":"LI","loc":"On the line joining Yangxi (LI 5) and Quchi (LI 11), 4 cun below the cubital crease.","ind":"abdominal pain, borborygmus, pain in the elbow and arm, motor impairment of the upper limbs.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"שְׂיָה לְיֶן","heL":"על הקו המחבר בין יָאנְג שִׂי (LI 5) לצ'וּ צְ'ה (LI 11), 4 צוּן מתחת לקפל המרפק."},{"c":"LI 9","py":"Shanglian","zh":"上廉","m":"LI","loc":"On the line joining Yangxi (LI 5) and Quchi (LI 11), 3 cun below the cubital crease.","ind":"aching of the shoulder and arm, motor impairment of the upper limbs, numbness of the hand and arm, borborygmus, abdominal pain.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"שָׁאנְג לְיֶן","heL":"על אותו קו, 3 צוּן מתחת לקפל המרפק."},{"c":"LI 10","py":"Shousanli","zh":"手三里","m":"LI","loc":"On the line joining Yangxi (LI 5) and Quchi (LI 11), 2 cun below the cubital crease.","ind":"abdominal pain, diarrhea, toothache, swelling of the cheek, motor impairment of the upper limbs, pain in the shoulder and back.","mth":"Puncture perpendicularly 0.8-1.2 inches. Moxibustion is applicable.","heN":"שׁוֹ סָאן לִי","heL":"על אותו קו, 2 צוּן מתחת לקפל המרפק."},{"c":"LI 11","py":"Quchi","zh":"曲池","m":"LI","loc":"When the elbow is flexed, the point is in the depression at the lateral end of the transverse cubital crease, midway between Chize (LU 5) and the lateral epicondyle of the humerus.","ind":"sore throat, toothache, redness and pain of the eye, scrofula, urticaria, motor impairment of the upper extremities, abdominal pain, vomiting, diarrhea, febrile diseases.","mth":"Puncture perpendicularly 1.0-1.5 inches. Moxibustion is applicable.","heN":"צ'וּ צְ'ה","heL":"כופפו את המרפק. הנקודה נמצאת בשקע שבקצה החיצוני של קפל המרפק.","heA":"שייכת למרידיאן המעי הגס. במסורת היא משויכת לחום בגוף, לעור, למרפק ולתנועה של היד והכתף."},{"c":"LI 12","py":"Zhouliao","zh":"肘髎(髎)","m":"LI","loc":"When the elbow is flexed, the point is on the lateral side of the upper arm, 1 cun above Quchi (LI 11), on the border of humerus.","ind":"pain, numbness and contracture of the elbow and arm.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"ג'וֹ לְיָאו","heL":"כשהמרפק כפוף — בצד החיצוני של הזרוע העליונה, 1 צוּן מעל צ'וּ צְ'ה (LI 11), על שולי עצם הזרוע."},{"c":"LI 13","py":"Shouwuli","zh":"手五里","m":"LI","loc":"On the lateral side of the upper arm, on the line connecting Quchi (LI 11) and Jianyu (LI 15), 3 cun above Quchi (LI 11).","ind":"contracture and pain of the elbow and arm, scrofula.","mth":"Puncture perpendicularly 0.5-1.0 inch. Avoid injuring the artery.","heN":"שׁוֹ ווּ לִי","heL":"בצד החיצוני של הזרוע העליונה, על הקו המחבר בין צ'וּ צְ'ה (LI 11) לגְ'יֶן יוּ (LI 15), 3 צוּן מעל צ'וּ צְ'ה."},{"c":"LI 14","py":"Binao","zh":"臂臑","m":"LI","loc":"On the lateral side of the upper arm, on the line joining Quchi (Ll 11) and Jianyu (LI 15), 7 cun above Quchi (Ll 11), at the insertion of m. deltoideus.","ind":"pain in the shoulder and arm, rigidity of the neck, scrofula.","mth":"Puncture perpendicularly or obliquely upward 0.8-1.5 inches. Moxibustion is applicable.","heN":"בִּי נָאו","heL":"בצד החיצוני של הזרוע העליונה, על הקו המחבר בין צ'וּ צְ'ה (LI 11) לגְ'יֶן יוּ (LI 15), 7 צוּן מעל צ'וּ צְ'ה, במקום היאחזות השריר הדלטואידי."},{"c":"LI 15","py":"Jianyu","zh":"肩髃(髃)","m":"LI","loc":"Antero-inferior to the acromion, on the upper portion of m. deltoideus. When the arm is in full abduction, the point is in the depression appearing at the anterior border of the acromioclavicular joint.","ind":"pain in the shoulder and arm, motor impairment of the upper extremities, rubella, scrofula.","mth":"Puncture perpendicularly or obliquely 0.8-1.5 inches. Moxibustion is applicable.","heN":"גְ'יֶן יוּ","heL":"קדמית־תחתית לאקרומיון, בחלק העליון של השריר הדלטואידי. כשהזרוע מורחקת במלואה, הנקודה בשקע שנפער בשוליים הקדמיים של המפרק האקרומיוקלביקולרי."},{"c":"LI 16","py":"Jugu","zh":"巨骨(骨)","m":"LI","loc":"In the upper aspect of the shoulder, in the depression between the acromial extremity of the clavicle and the scapular spine.","ind":"pain and motor impairment of the upper extremities, pain in the shoulder and back.","mth":"Puncture perpendicularly 0.5-0.7 inch. Moxibustion is applicable.","heN":"גּ'וּ גוּ","heL":"בחלק העליון של הכתף, בשקע שבין קצה עצם הבריח (הצד האקרומיאלי) לקוץ עצם השכם."},{"c":"LI 17","py":"Tianding","zh":"天鼎","m":"LI","loc":"On the lateral side of the neck, at the posterior border of sternocleidomastoid muscle, beside the laryngeal protuberance, at the midpoint of the line connecting Futu (LI 18) and Quepen (ST 12).","ind":"sudden loss of voice, sore throat, scrofula, goiter.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"טְיֵין דִינְג","heL":"בצד של הצוואר, בשוליים האחוריים של השריר הסטרנוקלידומסטואידי, לצד בליטת הגרון, באמצע הקו המחבר בין פוּ טוּ (LI 18) לצְ'וֶוה פֶּן (ST 12)."},{"c":"LI 18","py":"Futu","zh":"扶突","m":"LI","loc":"On the lateral side of the neck, level with the tip of Adam's apple, between the sternal head and clavicular head of m. sternocleidomastoideus.","ind":"cough, asthma, sore throat, sudden loss of voice, scrofula, goiter.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"פוּ טוּ","heL":"בצד של הצוואר, בגובה קצה בליטת הגרון (פיקת אדם), בין הראש החזי לראש הבריחי של השריר הסטרנוקלידומסטואידי."},{"c":"LI 19","py":"Kouheliao","zh":"口禾髎(髎)","m":"LI","loc":"Right below the lateral margin of the nostril, level with Renzhong (Shuigou, GV 26).","ind":"nasal obstruction, epistaxis, deviation of the mouth.","mth":"Puncture obliquely 0.2-0.3 inch.","heN":"קוֹ חֶה לְיָאו","heL":"ממש מתחת לשולי הנחיר החיצוניים, בגובה רֶן ג'וֹנְג (שְׁוֵוי גוֹ, GV 26)."},{"c":"LI 20","py":"Yingxiang","zh":"迎(迎)香","m":"LI","loc":"In the nasolabial groove, at the level of the midpoint of the lateral border of ala nasi.","ind":"nasal obstruction, hyposmia, epistaxis, rhinorrhea, deviation of the mouth, itching and swelling of the face.","mth":"Puncture obliquely or subcutaneously 0.3-0.5 inch.","heN":"יִינְג שְׂיָאנְג","heL":"בחריץ האף־שפתי, בגובה אמצע השוליים החיצוניים של כנף האף."},{"c":"ST 1","py":"Chengqi","zh":"承泣","m":"ST","loc":"With the eyes looking straight forward, the point is directly below the pupil, between the eyeball and the infraorbital ridge.","ind":"redness, swelling and pain of the eye, lacrimation, night blindness, eyelid twitching, facial paralysis (bell's palsy).","mth":"Push the eyeball upward with the left thumb and puncture perpendicularly and slowly 0.5-1.0 inch along the infraorbital ridge. It is not advisable to manipulate the needle with large amplitude.","heN":"צֶ'נְג צִ'י","heL":"כשהמבט ישר קדימה — ישירות מתחת לאישון, בין גלגל העין לרכס ארובת העין התחתון."},{"c":"ST 2","py":"Sibai","zh":"四白","m":"ST","loc":"Directly below the pupil, in the depression at the infraorbital foramen.","ind":"redness, pain and itching of the eye, facial paralysis, eyelid twitching, pain in the face.","mth":"Puncture perpendicularly 0.2-0.3 inch. It is not advisable to puncture deeply.","heN":"סְה בַּאי","heL":"ישירות מתחת לאישון, בשקע שבנקב ארובת העין התחתון."},{"c":"ST 3","py":"Juliao","zh":"巨髎(髎)","m":"ST","loc":"Directly below the pupil, at the level of the lower border of ala nasi, on the lateral side of the nasolabial groove.","ind":"facial paralysis, eyelid twitching, epistaxis, toothache, swelling of lips and cheek.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"גּ'וּ לְיָאו","heL":"ישירות מתחת לאישון, בגובה השוליים התחתונים של כנף האף, בצד החיצוני של החריץ האף־שפתי."},{"c":"ST 4","py":"Dicang","zh":"地倉(仓)","m":"ST","loc":"Lateral to the corner of the mouth, directly below the pupil.","ind":"deviation of the mouth, hypersalivation, eyelid twitching.","mth":"","heN":"דִי צָאנְג","heL":"לרוחב מזווית הפה, ישירות מתחת לאישון."},{"c":"ST 5","py":"Daying","zh":"大迎(迎)","m":"ST","loc":"Anterior to the angle of mandible, on the anterior border of the attached portion of m. masseter where the pulsation of facial artery is palpable, in the groove-like depression appearing when the cheek is bulged.","ind":"facial paralysis, trismus, swelling of the cheek, facial pain, toothache.","mth":"Avoid puncturing the artery. Puncture obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"דָא יִינְג","heL":"קדמית לזווית הלסת התחתונה, על השוליים הקדמיים של שריר הלעיסה (masseter), במקום שבו נמושת פעימת עורק הפנים, בשקע שנפער כשמנפחים את הלחי."},{"c":"ST 6","py":"Jiache","zh":"頰(颊)車(车)","m":"ST","loc":"One finger-breadth (middle finger) anterior and superior to the lower angle of the mandible where m. masseter is prominence when the teeth are clenched and depressive when it is pressed.","ind":"facial paralysis, toothache, swelling of the cheek and face, mumps, trismus.","mth":"","heN":"גְ'יָה צֶ'ה","heL":"רוחב אצבע (האצבע האמצעית) קדמית ומעל לזווית התחתונה של הלסת, במקום שבו שריר הלעיסה בולט בנעיצת השיניים ושוקע בלחיצה."},{"c":"ST 7","py":"Xiaguan","zh":"下關(关,関)","m":"ST","loc":"On the face, anterior to the ear, in the depression between the zygomatic arch and the mandibular notch. This point is located with the mouth closed.","ind":"deafness, tinnitus, otorrhea, toothache, facial paralysis, pain of the face, motor impairment of the jaw.","mth":"Puncture perpendicularly 0.1- 0.5 cun. Moxibustion is applicable.","heN":"שְׂיָה גְוָאן","heL":"בפנים, קדמית לאוזן, בשקע שבין קשת עצם הלחי לחריץ הלסת. מאתרים כשהפה סגור."},{"c":"ST 8","py":"Touwei","zh":"頭(头)維(维)","m":"ST","loc":"On the lateral side of the head, 0.5 cun above the anterior hairline at the corner of the forehead, and 4.5 cun lateral to the midline of the head.","ind":"headache, blurred vision, ophthalmalgia, lacrimation.","mth":"Puncture 0.5-1.0 inch subcutaneously.","heN":"טוֹ וֵיי","heL":"בצד הראש, 0.5 צוּן מעל קו השיער הקדמי בפינת המצח, 4.5 צוּן לרוחב מקו האמצע של הראש."},{"c":"ST 9","py":"Renying","zh":"人迎(迎)","m":"ST","loc":"Level with the tip of Adam's apple where the pulsation of common carotid artery is palpable, on the anterior border of sternocleidomastoid muscle.","ind":"sore throat, asthma, goiter, dizziness, flushing of the face.","mth":"Avoid puncturing the common carotid artery, puncture perpendicularly 0.3-0.5 inch.","heN":"רֶן יִינְג","heL":"בגובה קצה בליטת הגרון, במקום שבו נמושת פעימת עורק התרדמה המשותף, על השוליים הקדמיים של השריר הסטרנוקלידומסטואידי."},{"c":"ST 10","py":"Shuitu","zh":"水突","m":"ST","loc":"At the midpoint of the line joining Renying (ST 9) and Qishe (ST 11), on the anterior border of m. sternocleidomastoid muscle.","ind":"sore throat, asthma, cough.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"שְׁוֵוי טוּ","heL":"באמצע הקו המחבר בין רֶן יִינְג (ST 9) לצִ'י שֶׁה (ST 11), על השוליים הקדמיים של השריר הסטרנוקלידומסטואידי."},{"c":"ST 11","py":"Qishe","zh":"氣(气,気)舍(舎)","m":"ST","loc":"At the superior border of the sternal extremity of the clavicle, between the sternal head and clavicular head of m. sternocleidomastoideus.","ind":"sore throat, pain and rigidity of the neck, asthma, hiccup, goiter.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"צִ'י שֶׁה","heL":"בשוליים העליונים של הקצה החזי של עצם הבריח, בין הראש החזי לראש הבריחי של השריר הסטרנוקלידומסטואידי."},{"c":"ST 12","py":"Quepen","zh":"缺盆","m":"ST","loc":"In the midpoint of the supraclavicular fossa, 4 cun lateral to the anterior midline.","ind":"cough, asthma, sore throat, pain in the supraclavicular fossa.","mth":"Avoid puncturing the artery. Puncture perpendicularly 0.3-0.5 inch.","heN":"צְ'וֶוה פֶּן","heL":"באמצע הבור העל־בריחי, 4 צוּן לרוחב מקו האמצע הקדמי."},{"c":"ST 13","py":"Qihu","zh":"氣(气,気)戶","m":"ST","loc":"At the lower border of the middle of the clavicle, 4 cun lateral to the anterior midline.","ind":"fullness in the chest, asthma, cough, hiccup, chest pain and hypochondriac pain.","mth":"","heN":"צִ'י חוּ","heL":"בשוליים התחתונים של אמצע עצם הבריח, 4 צוּן לרוחב מקו האמצע הקדמי."},{"c":"ST 14","py":"Kufang","zh":"庫(库)房","m":"ST","loc":"In the 1st intercostal space, 4 cun lateral to the anterior midline.","ind":"sensation of fullness in the chest, chest pain, cough.","mth":"Puncture‚Ä¢ obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"קוּ פָאנְג","heL":"במרווח הבין־צלעי הראשון, 4 צוּן לרוחב מקו האמצע הקדמי."},{"c":"ST 15","py":"Wuyi","zh":"屋翳","m":"ST","loc":"In the 2nd intercostal space, 4 cun lateral to the anterior midline.","ind":"fullness and pain in the chest and the costal region, cough, asthma, mastitis.","mth":"","heN":"ווּ יִי","heL":"במרווח הבין־צלעי השני, 4 צוּן לרוחב מקו האמצע הקדמי."},{"c":"ST 16","py":"Yingchuang","zh":"膺窗(窓)","m":"ST","loc":"In the 3rd intercostal space, 4 cun lateral to the anterior midline.","ind":"fullness and pain in the chest and hypochondrium, cough, asthma, mastitis.","mth":"Puncture obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"יִינְג צְ'וָאנְג","heL":"במרווח הבין־צלעי השלישי, 4 צוּן לרוחב מקו האמצע הקדמי."},{"c":"ST 17","py":"Ruzhong","zh":"(乳)中","m":"ST","loc":"In the 4th intercostal space, in the centre of the nipple, 4 cun lateral to the anterior midline.","ind":"","mth":"","heN":"רוּ ג'וֹנְג","heL":"במרווח הבין־צלעי הרביעי, במרכז הפטמה, 4 צוּן לרוחב מקו האמצע הקדמי."},{"c":"ST 18","py":"Rugen","zh":"(乳)根","m":"ST","loc":"On the chest, directly below the nipple, on the lower border of breast, in the 5th intercostal space, 4 cun laterals to the anterior midline.","ind":"pain in the chest, cough, asthma, mastitis, insufficient lactation.","mth":"Puncture obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"רוּ גֶן","heL":"בבית החזה, ישירות מתחת לפטמה, בשוליים התחתונים של השד, במרווח הבין־צלעי החמישי, 4 צוּן לרוחב מקו האמצע הקדמי."},{"c":"ST 19","py":"Burong","zh":"不容","m":"ST","loc":"6 cun above the umbilicus, 2 cun lateral to Juque (CV 14).","ind":"abdominal distension, vomiting, gastric pain, anorexia.","mth":"Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.","heN":"בּוּ רוֹנְג","heL":"6 צוּן מעל הטבור, 2 צוּן לרוחב מגּ'וּ צְ'וֶוה (CV 14)."},{"c":"ST 20","py":"Chengman","zh":"承滿(满,満)","m":"ST","loc":"5 cun above the umbilicus, 2 cun lateral to Shangwan (CV 13).","ind":"gastric pain, abdominal distension, vomiting, anorexia.","mth":"","heN":"צֶ'נְג מָאן","heL":"5 צוּן מעל הטבור, 2 צוּן לרוחב משָׁאנְג וָאן (CV 13)."},{"c":"ST 21","py":"Liangmen","zh":"梁門(门)","m":"ST","loc":"4 cun above the umbilicus, 2 cun lateral to Zhongwan (CV 12).","ind":"gastric pain, vomiting, anorexia, abdominal distension, diarrhea.","mth":"Puncture perpendicularly 0.8-1.0 inch. Moxibustion is applicable.","heN":"לְיָאנְג מֶן","heL":"4 צוּן מעל הטבור, 2 צוּן לרוחב מג'וֹנְג וָאן (CV 12)."},{"c":"ST 22","py":"Guanmen","zh":"關(关,関)門(门)","m":"ST","loc":"3 cun above the umbilicus, 2 cun lateral to Jianli (CV 11).","ind":"abdominal distension and pain, anorexia, borborygmus, diarrhea, edema.","mth":"","heN":"גְוָאן מֶן","heL":"3 צוּן מעל הטבור, 2 צוּן לרוחב מגְּ'יֶן לִי (CV 11)."},{"c":"ST 23","py":"Taiyi","zh":"太乙","m":"ST","loc":"2 cun above the umbilicus, 2 cun lateral to Xiawan (CV 10).","ind":"gastric pain, irritability, mania, indigestion.","mth":"Puncture perpendicularly 0.7-1.0 inch. Moxibustion is applicable.","heN":"טַאי יִי","heL":"2 צוּן מעל הטבור, 2 צוּן לרוחב משְׂיָה וָאן (CV 10)."},{"c":"ST 24","py":"Huaroumen","zh":"滑(滑)肉門(门)","m":"ST","loc":"1 cun above the umbilicus, 2 cun lateral to Shuifen (CV 9).","ind":"gastric pain, vomiting, mania.","mth":"","heN":"חוּאָה רוֹ מֶן","heL":"1 צוּן מעל הטבור, 2 צוּן לרוחב משְׁוֵוי פֶן (CV 9)."},{"c":"ST 25","py":"Tianshu","zh":"天樞(枢)","m":"ST","loc":"2 cun lateral to the centre of the umbilicus.","ind":"abdominal pain and distension, borborygmus, pain around the umbilicus, constipation, diarrhea, dysentery, irregular menstruation, edema.","mth":"Puncture perpendicularly 0.7-1.2 inches. Moxibustion is applicable.","heN":"טְיֵין שׁוּ","heL":"2 צוּן לרוחב ממרכז הטבור."},{"c":"ST 26","py":"Wailing","zh":"外陵","m":"ST","loc":"1 cun below the umbilicus, 2 cun lateral to Yinjiao (CV 7).","ind":"abdominal pain, hernia, dysmenorrhea.","mth":"Puncture perpendicularly 0.7-1.2 inches. Moxibustion is applicable.","heN":"וַאי לִינְג","heL":"1 צוּן מתחת לטבור, 2 צוּן לרוחב מיִין גְ'יָאו (CV 7)."},{"c":"ST 27","py":"Daju","zh":"大巨","m":"ST","loc":"2 cun below the umbilicus, 2 cun lateral to Shimen (CV 5).","ind":"lower abdominal distension, dysuria, hernia, seminal emission, premature ejaculation.","mth":"Puncture perpendicularly 0.7-1.2 inches. Moxibustion is applicable.","heN":"דָא גּ'וּ","heL":"2 צוּן מתחת לטבור, 2 צוּן לרוחב משִׁי מֶן (CV 5)."},{"c":"ST 28","py":"Shuidao","zh":"水道(道)","m":"ST","loc":"3 cun below the umbilicus, 2 cun lateral to Guanyuan (CV 4).","ind":"lower abdominal distension, retention of urine, edema, hernia, dysmenorrhea, sterility.","mth":"Puncture perpendicularly 0.7-1.2 inches. Moxibustion is applicable.","heN":"שְׁוֵוי דָאו","heL":"3 צוּן מתחת לטבור, 2 צוּן לרוחב מגְוָאן יוּאָן (CV 4)."},{"c":"ST 29","py":"Guilai","zh":"歸(归,帰)來(来)","m":"ST","loc":"4 cun below the umbilicus, 2 cun lateral to Zhongji (CV 3).","ind":"abdominal pain, hernia, dysmenorrhea, irregular menstruation, amenorrhea, leukorrhea, prolapse of the uterus.","mth":"Puncture perpendicularly 0.7-1.2 inches. Moxibustion is applicable.","heN":"גְוֵוי לַאי","heL":"4 צוּן מתחת לטבור, 2 צוּן לרוחב מג'וֹנְג גִּ'י (CV 3)."},{"c":"ST 30","py":"Qichong","zh":"氣(气,気)衝(冲)","m":"ST","loc":"5 cun below the umbilicus, 2 cun lateral to Qugu (CV 2).","ind":"abdominal pain, borborygmus, hernia, swelling and pain of the external genitalia, impotence, dysmenorrhea, irregular menstruation.","mth":"","heN":"צִ'י צ'וֹנְג","heL":"5 צוּן מתחת לטבור, 2 צוּן לרוחב מצ'וּ גוּ (CV 2)."},{"c":"ST 31","py":"Biguan","zh":"髀(髀)關(关,関)","m":"ST","loc":"On the anterior side of the thigh and on the line connecting the anterosuperior iliac spine and the superiolateral corner of the patella, on the level of the perineum when the thigh is fixed, in the depression lateral to the sartorius muscle.","ind":"pain in the thigh, muscular atrophy, motor impairment, numbness and pain of the lower extremities.","mth":"Puncture perpendicularly 1.0-1.5 inches. Moxibustion is applicable.","heN":"בִּי גְוָאן","heL":"בצד הקדמי של הירך, על הקו המחבר בין קוץ הכסל הקדמי־עליון לפינה העליונה־חיצונית של פיקת הברך, בגובה הפרינאום כשהירך מקובעת, בשקע הלטרלי לשריר החייטי."},{"c":"ST 32","py":"Futu","zh":"伏兎(兔)","m":"ST","loc":"On the line connecting the anterior superior iliac spine and lateral border of the patella, 6 cun above the laterosuperior border of the patella.","ind":"pain in the lumbar and iliac region, coldness of the knee, paralysis or motor impairment and pain of the lower extremities, beriberi.","mth":"Puncture perpendicularly 1.0-1.5 inches. Moxibustion is applicable.","heN":"פוּ טוּ","heL":"על הקו המחבר בין קוץ הכסל הקדמי־עליון לשוליים החיצוניים של פיקת הברך, 6 צוּן מעל השוליים העליונים־חיצוניים של פיקת הברך."},{"c":"ST 33","py":"Yinshi","zh":"陰(阴)市","m":"ST","loc":"When the knee is flexed, the point is 3 cun above the laterosuperior border of the patella, on the line joining the laterosuperior border of the patella and the anterior superior iliac spine.","ind":"numbness, soreness, motor impairment of the leg and knee, motor impairment of the lower extremities.","mth":"Puncture perpendicularly 0.7-1.0 inch. Moxibustion is applicable.","heN":"יִין שִׁי","heL":"כשהברך כפופה — 3 צוּן מעל השוליים העליונים־חיצוניים של פיקת הברך, על הקו המחבר בין שוליים אלה לקוץ הכסל הקדמי־עליון."},{"c":"ST 34","py":"Liangqiu","zh":"梁丘","m":"ST","loc":"When the knee is flexed, the point is 2 cun above the laterosuperior border of the patella.","ind":"pain and numbness of the knee, gastric pain, mastitis, motor impairment of the lower extremities.","mth":"Puncture perpendicularly 05-1.0 inch. Moxibustion is applicable.","heN":"לְיָאנְג צְ'יוּ","heL":"כשהברך כפופה — 2 צוּן מעל השוליים העליונים־חיצוניים של פיקת הברך."},{"c":"ST 35","py":"Dubi","zh":"犢(犊)鼻","m":"ST","loc":"When the knee is flexed, the point is at the lower border of the patella, in the depression lateral to the patellar ligament.","ind":"pain, numbness and motor impairment of the knee, beriberi.","mth":"Puncture perpendicularly 0.7-1.0 inch. Moxibustion is applicable.","heN":"דוּ בִּי","heL":"כשהברך כפופה — בשוליים התחתונים של פיקת הברך, בשקע הלטרלי לרצועת הפיקה."},{"c":"ST 36","py":"Zusanli","zh":"足三里","m":"ST","loc":"3 cun below Dubi (ST 35), one finger-breadth (middle finger) from the anterior border of the tibia.","ind":"gastric pain, vomiting, hiccup, abdominal distension, borborygmus, diarrhea, dysentery, constipation, mastitis, enteritis, aching of the knee joint and leg, beriberi, edema, cough, asthma, emaciation due to general deficiency, indigestion, apoplexy, hemiplegia, dizziness, insomnia, mania.","mth":"Puncture perpendicularly 0.5-1.2 inches. Moxibustion is applicable.","heN":"דְזוּ סָאן לִי","heL":"כארבע אצבעות מתחת לפיקת הברך, מעט החוצה מעצם השוק, בתוך שריר השוק הקדמי.","heA":"נקודה מרכזית במרידיאן הקיבה. במסורת היא משויכת לעיכול, לבטן, לחיוניות ולברך ולרגל."},{"c":"ST 37","py":"Shangjuxu","zh":"上巨虛(虚)","m":"ST","loc":"6 cun below Dubi (ST 35), and one finger breadth (middle finger) from the anterior border of the tibia.","ind":"abdominal pain and distension, borborygmus, diarrhea, dysentery, constipation, enteritis, paralysis due to stroke, beriberi.","mth":"Puncture perpendicularly 0.5-1.2 inches. Moxibustion is applicable.","heN":"שָׁאנְג גּ'וּ שׂוּ","heL":"6 צוּן מתחת לדוּ בִּי (ST 35), רוחב אצבע (האצבע האמצעית) lar atrophy, motor impairment, pain and paralysis of the lower extremities, epilepsy, headache, dizziness and vertigo, abdominal distension, constipation.","mth":"Puncture perpendicularly 0.5-0.7 inch. Moxibustion is applicable.","heN":"גְ'יֶה שִׂי","heL":"בגב כף הרגל, באמצע הקפל הרוחבי של מפרק הקרסול, בשקע שבין גידי מיישר האצבעות הארוך ומיישר הבוהן הארוך, בערך בגובה קצה הקרסול החיצוני."},{"c":"ST 42","py":"Chongyang","zh":"衝(冲)陽(阳)","m":"ST","loc":"On the dome of the instep of the foot, between the tendons of long extensor muscle of the great toe and long extensor muscle of toes, where the pulsation of the dorsal artery of foot is palpable.","ind":"pain of the upper teeth, redness and swelling of the dorsum of the foot, facial paralysis, muscular atrophy and motor impairment of the foot.","mth":"Avoid puncturing the artery.","heN":"צ'וֹנְג יָאנְג","heL":"בקמרון גב כף הרגל, בין גידי מיישר הבוהן הארוך למיישר האצבעות הארוך, במקום שבו נמושת פעימת עורק גב כף הרגל."},{"c":"ST 43","py":"Xiangu","zh":"陷(陥)谷","m":"ST","loc":"In the depression distal to the junction of the second and third metatarsal bones.","ind":"facial or general edema, abdominal pain, borborygmus, swelling and pain of the dorsum of the foot.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"שְׂיָאן גוּ","heL":"בשקע דיסטלית למפגש עצמות כף הרגל השנייה והשלישית."},{"c":"ST 44","py":"Neiting","zh":"内庭","m":"ST","loc":"Proximal to the web margin between the 2nd and 3rd toes, in the depression distal and lateral to the 2nd metatarsodigital joint.","ind":"toothache, pain in the face, deviation of the mouth, sore throat, epistaxis, gastric pain, acid regurgitation, abdominal distension, diarrhea, dysentery, constipation, swelling and pain of the dorsum of the foot, febrile diseases.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"נֵיי טִינְג","heL":"פרוקסימלית לשולי הקרום שבין האצבעות השנייה והשלישית, בשקע דיסטלית ולרוחב ממפרק כף־הרגל–אצבע השני."},{"c":"ST 45","py":"Lidui","zh":"厲(厉)兌(兑)","m":"ST","loc":"On the lateral side of the 2nd toe, 0.1 cun posterior to the corner of the nail.","ind":"facial swelling, deviation of the mouth, epistaxis, toothache, sore throat and hoarse voice, abdominal distension, coldness in the leg and foot, febrile diseases, dream-disturbed sleep, mania.","mth":"Puncture subcutaneously 0.1 inch. Moxibustion is applicable.","heN":"לִי דְוֵוי","heL":"בצד החיצוני של האצבע השנייה, 0.1 צוּן מאחורי פינת הציפורן."},{"c":"SP 1","py":"Yinbai","zh":"隱(隐,隠)白","m":"SP","loc":"On the medial side of the great toe, 0.1 cun posterior to the corner of the nail.","ind":"abdominal distension, bloody stools, menorrhagia, uterine bleeding, mental disorder, dream-disturbed sleep, convulsion.","mth":"Puncture subcutaneously 0.1 inch. Moxibustion is applicable.","heN":"יִין בַּאי","heL":"בצד המדיאלי של הבוהן הגדולה, 0.1 צוּן מאחורי פינת הציפורן."},{"c":"SP 2","py":"Dadu","zh":"大都(都)","m":"SP","loc":"On the medial side of the great toe, distal and inferior to the first metatarsal digital joint, in the depression of the junction of the red and white skin.","ind":"abdominal distension, gastric pain, constipation, febrile diseases with anhidrosis.","mth":"Puncture perpendicularly 0.1-0.3 inch. Moxibustion is applicable.","heN":"דָא דוּ","heL":"בצד המדיאלי של הבוהן הגדולה, דיסטלית ותחתית למפרק כף־הרגל–אצבע הראשון, בשקע שבמפגש העור האדום והלבן."},{"c":"SP 3","py":"Taibai","zh":"太白","m":"SP","loc":"Proximal and inferior to the 1st metatarsophalangeal joint, in the depression of the junction of the red and white skin.","ind":"gastric pain, abdominal distension, constipation, dysentery, vomiting diarrhea, borborygmus, sluggishness, beriberi.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"טַאי בַּאי","heL":"פרוקסימלית ותחתית למפרק כף־הרגל–אצבע הראשון, בשקע שבמפגש העור האדום והלבן."},{"c":"SP 4","py":"Gongsun","zh":"公孫(孙)","m":"SP","loc":"In the depression distal and inferior to the base of the first metatarsal bone, at the junction of the red and white skin.","ind":"gastric pain, vomiting, abdominal pain and distension, diarrhea, dysentery, borborygmus.","mth":"Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.","heN":"גּוֹנְג סוּן","heL":"בשקע דיסטלית ותחתית לבסיס עצם כף הרגל הראשונה, במפגש העור האדום והלבן."},{"c":"SP 5","py":"Shangqiu","zh":"商丘","m":"SP","loc":"In the depression distal and inferior to the medial malleolus, midway between the tuberosity of the navicular bone and the tip of the medial malleolus.","ind":"abdominal distension, constipation, diarrhea, borborygmus, pain and rigidity of the tongue, pain in the foot and ankle, hemorrhoids.","mth":"Puncture perpendicularly 0.2-0.3 inch. Moxibustion is applicable.","heN":"שָׁאנְג צְ'יוּ","heL":"בשקע דיסטלית ותחתית לקרסול הפנימי, באמצע הדרך בין פקעת עצם הסירה (navicular) לקצה הקרסול הפנימי."},{"c":"SP 6","py":"Sanyinjiao","zh":"三陰(阴)交","m":"SP","loc":"3 cun directly above the tip of the medial malleolus, posterior to the medial border of the tibia.","ind":"abdominal pain, borborygmus, abdominal distension, diarrhea, dysmenorrhea, irregular menstruation, uterine bleeding, morbid leukorrhea, prolapse of the uterus, infertility, delayed labor, nocturnal emission, impotence, enuresis, dysuria, edema, hernia, pain in the external genitalia, muscular atrophy, motor impairment, paralysis and pain of the lower extremities, headache, dizziness and vertigo, insomnia.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable. Acupuncture on this point is contraindicated in pregnant women.","heN":"סָאן יִין גְ'יָאו","heL":"ארבע אצבעות מעל הבליטה הפנימית של הקרסול, ממש מאחורי השפה הפנימית של עצם השוק.","heA":"נקודת מפגש מסורתית של שלושה מרידיאנים. משויכת לבטן התחתונה, לעיכול, לשינה ולמערכת הרבייה.","heC":"בהריון אין ללחוץ על נקודה זו ללא הנחיה מקצועית."},{"c":"SP 7","py":"Lougu","zh":"漏谷","m":"SP","loc":"6 cun from the tip of the medial malleolus, on the line connecting the tip of the medial malleolus and Yinlingquan (SP 9), posterior to the medial border of the tibia.","ind":"abdominal distension, borborygmus, coldness, numbness and paralysis of the knee and leg.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"לוֹ גוּ","heL":"6 צוּן מקצה הקרסול הפנימי, על הקו המחבר בין קצה הקרסול הפנימי ליִין לִינְג צְ'וֶון (SP 9), אחורית לשוליים המדיאליים של עצם השוק."},{"c":"SP 8","py":"Diji","zh":"地機(机)","m":"SP","loc":"3 cun below Yinlingquan (SP 9), on the line connecting Yinlingquan (SP 9) and the medial malleolus.","ind":"abdominal pain and distension, diarrhea, edema, dysuria, nocturnal emission, irregular menstruation, dysmenorrhea.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"דִי גִּ'י","heL":"3 צוּן מתחת ליִין לִינְג צְ'וֶון (SP 9), על הקו המחבר בין יִין לִינְג צְ'וֶון (SP 9) לקרסול הפנימי."},{"c":"SP 9","py":"Yinlingquan","zh":"陰(阴)陵泉","m":"SP","loc":"On the lower border of the medial condyle of the tibia, in the depression posterior and inferior to the midial condyle of the tibia.","ind":"abdominal pain and distension, diarrhea, dysentery, edema, jaundice, dysuria, enuresis, urinary incontinence, pain in the external genitalia, dysmenorrhea, pain in the knee.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"יִין לִינְג צְ'וֶון","heL":"על השוליים התחתונים של הבליטה הפרקית המדיאלית של עצם השוק, בשקע האחורי־תחתי לבליטה זו."},{"c":"SP 10","py":"Xuehai","zh":"血海(海)","m":"SP","loc":"When the knee is flexed, the point is 2 cun above the medial superior border of the patella, on the bulge of the medial portion of m. quadriceps femoris. Or when the patient's knee is flexed, cup your right palm to his left knee, with the thumb on the medial side and with the other four fingers directed proximally, and the thumb forming an angle of 45¬∞ with the index finger. The point is where the tip of your thumb rests.","ind":"irregular menstruation, dysmenorrhea, uterine bleeding, amenorrhea, urticaria, eczema, erysipelas, pain in the medial aspect of the thigh.","mth":"Puncture perpendicularly 0.5-1.2 inches. Moxibustion is applicable.","heN":"שְׂוֶוה חַאי","heL":"כשהברך כפופה — 2 צוּן מעל השוליים העליונים־מדיאליים של פיקת הברך, על הבליטה של החלק המדיאלי של השריר הארבע־ראשי הירכי."},{"c":"SP 11","py":"Jimen","zh":"箕門(门)","m":"SP","loc":"6 cun above Xuehai (SP 10), on the line drawn from Xuehai (SP 10) to Chongmen (SP 12).","ind":"dysuria, enuresis, pain and swelling in the inguinal region, muscular atrophy, motor impairment, pain and paralysis of the lower extremities.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"גִּ'י מֶן","heL":"6 צוּן מעל שְׂוֶוה חַאי (SP 10), על הקו מ־שְׂוֶוה חַאי (SP 10) לצ'וֹנְג מֶן (SP 12)."},{"c":"SP 12","py":"Chongmen","zh":"衝(冲)門(门)","m":"SP","loc":"Superior to the lateral end of the inguinal groove, lateral to the pulsating external iliac artery, at the level of the upper border of symphysis pubis, 3.5 cun lateral to Qugu (CV 2).","ind":"abdominal pain, hernia, dysuria.","mth":"Avoid puncturing the artery.","heN":"צ'וֹנְג מֶן","heL":"מעל הקצה החיצוני של חריץ המפשעה, לרוחב מעורק הכסל החיצוני הפועם, בגובה השוליים העליונים של צמת החיק, 3.5 צוּן לרוחב מצ'וּ גוּ (CV 2)."},{"c":"SP 13","py":"Fushe","zh":"府舍(舎)","m":"SP","loc":"4 cun below the centre of the umbilicus, 0.7 cun superior to Chongmen (SP 12), 4 cun lateral to the anterior midline.","ind":"lower abdominal pain, hernia.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"פוּ שֶׁה","heL":"4 צוּן מתחת למרכז הטבור, 0.7 צוּן מעל צ'וֹנְג מֶן (SP 12), 4 צוּן לרוחב מקו האמצע הקדמי."},{"c":"SP 14","py":"Fujie","zh":"腹結(结)","m":"SP","loc":"1.3 cun below Daheng (SP 15), 4 cun lateral to the anterior midline, on the lateral side of m. rectus abdominis.","ind":"pain around the umbilical region, abdominal distension, hernia, diarrhea, constipation.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"פוּ גְּ'יֶה","heL":"1.3 צוּן מתחת לדָא חֶנְג (SP 15), 4 צוּן לרוחב מקו האמצע הקדמי, בצד החיצוני של שריר הבטן הישר."},{"c":"SP 15","py":"Daheng","zh":"大橫","m":"SP","loc":"4 cun lateral to the center of the umbilicus, lateral to m. rectus abdominis..","ind":"abdominal pain and distension, diarrhea, dysentery, constipation.","mth":"Puncture perpendicularly 0.7-1.2 inches. Moxibustion is applicable.","heN":"דָא חֶנְג","heL":"4 צוּן לרוחב ממרכז הטבור, לרוחב משריר הבטן הישר."},{"c":"SP 16","py":"Fuai","zh":"腹哀","m":"SP","loc":"3 cun above the centre of the umbilicus, and 4 cun lateral to the anterior midline.","ind":"abdominal pain, indigestion, constipation, dysentery.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"פוּ אַאי","heL":"3 צוּן מעל מרכז הטבור, 4 צוּן לרוחב מקו האמצע הקדמי."},{"c":"SP 17","py":"Shidou","zh":"食竇(窦)","m":"SP","loc":"In the 5th intercostal space, 6 cun lateral to the anterior midline.","ind":"fullness and pain in the chest and hypochondriac region.","mth":"Puncture obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"שִׁי דוֹ","heL":"במרווח הבין־צלעי החמישי, 6 צוּן לרוחב מקו האמצע הקדמי."},{"c":"SP 18","py":"Tianxi","zh":"天谿(溪)","m":"SP","loc":"In the 4th intercostal space, 6 cun lateral to the anterior midline.","ind":"fullness and pain in the chest and hypochondrium, cough, hiccup, mastitis, insufficient lactation.","mth":"Puncture obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"טְיֵין שִׂי","heL":"במרווח הבין־צלעי הרביעי, 6 צוּן לרוחב מקו האמצע הקדמי."},{"c":"SP 19","py":"Xiongxiang","zh":"胸鄉(乡,郷)","m":"SP","loc":"In the 3rd intercostal space, 6 cun lateral to the anterior midline.","ind":"fullness and pain in the chest and hypochondriac region.","mth":"Puncture obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"שְׂיוֹנְג שְׂיָאנְג","heL":"במרווח הבין־צלעי השלישי, 6 צוּן לרוחב מקו האמצע הקדמי."},{"c":"SP 20","py":"Zhourong","zh":"周榮(荣,栄)","m":"SP","loc":"In the 2nd intercostal space, 6 cun lateral to the anterior midline.","ind":"fullness in the chest and hypochondriac region, cough, hiccup.","mth":"Puncture obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"ג'וֹ רוֹנְג","heL":"במרווח הבין־צלעי השני, 6 צוּן לרוחב מקו האמצע הקדמי."},{"c":"SP 21","py":"Dabao","zh":"大包(包)","m":"SP","loc":"On the lateral side of the chest and on the middle axillary line, in the 6th intercostal space.","ind":"pain in the chest and hypochondriac region, asthma, general aching and weakness.","mth":"Puncture obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"דָא בָּאו","heL":"בצד של בית החזה, על הקו האמצעי של בית השחי, במרווח הבין־צלעי השישי."},{"c":"HT 1","py":"Jiquan","zh":"極(极)泉","m":"HT","loc":"When the upper arm is abducted, the point is in the center of the axilla, on the medial side of the axillary artery.","ind":"pain in the costal and cardiac regions, scrofula, cold pain of the elbow and arm, dryness of the throat.","mth":"Avoid puncturing the axillary artery. Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"גִּ'י צְ'וֶון","heL":"כשהזרוע העליונה מורחקת — במרכז בית השחי, בצד המדיאלי של עורק בית השחי."},{"c":"HT 2","py":"Qingling","zh":"靑(青)靈(灵,霊)","m":"HT","loc":"When the elbow is flexed, the point is 3 cun above the medial end of the transverse cubital crease (Shaohai HT 3), in the groove medial to m. biceps brachii.","ind":"pain in the cardiac and hypochondriac regions, shoulder and arm.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"צִ'ינְג לִינְג","heL":"כשהמרפק כפוף — 3 צוּן מעל הקצה המדיאלי של קפל המרפק הרוחבי (שָׁאו חַאי, HT 3), בחריץ המדיאלי לשריר הדו־ראשי הזרועי."},{"c":"HT 3","py":"Shaohai","zh":"少海(海)","m":"HT","loc":"With the elbow flexed, at the midpoint of the line connecting the medial end of the cubital crease and the medial epicondyle of humerus.","ind":"cardiac pain, spasmodic pain and numbness of the hand and arm, tremor of the hand, scrofula, pain in the axilla and hypochondriac region.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"שָׁאו חַאי","heL":"כשהמרפק כפוף — באמצע הקו המחבר בין הקצה המדיאלי של קפל המרפק לבליטה הפרקית המדיאלית של עצם הזרוע."},{"c":"HT 4","py":"Lingdao","zh":"靈(灵,霊)道(道)","m":"HT","loc":"When the palm faces upward, the point is on the radial side of the tendon of m. flexor carpi ulnaris, 1.5 cun above the transverse crease of the wrist.","ind":"cardiac pain, spasmodic pain of the elbow and arm, sudden loss of voice.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"לִינְג דָאו","heL":"כשכף היד כלפי מעלה — בצד הרדיאלי של גיד מכופף שורש כף היד האולנרי, 1.5 צוּן מעל קפל שורש כף היד."},{"c":"HT 5","py":"Tongli","zh":"通(通)里","m":"HT","loc":"When the palm faces upward, the point is on the radial side of the tendon of m. flexor carpi ulnaris, 1 cun above the transverse crease of the wrist.","ind":"palpitation, dizziness, blurred vision, sore throat, sudden loss of voice, aphasia with stiffness of the tongue, pain in the wrist and elbow.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"טוֹנְג לִי","heL":"כמו HT 4, 1 צוּן מעל קפל שורש כף היד."},{"c":"HT 6","py":"Yinxi","zh":"陰(阴)郄","m":"HT","loc":"When the palm faces upward, the point is on the radial side of the tendon of m. flexor carpi ulnaris, 0.5 cun above the transverse crease of the wrist.","ind":"cardiac pain, hysteria, night sweat, hemoptysis, epistaxis, sudden loss of voice.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"יִין שִׂי","heL":"כמו HT 4, 0.5 צוּן מעל קפל שורש כף היד."},{"c":"HT 7","py":"Shenmen","zh":"神(神)門(门)","m":"HT","loc":"At the ulnar end of the transverse crease of the wrist, in the depression on the radial side of the tendon of m. flexor carpi ulnaris.","ind":"cardiac pain, irritability, palpitation, hysteria, amnesia, insomnia, mania, epilepsy, dementia, pain in the hypochondriac region, feverish sensation in the palm, yellowish sclera.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"שֶן מֶן","heL":"בקפל שורש כף היד בצד הזרת, בשקע הקטן ליד גיד שורש כף היד.","heA":"שייכת למרידיאן הלב. במסורת היא משויכת לרגיעה, לשינה, למתח רגשי ולתחושת דופק."},{"c":"HT 8","py":"Shaofu","zh":"少府","m":"HT","loc":"When the palm faces upward, the point is between the 4th and 5th metacarpal bones. When a fist is made, the point is where the tip of the little finger rests.","ind":"palpitation, pain in the chest, spasmodic pain of the little finger, feverish sensation in the palm, enuresis, dysuria, pruritus of the external genitalia.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"שָׁאו פוּ","heL":"כשכף היד כלפי מעלה — בין עצמות כף היד הרביעית והחמישית. כשאוגרפים אגרוף, הנקודה במקום שאליו מגיע קצה הזרת."},{"c":"HT 9","py":"Shaochong","zh":"少衝(冲)","m":"HT","loc":"On the radial side of the little finger, about 0.1 cun from the corner of the nail.","ind":"palpitation, cardiac pain, pain in the chest and hypochondriac regions, mania, febrile diseases, loss of consciousness.","mth":"Puncture subcutaneously 0.1 inch, or prick with a three-edged needle to cause bleeding. Moxibustion is applicable.","heN":"שָׁאו צ'וֹנְג","heL":"בצד הרדיאלי של הזרת, כ־0.1 צוּן מפינת הציפורן."},{"c":"SI 1","py":"Shaoze","zh":"少澤(泽,沢)","m":"SI","loc":"On the ulnar side of the little finger, about 0.1 cun from the corner of the nail.","ind":"headache, febrile diseases, loss of consciousness, insufficient lactation, sore throat, redness of the eye, cloudiness of the cornea.","mth":"Puncture subcutaneously 0.1 inch, or prick the point to cause bleeding. Moxibustion is applicable.","heN":"שָׁאו דְזֶה","heL":"בצד האולנרי של הזרת, כ־0.1 צוּן מפינת הציפורן."},{"c":"SI 2","py":"Qiangu","zh":"前谷","m":"SI","loc":"When a loose fist is made, the point is on the ulnar end of the crease in front of the metacarpo- phalangeal joint of the little finger, at the junction of the red and white skin.","ind":"numbness of the fingers, febrile diseases, tinnitus, headache, reddish urine.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"צְ'יֶן גוּ","heL":"כשאוגרפים אגרוף רפוי — בקצה האולנרי של הקפל שלפני מפרק כף־היד–אצבע של הזרת, במפגש העור האדום והלבן."},{"c":"SI 3","py":"Houxi","zh":"後(后)谿(溪)","m":"SI","loc":"When a loose fist is made, the point is on the ulnar end of the distal palmar crease, proximal to the fifth metacarpophalangeal joint, at the end of the transverse crease and the junction of the red and white skin.","ind":"pain and rigidity of the neck, tinnitus, deafness, sore throat, mania, malaria, acute lumbar sprain, night sweat, febrile diseases, contracture and numbness of the fingers, pain in the shoulder and elbow.","mth":"Puncture perpendicularly 0.5-0.7 inch. Moxibustion is applicable.","heN":"חוֹ שִׂי","heL":"כשאוגרפים אגרוף רפוי — בקצה האולנרי של קפל כף היד הדיסטלי, פרוקסימלית למפרק כף־היד–אצבע החמישי, בקצה הקפל הרוחבי ובמפגש העור האדום והלבן."},{"c":"SI 4","py":"Wangu","zh":"腕骨(骨)","m":"SI","loc":"On the ulnar side of the palm, in the depression between the base of the fifth metacarpal bone and the hamate bone.","ind":"febrile diseases with anhidrosis, headache, rigidity of the neck, contracture of the fingers, pain in the wrist, jaundice.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"וָאן גוּ","heL":"בצד האולנרי של כף היד, בשקע שבין בסיס עצם כף היד החמישית לעצם הוו (hamate)."},{"c":"SI 5","py":"Yanggu","zh":"陽(阳)谷","m":"SI","loc":"At the ulnar end of the transverse crease on the dorsal aspect of the wrist, in the depression between the styloid process of the ulna and the triquetral bone.","ind":"swelling of the neck and submandibular region, pain of the hand and wrist, febrile diseases.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"יָאנְג גוּ","heL":"בקצה האולנרי של הקפל הרוחבי בגב שורש כף היד, בשקע שבין הזיז הסטילואידי של עצם הגומד לעצם המשולשת (triquetrum)."},{"c":"SI 6","py":"Yanglao","zh":"養(养)老","m":"SI","loc":"Dorsal to the head of the ulna. When the palm face the chest, the point is in the bony cleft on the radial side of the styloid process of the ulna.","ind":"blurred vision, pain in the shoulder, elbow and arm.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"יָאנְג לָאו","heL":"גבית לראש עצם הגומד. כשכף היד פונה אל החזה, הנקודה בסדק העצם שבצד הרדיאלי של הזיז הסטילואידי של עצם הגומד."},{"c":"SI 7","py":"Zhizheng","zh":"支正","m":"SI","loc":"On the line joining Yanggu (SI 5) and Xiaohai (SI 8), 5 cun proximal to the dorsal crease of the wrist.","ind":"neck rigidity, headache, dizziness, spasmodic pain in the elbow and fingers, febrile diseases, mania.","mth":"Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.","heN":"ג'ה ג'ֶנְג","heL":"על הקו המחבר בין יָאנְג גוּ (SI 5) לשְׂיָאו חַאי (SI 8), 5 צוּן פרוקסימלית לקפל שורש כף היד הגבי."},{"c":"SI 8","py":"Xiaohai","zh":"小海(海)","m":"SI","loc":"When the elbow is flexed, the point is located in the depression between the olecranon of the ulna and the medial epicondyle of the humerus.","ind":"headache, swelling of the cheek, pain in the nape, shoulder, arm and elbow, epilepsy.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"שְׂיָאו חַאי","heL":"כשהמרפק כפוף — בשקע שבין בליטת המרפק של עצם הגומד לבליטה הפרקית המדיאלית של עצם הזרוע."},{"c":"SI 9","py":"Jianzhen","zh":"肩貞(贞)","m":"SI","loc":"Posterior and inferior to the shoulder joint. When the arm is adducted, the point is 1 cun above the posterior end of the axillary fold.","ind":"pain in the scapular region, motor impairment of the hand and arm.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"גְ'יֶן ג'ֶן","heL":"אחורית ותחתית למפרק הכתף. כשהזרוע מקורבת, הנקודה 1 צוּן מעל הקצה האחורי של קפל בית השחי."},{"c":"SI 10","py":"Naoshu","zh":"臑兪(俞)","m":"SI","loc":"When the arm is adducted, the point is directly above the posterior end of the axillary fold, in the depression inferior to the scapular spine","ind":"swelling of the shoulder, aching and weakness of the shoulder and arm.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"נָאו שׁוּ","heL":"כשהזרוע מקורבת — ישירות מעל הקצה האחורי של קפל בית השחי, בשקע שמתחת לקוץ עצם השכם."},{"c":"SI 11","py":"Tianzong","zh":"天宗","m":"SI","loc":"On the scapula, in the depression of the center of the subscapular fossa, and at the level of the 4th thoracic vertebra.","ind":"pain in the scapular region, pain in the lateroposterior aspect of the elbow and arm, asthma.","mth":"Puncture perpendicularly or obliquely 0.5-1.0 inch. Moxibustion is applicable.","heN":"טְיֵין דְזוֹנְג","heL":"על עצם השכם, בשקע שבמרכז הגומה התת־שכמית, בגובה החוליה החזית הרביעית."},{"c":"SI 12","py":"Bingfeng","zh":"秉風(风)","m":"SI","loc":"In the centre of the suprascapular fossa, directly above Tianzong (SI ll). When the arm is lifted, the point is at the site of the depression.","ind":"pain in the scapular region, numbness and aching of the upper extremities, motor impairment of the shoulder and arm.","mth":"Puncture perpendicularly 0.5-0.7 inch. Moxibustion is applicable.","heN":"בִּינְג פֶנְג","heL":"במרכז הגומה העל־שכמית, ישירות מעל טְיֵין דְזוֹנְג (SI 11). כשמרימים את הזרוע, הנקודה במקום השקע."},{"c":"SI 13","py":"Quyuan","zh":"曲垣","m":"SI","loc":"On the medial extremity of the suprascapular fossa, about midway between Naoshu (SI l0) and the spinous process of the 2nd thoracic vertebra.","ind":"pain and stiffness of the scapular region.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"צ'וּ יוּאָן","heL":"בקצה המדיאלי של הגומה העל־שכמית, בערך באמצע הדרך בין נָאו שׁוּ (SI 10) לזיז הקוצני של החוליה החזית השנייה."},{"c":"SI 14","py":"Jianwaishu","zh":"肩外兪(俞)","m":"SI","loc":"3 cun lateral to the lower border of the spinous process of the 1st thoracic vertebra where Taodao (GV 13) is located.","ind":"aching of the shoulder and back, pain and rigidity of the neck.","mth":"Puncture obliquely 0.3-0.7 inch. Moxibustion is applicable.","heN":"גְ'יֶן וַאי שׁוּ","heL":"3 צוּן לרוחב מהשוליים התחתונים של הזיז הקוצני של החוליה החזית הראשונה, במקום שבו נמצאת טָאו דָאו (GV 13)."},{"c":"SI 15","py":"Jianzhongshu","zh":"肩中兪(俞)","m":"SI","loc":"2 cun lateral to the lower border of the spinous process of the seventh cervical vertebra (Dazhui, GV 14).","ind":"","mth":"Puncture obliquely 0.3-0.6 inch. Moxibustion is applicable.","heN":"גְ'יֶן ג'וֹנְג שׁוּ","heL":"2 צוּן לרוחב מהשוליים התחתונים של הזיז הקוצני של החוליה הצווארית השביעית (דָא ג'וֵוי, GV 14)."},{"c":"SI 16","py":"Tianchuang","zh":"天窗(窓)","m":"SI","loc":"In the lateral aspect of the neck, posterior to m. sternocleidomastoideus and Futu (LI 18), on the level of the laryngeal protuberance.","ind":"sore throat, sudden loss of voice, deafness, tinnitus, stiffness and pain of the neck.","mth":"Puncture perpendicularly 0.3-0.7 inch. Moxibustion is applicable.","heN":"טְיֵין צְ'וָאנְג","heL":"בצד של הצוואר, אחורית לשריר הסטרנוקלידומסטואידי ולפוּ טוּ (LI 18), בגובה בליטת הגרון."},{"c":"SI 17","py":"Tianrong","zh":"天容","m":"SI","loc":"Posterior to the angle of mandible, in the depression on the anterior border of m. sternocleidomastoideus.","ind":"deafness, tinnitus, sore throat, swelling of the cheek, foreign body sensation in the throat, goiter.","mth":"Puncture perpendicularly 0.5-0.7 inch. Moxibustion is applicable.","heN":"טְיֵין רוֹנְג","heL":"אחורית לזווית הלסת התחתונה, בשקע שבשוליים הקדמיים של השריר הסטרנוקלידומסטואידי."},{"c":"SI 18","py":"Quanliao","zh":"顴(颧)髎(髎)","m":"SI","loc":"Directly below the outer canthus, in the depression on the lower border of zygoma.","ind":"facial paralysis, eyelid twitching, pain in the face, toothache, swelling of the cheek, yellowish sclera.","mth":"Puncture perpendicularly 0.5-0.8 inch.","heN":"צְ'וֶון לְיָאו","heL":"ישירות מתחת לזווית העין החיצונית, בשקע שבשוליים התחתונים של עצם הלחי."},{"c":"SI 19","py":"Tinggong","zh":"聽(听,聴)宮(宫)","m":"SI","loc":"Anterior to the tragus and posterior to the condyloid process of the mandible, in the depression formed when the mouth is open.","ind":"deafness, tinnitus, otorrhea, motor impairment of the mandibular joint, toothache.","mth":"Puncture perpendicularly 0.5-1.0 inch when the mouth is open. Moxibustion is applicable.","heN":"טִינְג גּוֹנְג","heL":"לפני הטראגוס ואחורית לזיז הפרקי של הלסת התחתונה, בשקע שנפער כשהפה פתוח."},{"c":"BL 1","py":"Jingming","zh":"睛(睛)明","m":"BL","loc":"In the depression slightly above the inner canthus.","ind":"redness, swelling and pain of the eye, itching of the canthus, lacrimation, night blindness, color blindness, blurred vision, myopia.","mth":"Ask the patient to close his eyes when pushing gently the eyeball to the lateral side. Puncture slowly perpendicularly 0.3-0.7 inch along the orbital wall. It is not advisable to twist of lift and thrust the needle vigorously. To avoid bleeding, press the puncturing site for a few seconds after withdrawal of the needle. Moxibustion is forbidden.","heN":"גִּ'ינְג מִינְג","heL":"בשקע מעט מעל זווית העין הפנימית."},{"c":"BL 2","py":"Zanzhu","zh":"攢(攒,攅)竹","m":"BL","loc":"On the medial extremity of the eyebrow, or on the supraorbital notch.","ind":"headache, blurred and failing vision, pain in the supraorbital region, lacrimation, redness, swelling and pain of the eye, eyelid twitching, glaucoma.","mth":"Puncture subcutaneously 0.3-0.5 inch, or prick with three-edged needle to cause bleeding.","heN":"דְזָאן ג'וּ","heL":"בקצה המדיאלי של הגבה, על החריץ העל־ארובתי."},{"c":"BL 3","py":"Meichong","zh":"眉衝(冲)","m":"BL","loc":"Directly above Zanzhu, 0.5 cun within the anterior hairline, between Shenting (GV 24) and Quchai (BL 4).","ind":"headache, giddiness, epilepsy, nasal obstruction.","mth":"Puncture subcutaneously 0.3-0.5 inch.","heN":"מֵיי צ'וֹנְג","heL":"ישירות מעל דְזָאן ג'וּ (BL 2), 0.5 צוּן בתוך קו השיער הקדמי, בין שֶׁן טִינְג (GV 24) לצ'וּ צָ'ה (BL 4)."},{"c":"BL 4","py":"Qucha","zh":"曲差","m":"BL","loc":"0.5 cun directly above the midpoint of the anterior hairline and 1.5 cun lateral to the midline, at the junction of the medial third and lateral two-thirds of the distance from Shenting (GV 24) to Touwei (ST 8).","ind":"headache, nasal obstruction, epistaxis, blurred and failing vision.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"צ'וּ צָ'ה","heL":"0.5 צוּן ישירות מעל אמצע קו השיער הקדמי, 1.5 צוּן לרוחב מקו האמצע, במפגש השליש המדיאלי ושני השלישים החיצוניים של המרחק מ־שֶׁן טִינְג (GV 24) לטוֹ וֵיי (ST 8)."},{"c":"BL 5","py":"Wuchu","zh":"五處(处,処)","m":"BL","loc":"1 cun directly above the midpoint of the anterior hairline and 1.5 cun lateral to the midline.","ind":"headache, blurred vision, epilepsy, convulsion.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"ווּ צ'וּ","heL":"1 צוּן ישירות מעל אמצע קו השיער הקדמי, 1.5 צוּן לרוחב מקו האמצע."},{"c":"BL 6","py":"Chengguang","zh":"承光","m":"BL","loc":"2.5 cun directly above the midpoint of the anterior hairline and 1.5 cun lateral to the midline.","ind":"headache, blurred vision, nasal obstruction.","mth":"Puncture subcutaneously 0.3-0.5 inch.","heN":"צֶ'נְג גְוָאנְג","heL":"2.5 צוּן ישירות מעל אמצע קו השיער הקדמי, 1.5 צוּן לרוחב מקו האמצע."},{"c":"BL 7","py":"Tongtian","zh":"通(通)天","m":"BL","loc":"4 cun directly above the midpoint of the anterior hairline and 1.5 cun lateral to the midline.","ind":"headache, giddiness, nasal obstruction, epistaxis, rhinorrhea.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"טוֹנְג טְיֵין","heL":"4 צוּן ישירות מעל אמצע קו השיער הקדמי, 1.5 צוּן לרוחב מקו האמצע."},{"c":"BL 8","py":"Luoque","zh":"絡(络)卻(却)","m":"BL","loc":"5.5 cun directly above the midpoint of the anterior hairline and 1.5 cun lateral to the midline.","ind":"dizziness, blurred vision, tinnitus, mania.","mth":"Puncture subcutaneously 0.3-0.5 inch.","heN":"לוֹ צְ'וֶוה","heL":"5.5 צוּן ישירות מעל אמצע קו השיער הקדמי, 1.5 צוּן לרוחב מקו האמצע."},{"c":"BL 9","py":"Yuzhen","zh":"玉枕","m":"BL","loc":"2.5 cun directly above the midpoint of the posterior hairline and 1.3 cun lateral to the midline, in the depression on the level of the upper border of the external occipital protuberance.","ind":"headache and neck pain, dizziness, ophthalmalgia, nasal obstruction.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"יוּ ג'ֶן","heL":"2.5 צוּן ישירות מעל אמצע קו השיער האחורי, 1.3 צוּן לרוחב מקו האמצע, בשקע בגובה השוליים העליונים של בליטת העורף החיצונית."},{"c":"BL 10","py":"Tianzhu","zh":"天柱","m":"BL","loc":"1.3 cun lateral to the midpoint of the posterior hairline and in the depression on the lateral aspect of m. trapezius.","ind":"headache, nasal obstruction, sore throat, neck rigidity, pain in the shoulder and back.","mth":"Puncture perpendicularly 0.5-0.8 inch.","heN":"טְיֵין ג'וּ","heL":"1.3 צוּן לרוחב מאמצע קו השיער האחורי, בשקע שבצד החיצוני של השריר הטרפזי."},{"c":"BL 11","py":"Dazhu","zh":"大杼","m":"BL","loc":"1.5 cun lateral to Taodao (GV 13), at the level of the lower border of the spinous process of the first thoracic vertebra.","ind":"headache, pain in the neck and back, pain and soreness in the scapular region, cough, fever, neck rigidity.","mth":"Puncture obliquely 0.5-0.7 inch. Moxibustion is applicable.","heN":"דָא ג'וּ","heL":"1.5 צוּן לרוחב מטָאו דָאו (GV 13), בגובה השוליים התחתונים של הזיז הקוצני של החוליה החזית הראשונה."},{"c":"BL 12","py":"Fengmen","zh":"風(风)門(门)","m":"BL","loc":"1.5 cun lateral to the GV Meridian, at the level of the lower border of the spinous process of the second thoracic vertebra.","ind":"common cold, cough, fever and headache, neck rigidity, backache.","mth":"Puncture obliquely 0.5-0.7 inch. Moxibustion is applicable.","heN":"פֶנְג מֶן","heL":"1.5 צוּן לרוחב ממר
