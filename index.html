<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>אטלס הגוף — AppNest</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --gold:#d8b25a; --gold-2:#b8924a; --gold-soft:#e7cd8a;
  --bg:#0d0d0f; --bg2:#15151a; --card:#1b1b22; --card2:#22222b;
  --line:#2c2c36; --ink:#f4f2ea; --muted:#9a99a5; --ok:#5fbf8f; --bad:#e06a5c;
  --radius:18px; --shadow:0 14px 40px #00000055;
}
/* ---- palettes ---- */
[data-pal="onyx"]{ --gold:#d8b25a; --gold-2:#b8924a; --gold-soft:#e7cd8a; }
[data-pal="jade"]{ --gold:#6fc9a6; --gold-2:#3f9c7c; --gold-soft:#a6e6cf; }
[data-pal="ruby"]{ --gold:#e08a7d; --gold-2:#c05f52; --gold-soft:#f2b7ad; }
[data-pal="sky"]{ --gold:#7fb2e6; --gold-2:#4f86c6; --gold-soft:#b6d6f4; }
[data-pal="amethyst"]{ --gold:#b79ae0; --gold-2:#8a68c6; --gold-soft:#d8c6f2; }
/* ---- day mode ---- */
[data-theme="day"]{
  --bg:#f6f3ec; --bg2:#efeadf; --card:#ffffff; --card2:#f4f1e8;
  --line:#e0dccf; --ink:#1c1b18; --muted:#6d6a60; --shadow:0 14px 40px #1b160a14;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font:16px/1.55 -apple-system,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(120% 60% at 90% -10%, color-mix(in srgb,var(--gold) 12%, transparent), transparent 60%), var(--bg);
  color:var(--ink); -webkit-tap-highlight-color:transparent; min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
.hide{display:none!important}
.gold{color:var(--gold)}
h1,h2,h3{margin:0;font-weight:800}
small{color:var(--muted)}
.wrap{width:min(1120px,100% - 28px);margin:auto}

/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:11px 0}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.logo{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,#1a1a20,#2a2a34);border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));box-shadow:inset 0 0 0 1px #0004}
.logo svg{width:24px;height:24px}
.brand b{font-size:17px;letter-spacing:.2px}
.brand small{display:block;letter-spacing:.28em;font-size:10px;margin-top:1px}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:13px;background:var(--card);padding:0 42px 0 14px}
.search svg{position:absolute;inset-inline-start:auto;inset-inline-end:13px;top:11px;width:20px;height:20px;color:var(--muted)}
.iconbtn{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.iconbtn:hover{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}

/* nav */
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 15px;color:var(--muted);font-weight:600;display:flex;gap:7px;align-items:center}
.tab svg{width:17px;height:17px}
.tab.active{background:linear-gradient(160deg,var(--gold),var(--gold-2));color:#141018;border-color:transparent;font-weight:800}

main{padding:18px 0 90px}
.screen{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* home */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:6px 0 20px}
.eyebrow{color:var(--gold);font-weight:700;font-size:13px}
.hero h1{font-size:clamp(25px,5vw,38px);margin-top:6px}
.hero p{color:var(--muted);margin:6px 0 0;max-width:46ch}
.favpill{border:1px solid var(--line);background:var(--card);border-radius:30px;padding:10px 15px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.favpill svg{width:17px;height:17px;color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{text-align:start;border:1px solid var(--line);background:linear-gradient(165deg,var(--card),var(--card2));border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;min-height:120px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:16px}
.tile small{display:block;margin-top:3px}
.tile .cnt{margin-top:auto;font-size:13px;color:var(--gold);font-weight:700}

.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:24px 0 14px;gap:12px}
.section-head h2{font-size:20px}
.card{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}

/* workspace (map + list) */
.workspace{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.9fr);gap:14px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}
.toolbar .seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.chip svg{width:16px;height:16px}
.chip.active{background:linear-gradient(160deg,var(--gold),var(--gold-2));color:#141018;border-color:transparent}
select.chip{padding-inline-end:26px}
.stage{position:relative;background:var(--bg2);min-height:360px;display:grid;place-items:center;overflow:auto;max-height:72vh;padding:14px}
.stage.body{background:#050507;padding:0}
.stage img{display:block;width:var(--zoom,100%);max-width:none;height:auto;margin:auto}
.stage.body img{width:100%;max-width:520px}
.pin{position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--gold-2);color:#fff;font-weight:800;box-shadow:0 4px 12px #0009;display:grid;place-items:center;transform:translate(50%,-50%)}
.acupin{position:absolute;width:15px;height:15px;padding:0;border-radius:50%;border:2px solid #fff;background:var(--gold);box-shadow:0 1px 6px #000a;transform:translate(-50%,-50%);transition:.12s}
.acupin:hover,.acupin:focus{width:24px;height:24px;z-index:3;outline:none}
.map-note{margin:0;padding:12px 15px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.zoombar{display:flex;gap:8px;align-items:center;padding:11px 15px;border-top:1px solid var(--line)}
.zoombar input{flex:1}
.zoombar button{width:38px;height:38px;border:1px solid var(--line);background:var(--bg2);border-radius:10px;font-weight:800}
.zonegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;padding:13px 15px;border-top:1px solid var(--line)}
.zonegrid button{min-height:42px;border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));background:color-mix(in srgb,var(--gold) 10%,transparent);color:var(--gold);border-radius:10px;font-weight:800}
.zonegrid button:hover{background:linear-gradient(160deg,var(--gold),var(--gold-2));color:#141018}

.list{max-height:72vh;overflow:auto;padding:8px}
.list-head{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 8px 12px;flex-wrap:wrap}
.list-head b{font-size:15px}
.count{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:13px;color:var(--muted)}
.row{width:100%;text-align:start;border:1px solid transparent;background:transparent;border-radius:13px;padding:10px;display:grid;grid-template-columns:48px 1fr 16px;gap:10px;align-items:center;color:var(--ink)}
.row:hover{background:var(--card2);border-color:var(--line)}
.code{direction:ltr;min-width:48px;height:48px;padding:0 6px;border-radius:12px;background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:14px}
.row b{display:block;font-size:15px}
.row small{display:block}
.row em{font-style:normal;font-size:11px;color:var(--gold);font-weight:700}
.row .chev{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:34px 14px}

/* meridians grid */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mcard{text-align:start;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:6px}
.mcard:hover{border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.mcard .ab{direction:ltr;font-weight:800;color:var(--gold);letter-spacing:1px}
.mcard b{font-size:15px}
.mcard small{color:var(--muted)}
.mdot{width:100%;height:6px;border-radius:6px;margin-top:4px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}

/* detail sheet */
.scrim{position:fixed;inset:0;background:#0009;z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-block:0;inset-inline-end:0;width:min(94vw,440px);background:var(--card);z-index:41;box-shadow:var(--shadow);transform:translateX(110%);transition:transform .25s;overflow:auto;padding:22px}
[dir=rtl] .sheet{transform:translateX(-110%)}
.sheet.open{transform:none!important}
.sheet .x{position:absolute;inset-inline-start:16px;top:16px;border:1px solid var(--line);background:var(--bg2);border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
.sheet .bigcode{direction:ltr;width:70px;height:70px;border-radius:18px;background:linear-gradient(160deg,var(--gold),var(--gold-2));color:#141018;display:grid;place-items:center;font-weight:800;font-size:20px;margin-top:34px}
.sheet .type{color:var(--gold);font-weight:700;font-size:13px;margin-top:14px}
.sheet h2{font-size:25px;margin:4px 0 2px}
.sheet .zh{direction:ltr;color:var(--muted)}
.sheet section{border-top:1px solid var(--line);padding:15px 0 0;margin-top:15px}
.sheet section b{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}
.sheet section p{margin:0;line-height:1.7}
.sheet .en{direction:ltr;font-size:14px;color:var(--muted)}
.warn{background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:14px;padding:13px;margin-top:16px;font-size:14px;line-height:1.6}
.btn{width:100%;border:0;border-radius:13px;padding:13px;font-weight:800;background:linear-gradient(160deg,var(--gold),var(--gold-2));color:#141018;margin-top:16px;display:flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
.btn svg{width:18px;height:18px}

/* learn */
.learn-wrap{max-width:640px;margin:auto}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px;gap:14px}
.flash .code{width:auto;height:auto;padding:8px 16px;font-size:22px}
.flash .q{font-size:20px;font-weight:700}
.flash .a{color:var(--muted);line-height:1.7}
.opts{display:grid;gap:10px;margin-top:8px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:13px 15px;text-align:start;font-weight:600}
.opt:hover{border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.opt.correct{background:color-mix(in srgb,var(--ok) 22%,transparent);border-color:var(--ok)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 20%,transparent);border-color:var(--bad)}
.progress{height:8px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:14px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));width:0;transition:.3s}

/* settings/forms */
.field{margin:14px 0}
.field label{display:block;font-weight:700;margin-bottom:7px;font-size:14px}
.field input,.field select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:0 13px}
.pals{display:flex;gap:10px;flex-wrap:wrap}
.pals button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);position:relative}
.pals button.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
.seg-toggle{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg-toggle button{flex:1;padding:12px;background:var(--bg2);font-weight:700}
.seg-toggle button.active{background:linear-gradient(160deg,var(--gold),var(--gold-2));color:#141018}
.setrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.setrow .btn{margin-top:0;flex:1;min-width:140px}

/* onboarding */
.modal{position:fixed;inset:0;z-index:60;background:#000a;display:grid;place-items:center;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:440px;width:100%;box-shadow:var(--shadow)}
.modal h2{font-size:24px}
.modal .steps{color:var(--muted);line-height:1.8;margin:14px 0}

footer{border-top:1px solid var(--line);padding:18px 0 26px;color:var(--muted);font-size:13px;display:flex;gap:6px;justify-content:space-between;flex-wrap:wrap}
footer a{color:var(--gold)}

@media(max-width:820px){
  .tiles{grid-template-columns:1fr 1fr}
  .workspace{grid-template-columns:1fr}
  .brand small{display:none}
  .hero{flex-direction:column;align-items:stretch}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<header>

  </div>
  <div class="wrap"><nav id="nav"></nav></div>
</header>

<script>window.ATLAS={"points":[{"c":"LU 1","py":"Zhongfu","zh":"中府","m":"LU","loc":"Laterosuperior to the sternum, 1 cun below Yunmen (LU 2), at the level of the first intercostal space, 6 cun lateral to the anterior midline.","ind":"cough, asthma, pain in the chest, shoulder and back, fullness in the chest.","mth":"Puncture obliquely 0.5-0.8 cun towards the lateral aspect of the chest. To avoid injuring the lung, never puncture deeply towards the medial aspect. Moxibustion is applicable.","heN":"דְזוֹנְג פוּ","heL":"בחלק העליון־צדדי של דופן בית החזה הקדמית, צוּן אחד מתחת ליוּנמֶן (LU 2), בגובה מרווח הצלעות הראשון, 6 צוּן לרוחב מקו האמצע הקדמי.","heA":"נקודת ה‑מוּ הקדמית של מרידיאן הריאות; במסורת הסינית המרידיאן משויך לנשימה ולחזה."},{"c":"LU 2","py":"Yunmen","zh":"雲(云)門(门)","m":"LU","loc":"In the superior lateral part of the anterior thoracic wall, superior to the coracoid process of scapula, in the depression of the infraclavicular fossa, 6 cun lateral to the anterior midline.","ind":"cough, asthma, pain in the chest, shoulder and arm, fullness in the chest.","mth":"Puncture obliquely 0.5-0.8 inch towards the lateral aspect of the chest. To avoid injuring the lung, never puncture deeply towards the medial aspect. Moxibustion is applicable.","heN":"יוּן מֶן","heL":"בחלק העליון־צדדי של דופן בית החזה הקדמית, מעל הזיז המקורי (coracoid) של השכם, בשקע הבור התת־בריחי, 6 צוּן לרוחב מקו האמצע הקדמי."},{"c":"LU 3","py":"Tianfu","zh":"天府","m":"LU","loc":"On the medial aspect of the upper arm, 3 cun below the end of axillary fold, on the radial side of m. biceps brachii.","ind":"asthma, epistaxis, pain in the medial aspect of the upper arm.","mth":"Puncture perpendicularly 0.5-1 inch.","heN":"טְיֵין פוּ","heL":"בצד הפנימי (מֶדיאלי) של הזרוע העליונה, 3 צוּן מתחת לקצה קפל בית השחי, בצד הרדיאלי של השריר הדו־ראשי הזרועי."},{"c":"LU 4","py":"Xiabai","zh":"俠(侠)白","m":"LU","loc":"On the medial aspect of the upper arm, 4 cun below the anterior end of the axillary fold, or 5 cun above the cubital crease, on the radial side of m. biceps brachii.","ind":"cough, fullness in the chest, pain in the medial aspect of the upper arm.","mth":"Puncture perpendicularly 0.5-1 inch. Moxibustion is applicable.","heN":"שְׂיָה בַּאי","heL":"בצד הפנימי של הזרוע העליונה, 4 צוּן מתחת לקצה הקדמי של קפל בית השחי (או 5 צוּן מעל קפל המרפק), בצד הרדיאלי של השריר הדו־ראשי."},{"c":"LU 5","py":"Chize","zh":"尺澤(泽,沢)","m":"LU","loc":"On the cubital crease, in the depression of the radial side of the tendon of m. biceps brachii. This point is located with the elbow slightly flexed.","ind":"cough, hemoptysis, afternoon fever, asthma, sore throat, fullness in the chest, infantile convulsion, spasmodic pain of the elbow and arm, mastitis.","mth":"puncture perpendicularly 0.5-1 inch.","heN":"צְ'ה דְזֶה","heL":"על קפל המרפק, בשקע שבצד הרדיאלי של גיד השריר הדו־ראשי. הנקודה מאותרת כשהמרפק כפוף מעט."},{"c":"LU 6","py":"Kongzui","zh":"孔最","m":"LU","loc":"On the palmar aspect of the forearm, on the line joining Taiyuan (LU 9) and Chize (LU 5), 7 cun above the transverse crease of the wrist.","ind":"cough, pain in the chest, asthma, hemoptysis, sore throat, spasmodic pain of the elbow and arm.","mth":"Puncture perpendicularly 0.5-1 inch. Moxibustion is applicable.","heN":"קוֹנְג דְזוֹאִי","heL":"בצד כף־היד של האמה, על הקו המחבר בין טַאי יוּאָן (LU 9) לצְ'ה דְזֶה (LU 5), 7 צוּן מעל קפל שורש כף היד."},{"c":"LU 7","py":"Lieque","zh":"列缺","m":"LU","loc":"Superior to the styloid process of the radius, 1.5 cun above the transverse crease of the wrist between the tendons of brachioradial muscle and abductor pollicis longus muscle. When the index fingers and thumbs of both hands are crossed with the index finger of one hand placed on the styloid process of the radius of the other, the point is in the depression right under the tip of the index finger.","ind":"headache, migraine, neck rigidity, cough, asthma, sore throat, facial paralysis, toothache, pain and weakness of the wrist.","mth":"","heN":"לְיֵה צְ'וֵוה","heL":"בצד האגודל של האמה, בערך רוחב שתי אצבעות מעל קפל שורש כף היד, בתוך השקע שבין הגידים.","heA":"במסורת הסינית הנקודה שייכת למרידיאן הריאות ומשויכת לאזור הנשימה, הגרון, הראש והעורף."},{"c":"LU 8","py":"Jingqu","zh":"經(经,経)渠","m":"LU","loc":"1 cun above the transverse crease of the wrist in the depression on the lateral side of the radial artery.","ind":"cough, asthma, fever, pain in the chest, sore throat, pain in the wrist.","mth":"Puncture perpendicularly 0.1-0.3 inch. Avoid puncturing the radial artery.","heN":"גִּ'ינְג צ'וּ","heL":"צוּן אחד מעל קפל שורש כף היד, בשקע שבצד החיצוני (לרוחב) של עורק הרדיוס."},{"c":"LU 9","py":"Taiyuan","zh":"太淵(渊)","m":"LU","loc":"At the radial end of the transverse crease of the wrist, in the depression on the lateral side of the radial artery.","ind":"cough, asthma, hemoptysis, sore throat, palpitation, pain in the chest, wrist and arm.","mth":"Puncture perpendicularly 0.2-0.3 inch. Avoid puncturing the radial artery. Moxibustion is applicable.","heN":"טַאי יוּאָן","heL":"בקצה הרדיאלי של קפל שורש כף היד, בשקע שבצד החיצוני של עורק הרדיוס."},{"c":"LU 10","py":"Yuji","zh":"魚(鱼)際(际)","m":"LU","loc":"On the radial aspect of the midpoint of the first metacarpal bone, on the junction of the red and white skin (i.e., the junction of the dorsum and palm of the hand).","ind":"cough, hemoptysis, sore throat, loss of voice, fever, feverish sensation in the palm.","mth":"Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.","heN":"יוּ גִּ'י","heL":"בצד הרדיאלי של אמצע עצם כף־היד הראשונה, במפגש העור האדום והלבן (המעבר בין גב כף היד לצידה הפנימי)."},{"c":"LU 11","py":"Shaoshang","zh":"少商","m":"LU","loc":"On the radial side of the thumb, about 0.1 cun posterior to the corner of the nail.","ind":"sore throat, cough, asthma, epistaxis, fever, loss of consciousness, mania, spasmodic pain of the thumb.","mth":"Puncture 0.1 inch, or prick the point to cause bleeding.","heN":"שָׁאוֹ שָׁאנְג","heL":"בצד הרדיאלי של האגודל, כ־0.1 צוּן מאחורי פינת הציפורן."},{"c":"LI 1","py":"Shangyang","zh":"商陽(阳)","m":"LI","loc":"On the radial side of the index finger, about 0.1 cun posterior to the corner of the nail.","ind":"toothache, sore throat, swelling of the submandibular region, numbness of fingers, febrile diseases with anhidrosis, loss of consciousness.","mth":"Puncture 0.1 inch, or prick the point to cause bleeding.","heN":"שָׁאנְג יָאנְג"},{"c":"LI 2","py":"Erjian","zh":"二間(间)","m":"LI","loc":"In the depression of the radial side of the index finger, distal to the 2nd metacarpal-phalangeal (MCP) joint. The point is located with the finger slightly flexed.","ind":"blurred vision, epistaxis, toothache, sore throat, febrile diseases.","mth":"Puncture perpendicularly 0.2-0.3 inch. Moxibustion is applicable.","heN":"אֵר גְ'יֶן"},{"c":"LI 3","py":"Sanjian","zh":"三間(间)","m":"LI","loc":"When a loose fist is made, the point is on the radial side of the index finger, in the depression proximal to the head of the second metacarpal bone.","ind":"toothache, ophthalmalgia, sore throat, redness and swelling of fingers and the dorsum of the hand.","mth":"Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.","heN":"סָאן גְ'יֶן"},{"c":"LI 4","py":"Hegu, Hoku","zh":"合谷","m":"LI","loc":"On the dorsum of the hand, between the 1st and 2nd metacarpal bones; approximately in the middle of the 2nd metacarpal bone on the radial side. Or, place in coincident position the transverse crease of the interphalangeal joint of the thumb with the margin of the web between the thumb and the index finger of the other hand. The point is where the tip of the thumb touches.","ind":"headache, pain in the neck, redness, swelling and pain of the eye, epistaxis, nasal obstruction, rhinorrhea, toothache, deafness, swelling of the face, sore throat, parotitis, trismus, facial paralysis, febrile diseases with anhidrosis, hyperhidrosis, abdominal pain, dysentery, constipation, amenorrhea, delayed labor, infantile convulsion, pain, weakness and motor impairment of the upper limbs.","mth":"Puncture perpendicularly 0.5-1 inch. Moxibustion is applicable.","heN":"חֶה גוּ","heL":"בגב כף היד, בתוך השריר שבין האגודל לאצבע. הצמידו אגודל ואצבע וחפשו את שיא הבליטה שנוצרת.","heA":"נקודה מרכזית במרידיאן המעי הגס. במסורת היא משויכת בעיקר לראש, לפנים, ללסת ולמתח באזור הצוואר והיד.","heC":"בהריון אין ללחוץ על נקודה זו ללא הנחיה מקצועית."},{"c":"LI 5","py":"Yangxi","zh":"陽(阳)谿(溪)","m":"LI","loc":"On the radial side of the wrist. When the thumb is tilted upward, it is in the depression between the tendons of m. extensor pollicis longus and brevis.","ind":"headache, redness, pain and swelling of the eye, toothache, sore throat, pain in the wrist.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"יָאנְג שִׂי"},{"c":"LI 6","py":"Pianli","zh":"偏歷(历)","m":"LI","loc":"With the elbow flexed and the radial side of arm upward, the point is on the line joining Yangxi (LI 5) and Quchi (LI 11), 3 cun above the crease of the wrist.","ind":"redness of the eye, tinnitus, deafness, epistaxis, aching of the hand and arm, sore throat, edema.","mth":"Puncture perpendicularly or obliquely 0.5-0.8 inch. Moxibustion is applicable.","heN":"פְּיֶן לִי"},{"c":"LI 7","py":"Wenliu","zh":"溫(温)溜","m":"LI","loc":"With the elbow flexed and the radial side of arm upward, the point is on the line connecting Yangxi (LI 5) and Quchi (LI 11), 5 cun above the crease of the wrist.","ind":"headache, swelling of the face, sore throat, borborygmus, abdominal pain, aching of the shoulder and arm.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"וֶן לְיוּ"},{"c":"LI 8","py":"Xialian","zh":"下廉","m":"LI","loc":"On the line joining Yangxi (LI 5) and Quchi (LI 11), 4 cun below the cubital crease.","ind":"abdominal pain, borborygmus, pain in the elbow and arm, motor impairment of the upper limbs.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"שְׂיָה לְיֶן"},{"c":"LI 9","py":"Shanglian","zh":"上廉","m":"LI","loc":"On the line joining Yangxi (LI 5) and Quchi (LI 11), 3 cun below the cubital crease.","ind":"aching of the shoulder and arm, motor impairment of the upper limbs, numbness of the hand and arm, borborygmus, abdominal pain.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"שָׁאנְג לְיֶן"},{"c":"LI 10","py":"Shousanli","zh":"手三里","m":"LI","loc":"On the line joining Yangxi (LI 5) and Quchi (LI 11), 2 cun below the cubital crease.","ind":"abdominal pain, diarrhea, toothache, swelling of the cheek, motor impairment of the upper limbs, pain in the shoulder and back.","mth":"Puncture perpendicularly 0.8-1.2 inches. Moxibustion is applicable.","heN":"שׁוֹ סָאן לִי"},{"c":"LI 11","py":"Quchi","zh":"曲池","m":"LI","loc":"When the elbow is flexed, the point is in the depression at the lateral end of the transverse cubital crease, midway between Chize (LU 5) and the lateral epicondyle of the humerus.","ind":"sore throat, toothache, redness and pain of the eye, scrofula, urticaria, motor impairment of the upper extremities, abdominal pain, vomiting, diarrhea, febrile diseases.","mth":"Puncture perpendicularly 1.0-1.5 inches. Moxibustion is applicable.","heN":"צ'וּ צְ'ה","heL":"כופפו את המרפק. הנקודה נמצאת בשקע שבקצה החיצוני של קפל המרפק.","heA":"שייכת למרידיאן המעי הגס. במסורת היא משויכת לחום בגוף, לעור, למרפק ולתנועה של היד והכתף."},{"c":"LI 12","py":"Zhouliao","zh":"肘髎(髎)","m":"LI","loc":"When the elbow is flexed, the point is on the lateral side of the upper arm, 1 cun above Quchi (LI 11), on the border of humerus.","ind":"pain, numbness and contracture of the elbow and arm.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"ג'וֹ לְיָאו"},{"c":"LI 13","py":"Shouwuli","zh":"手五里","m":"LI","loc":"On the lateral side of the upper arm, on the line connecting Quchi (LI 11) and Jianyu (LI 15), 3 cun above Quchi (LI 11).","ind":"contracture and pain of the elbow and arm, scrofula.","mth":"Puncture perpendicularly 0.5-1.0 inch. Avoid injuring the artery.","heN":"שׁוֹ ווּ לִי"},{"c":"LI 14","py":"Binao","zh":"臂臑","m":"LI","loc":"On the lateral side of the upper arm, on the line joining Quchi (Ll 11) and Jianyu (LI 15), 7 cun above Quchi (Ll 11), at the insertion of m. deltoideus.","ind":"pain in the shoulder and arm, rigidity of the neck, scrofula.","mth":"Puncture perpendicularly or obliquely upward 0.8-1.5 inches. Moxibustion is applicable.","heN":"בִּי נָאו"},{"c":"LI 15","py":"Jianyu","zh":"肩髃(髃)","m":"LI","loc":"Antero-inferior to the acromion, on the upper portion of m. deltoideus. When the arm is in full abduction, the point is in the depression appearing at the anterior border of the acromioclavicular joint.","ind":"pain in the shoulder and arm, motor impairment of the upper extremities, rubella, scrofula.","mth":"Puncture perpendicularly or obliquely 0.8-1.5 inches. Moxibustion is applicable.","heN":"גְ'יֶן יוּ"},{"c":"LI 16","py":"Jugu","zh":"巨骨(骨)","m":"LI","loc":"In the upper aspect of the shoulder, in the depression between the acromial extremity of the clavicle and the scapular spine.","ind":"pain and motor impairment of the upper extremities, pain in the shoulder and back.","mth":"Puncture perpendicularly 0.5-0.7 inch. Moxibustion is applicable.","heN":"גּ'וּ גוּ"},{"c":"LI 17","py":"Tianding","zh":"天鼎","m":"LI","loc":"On the lateral side of the neck, at the posterior border of sternocleidomastoid muscle, beside the laryngeal protuberance, at the midpoint of the line connecting Futu (LI 18) and Quepen (ST 12).","ind":"sudden loss of voice, sore throat, scrofula, goiter.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"טְיֵין דִינְג"},{"c":"LI 18","py":"Futu","zh":"扶突","m":"LI","loc":"On the lateral side of the neck, level with the tip of Adam's apple, between the sternal head and clavicular head of m. sternocleidomastoideus.","ind":"cough, asthma, sore throat, sudden loss of voice, scrofula, goiter.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"פוּ טוּ"},{"c":"LI 19","py":"Kouheliao","zh":"口禾髎(髎)","m":"LI","loc":"Right below the lateral margin of the nostril, level with Renzhong (Shuigou, GV 26).","ind":"nasal obstruction, epistaxis, deviation of the mouth.","mth":"Puncture obliquely 0.2-0.3 inch.","heN":"קוֹ חֶה לְיָאו"},{"c":"LI 20","py":"Yingxiang","zh":"迎(迎)香","m":"LI","loc":"In the nasolabial groove, at the level of the midpoint of the lateral border of ala nasi.","ind":"nasal obstruction, hyposmia, epistaxis, rhinorrhea, deviation of the mouth, itching and swelling of the face.","mth":"Puncture obliquely or subcutaneously 0.3-0.5 inch.","heN":"יִינְג שְׂיָאנְג"},{"c":"ST 1","py":"Chengqi","zh":"承泣","m":"ST","loc":"With the eyes looking straight forward, the point is directly below the pupil, between the eyeball and the infraorbital ridge.","ind":"redness, swelling and pain of the eye, lacrimation, night blindness, eyelid twitching, facial paralysis (bell's palsy).","mth":"Push the eyeball upward with the left thumb and puncture perpendicularly and slowly 0.5-1.0 inch along the infraorbital ridge. It is not advisable to manipulate the needle with large amplitude.","heN":"צֶ'נְג צִ'י"},{"c":"ST 2","py":"Sibai","zh":"四白","m":"ST","loc":"Directly below the pupil, in the depression at the infraorbital foramen.","ind":"redness, pain and itching of the eye, facial paralysis, eyelid twitching, pain in the face.","mth":"Puncture perpendicularly 0.2-0.3 inch. It is not advisable to puncture deeply.","heN":"סְה בַּאי"},{"c":"ST 3","py":"Juliao","zh":"巨髎(髎)","m":"ST","loc":"Directly below the pupil, at the level of the lower border of ala nasi, on the lateral side of the nasolabial groove.","ind":"facial paralysis, eyelid twitching, epistaxis, toothache, swelling of lips and cheek.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"גּ'וּ לְיָאו"},{"c":"ST 4","py":"Dicang","zh":"地倉(仓)","m":"ST","loc":"Lateral to the corner of the mouth, directly below the pupil.","ind":"deviation of the mouth, hypersalivation, eyelid twitching.","mth":"","heN":"דִי צָאנְג"},{"c":"ST 5","py":"Daying","zh":"大迎(迎)","m":"ST","loc":"Anterior to the angle of mandible, on the anterior border of the attached portion of m. masseter where the pulsation of facial artery is palpable, in the groove-like depression appearing when the cheek is bulged.","ind":"facial paralysis, trismus, swelling of the cheek, facial pain, toothache.","mth":"Avoid puncturing the artery. Puncture obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"דָא יִינְג"},{"c":"ST 6","py":"Jiache","zh":"頰(颊)車(车)","m":"ST","loc":"One finger-breadth (middle finger) anterior and superior to the lower angle of the mandible where m. masseter is prominence when the teeth are clenched and depressive when it is pressed.","ind":"facial paralysis, toothache, swelling of the cheek and face, mumps, trismus.","mth":"","heN":"גְ'יָה צֶ'ה"},{"c":"ST 7","py":"Xiaguan","zh":"下關(关,関)","m":"ST","loc":"On the face, anterior to the ear, in the depression between the zygomatic arch and the mandibular notch. This point is located with the mouth closed.","ind":"deafness, tinnitus, otorrhea, toothache, facial paralysis, pain of the face, motor impairment of the jaw.","mth":"Puncture perpendicularly 0.1- 0.5 cun. Moxibustion is applicable.","heN":"שְׂיָה גְוָאן"},{"c":"ST 8","py":"Touwei","zh":"頭(头)維(维)","m":"ST","loc":"On the lateral side of the head, 0.5 cun above the anterior hairline at the corner of the forehead, and 4.5 cun lateral to the midline of the head.","ind":"headache, blurred vision, ophthalmalgia, lacrimation.","mth":"Puncture 0.5-1.0 inch subcutaneously.","heN":"טוֹ וֵיי"},{"c":"ST 9","py":"Renying","zh":"人迎(迎)","m":"ST","loc":"Level with the tip of Adam's apple where the pulsation of common carotid artery is palpable, on the anterior border of sternocleidomastoid muscle.","ind":"sore throat, asthma, goiter, dizziness, flushing of the face.","mth":"Avoid puncturing the common carotid artery, puncture perpendicularly 0.3-0.5 inch.","heN":"רֶן יִינְג"},{"c":"ST 10","py":"Shuitu","zh":"水突","m":"ST","loc":"At the midpoint of the line joining Renying (ST 9) and Qishe (ST 11), on the anterior border of m. sternocleidomastoid muscle.","ind":"sore throat, asthma, cough.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"שְׁוֵוי טוּ"},{"c":"ST 11","py":"Qishe","zh":"氣(气,気)舍(舎)","m":"ST","loc":"At the superior border of the sternal extremity of the clavicle, between the sternal head and clavicular head of m. sternocleidomastoideus.","ind":"sore throat, pain and rigidity of the neck, asthma, hiccup, goiter.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"צִ'י שֶׁה"},{"c":"ST 12","py":"Quepen","zh":"缺盆","m":"ST","loc":"In the midpoint of the supraclavicular fossa, 4 cun lateral to the anterior midline.","ind":"cough, asthma, sore throat, pain in the supraclavicular fossa.","mth":"Avoid puncturing the artery. Puncture perpendicularly 0.3-0.5 inch.","heN":"צְ'וֶוה פֶּן"},{"c":"ST 13","py":"Qihu","zh":"氣(气,気)戶","m":"ST","loc":"At the lower border of the middle of the clavicle, 4 cun lateral to the anterior midline.","ind":"fullness in the chest, asthma, cough, hiccup, chest pain and hypochondriac pain.","mth":"","heN":"צִ'י חוּ"},{"c":"ST 14","py":"Kufang","zh":"庫(库)房","m":"ST","loc":"In the 1st intercostal space, 4 cun lateral to the anterior midline.","ind":"sensation of fullness in the chest, chest pain, cough.","mth":"Puncture‚Ä¢ obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"קוּ פָאנְג"},{"c":"ST 15","py":"Wuyi","zh":"屋翳","m":"ST","loc":"In the 2nd intercostal space, 4 cun lateral to the anterior midline.","ind":"fullness and pain in the chest and the costal region, cough, asthma, mastitis.","mth":"","heN":"ווּ יִי"},{"c":"ST 16","py":"Yingchuang","zh":"膺窗(窓)","m":"ST","loc":"In the 3rd intercostal space, 4 cun lateral to the anterior midline.","ind":"fullness and pain in the chest and hypochondrium, cough, asthma, mastitis.","mth":"Puncture obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"יִינְג צְ'וָאנְג"},{"c":"ST 17","py":"Ruzhong","zh":"(乳)中","m":"ST","loc":"In the 4th intercostal space, in the centre of the nipple, 4 cun lateral to the anterior midline.","ind":"","mth":"","heN":"רוּ ג'וֹנְג"},{"c":"ST 18","py":"Rugen","zh":"(乳)根","m":"ST","loc":"On the chest, directly below the nipple, on the lower border of breast, in the 5th intercostal space, 4 cun laterals to the anterior midline.","ind":"pain in the chest, cough, asthma, mastitis, insufficient lactation.","mth":"Puncture obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"רוּ גֶן"},{"c":"ST 19","py":"Burong","zh":"不容","m":"ST","loc":"6 cun above the umbilicus, 2 cun lateral to Juque (CV 14).","ind":"abdominal distension, vomiting, gastric pain, anorexia.","mth":"Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.","heN":"בּוּ רוֹנְג"},{"c":"ST 20","py":"Chengman","zh":"承滿(满,満)","m":"ST","loc":"5 cun above the umbilicus, 2 cun lateral to Shangwan (CV 13).","ind":"gastric pain, abdominal distension, vomiting, anorexia.","mth":"","heN":"צֶ'נְג מָאן"},{"c":"ST 21","py":"Liangmen","zh":"梁門(门)","m":"ST","loc":"4 cun above the umbilicus, 2 cun lateral to Zhongwan (CV 12).","ind":"gastric pain, vomiting, anorexia, abdominal distension, diarrhea.","mth":"Puncture perpendicularly 0.8-1.0 inch. Moxibustion is applicable.","heN":"לְיָאנְג מֶן"},{"c":"ST 22","py":"Guanmen","zh":"關(关,関)門(门)","m":"ST","loc":"3 cun above the umbilicus, 2 cun lateral to Jianli (CV 11).","ind":"abdominal distension and pain, anorexia, borborygmus, diarrhea, edema.","mth":"","heN":"גְוָאן מֶן"},{"c":"ST 23","py":"Taiyi","zh":"太乙","m":"ST","loc":"2 cun above the umbilicus, 2 cun lateral to Xiawan (CV 10).","ind":"gastric pain, irritability, mania, indigestion.","mth":"Puncture perpendicularly 0.7-1.0 inc able.","heN":"שְׂיָאן גוּ"},{"c":"ST 44","py":"Neiting","zh":"内庭","m":"ST","loc":"Proximal to the web margin between the 2nd and 3rd toes, in the depression distal and lateral to the 2nd metatarsodigital joint.","ind":"toothache, pain in the face, deviation of the mouth, sore throat, epistaxis, gastric pain, acid regurgitation, abdominal distension, diarrhea, dysentery, constipation, swelling and pain of the dorsum of the foot, febrile diseases.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"נֵיי טִינְג"},{"c":"ST 45","py":"Lidui","zh":"厲(厉)兌(兑)","m":"ST","loc":"On the lateral side of the 2nd toe, 0.1 cun posterior to the corner of the nail.","ind":"facial swelling, deviation of the mouth, epistaxis, toothache, sore throat and hoarse voice, abdominal distension, coldness in the leg and foot, febrile diseases, dream-disturbed sleep, mania.","mth":"Puncture subcutaneously 0.1 inch. Moxibustion is applicable.","heN":"לִי דְוֵוי"},{"c":"SP 1","py":"Yinbai","zh":"隱(隐,隠)白","m":"SP","loc":"On the medial side of the great toe, 0.1 cun posterior to the corner of the nail.","ind":"abdominal distension, bloody stools, menorrhagia, uterine bleeding, mental disorder, dream-disturbed sleep, convulsion.","mth":"Puncture subcutaneously 0.1 inch. Moxibustion is applicable.","heN":"יִין בַּאי"},{"c":"SP 2","py":"Dadu","zh":"大都(都)","m":"SP","loc":"On the medial side of the great toe, distal and inferior to the first metatarsal digital joint, in the depression of the junction of the red and white skin.","ind":"abdominal distension, gastric pain, constipation, febrile diseases with anhidrosis.","mth":"Puncture perpendicularly 0.1-0.3 inch. Moxibustion is applicable.","heN":"דָא דוּ"},{"c":"SP 3","py":"Taibai","zh":"太白","m":"SP","loc":"Proximal and inferior to the 1st metatarsophalangeal joint, in the depression of the junction of the red and white skin.","ind":"gastric pain, abdominal distension, constipation, dysentery, vomiting diarrhea, borborygmus, ain in the thigh and leg.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"יִין לְיֶן"},{"c":"LR 12","py":"Jimai","zh":"急脈(脉)","m":"LR","loc":"Lateral to the pubic tubercle, lateral and inferior to Qichong (ST 30), in the inguinal groove where the pulsation of femoral artery is palpable, 2.5 cun lateral to the anterior midline.","ind":"lower abdominal pain, hernia, pain in the external genitalia.","mth":"Moxibustion is applicable.","heN":"גִּ'י מַאי"},{"c":"LR 13","py":"Zhangmen","zh":"章門(门)","m":"LR","loc":"On the lateral side of the abdomen, below the free end of the eleventh rib.","ind":"abdominal distension, borborygmus, pain in the hypochondriac region, vomiting, diarrhea, indigestion.","mth":"Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.","heN":"ג'ָאנְג מֶן"},{"c":"LR 14","py":"Qimen","zh":"期門(门)","m":"LR","loc":"Directly below the nipple, in the sixth intercostal space, 4 cun lateral to the anterior midline.","ind":"hypochondriac pain, abdominal distension, hiccup, acid regurgitation, mastitis, depression, febrile diseases.","mth":"Puncture obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"צִ'י מֶן"},{"c":"GV 1","py":"Changqiang","zh":"長(长)強","m":"GV","loc":"Midway between the tip of the coccyx and the anus, locating the point in prone position.","ind":"diarrhea, bloody stools, hemorrhoids, prolapse of the rectum, constipation, pain in the lower back, epilepsy.","mth":"Puncture perpendicularly 0.5-0.1 inch. Moxibustion is applicable.","heN":"צָ'אנְג צְ'יָאנְג"},{"c":"GV 2","py":"Yaoshu","zh":"腰兪(俞)","m":"GV","loc":"In the hiatus of the sacrum.","ind":"irregular menstruation, pain and stiffness of the lower back, hemorrhoids, muscular atrophy of the lower extremities, epilepsy.","mth":"Puncture obliquely upward 0.5-1.0 inch. Moxibustion is applicable.","heN":"יָאו שׁוּ"},{"c":"GV 3","py":"Yaoyangguan","zh":"腰陽(阳)關(关,関)","m":"GV","loc":"Below the spinous process of the fourth lumbar vertebra, at the p layer, and the depth and angle of the puncture should be paid strict attention to.","heN":"יָא מֶן"},{"c":"GV 16","py":"Fengfu","zh":"風(风)府","m":"GV","loc":"1 cun directly above the midpoint of the posterior hairline, directly below the external occipital protuberance, in the depression between m. trapezius of both sides.","ind":"headache, neck rigidity, blurred vision, epistaxis, sore throat, post-apoplexy aphasia, hemiplegia, mental disorder.","mth":"Puncture perpendicularly 0.5-0.8 inch. Deep puncture is not advisable. Medullary bulb is in the deep layer, special attention should be paid in acupuncture.","heN":"פֶנְג פוּ"},{"c":"GV 17","py":"Naohu","zh":"腦(脑,脳)戶","m":"GV","loc":"2.5 cun directly above the midpoint of the posterior hairline, 1.5 cun directly above Fengfu (GV 16), in the depression on the upper border of the external occipital protuberance.","ind":"epilepsy, dizziness, pain and stiffness of the neck.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"נָאו חוּ"},{"c":"GV 18","py":"Qiangjian","zh":"強間(间)","m":"GV","loc":"4 cun directly above the midpoint of the posterior hairline and 1.5 cun above Naohu (GV 17).","ind":"headache, neck rigidity, blurred vision, mania.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"צְ'יָאנְג גְ'יֶן"},{"c":"GV 19","py":"Houding","zh":"後(后)頂(顶)","m":"GV","loc":"5.5 cun directly above the midpoint of the posterior hairline, 1.5 cun directly above Qiangjian (GV 18).","ind":"headache, vertigo, mania, epilepsy.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable. .","heN":"חוֹ דִינְג"},{"c":"GV 20","py":"Baihui","zh":"百會(会)","m":"GV","loc":"On the midline of the head, 5 cun directly above the midpoint of the anterior hairline, approximately on the midpoint of the line connecting the apexes of both ears.","ind":"headache, vertigo, tinnitus, nasal obstruction, aphasia by apoplexy, coma, mental disorder, prolapse of the rectum and the uterus.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"בָּאי חְווֵי","heA":"נמצאת על המרידיאן המרכזי האחורי. במסורת היא משויכת לראש, לערנות, לסחרחורת ולתחושת יציבות.","heC":"השתמשו במגע קל בלבד באזור הראש."},{"c":"GV 21","py":"Qianding","zh":"前頂(顶)","m":"GV","loc":"3.5 cun directly above the midpoint of the anterior hairline and 1.5 cun anterior to Baihui (GV 20).","ind":"epilepsy, dizziness, blurred vision, vertical headache, rhinorrhea.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"צְ'יֶן דִינְג"},{"c":"GV 22","py":"Xinhui","zh":"顖(囟)會(会)","m":"GV","loc":"2 cun posterior to the midpoint of the anterior hairline, 3 cun anterior to Baihui (GV 20).","ind":"headache, blurred vision, rhinorrhea, infantile convulsion.","mth":"Puncture subcutaneously 0.3-0.5 inch. This point is prohibited in infants with metopism. Moxibustion is applicable.","heN":"שִׁין חְוֵוי"},{"c":"GV 23","py":"Shangxing","zh":"上星","m":"GV","loc":"I cun directly above the midpoint of the anterior hairline.","ind":"headache, ophthalmalgia, epistaxis, rhinorrhea, mental disorder.","mth":"Puncture subcutaneously 0.3-0.5 inch or prick to cause bleeding. This point is prohibited in infants with metopism. Moxibustion is applicable.","heN":"שָׁאנְג שִׁינְג"},{"c":"GV 24","py":"Shenting","zh":"神(神)庭","m":"GV","loc":"0.5 cun directly above the midpoint of the anterior hairline.","ind":"epilepsy, anxiety, palpitation, insomnia, headache, vertigo, rhinorrhea.","mth":"Puncture subcutaneously 0.3-0.5 inch, or prick to cause bleeding.","heN":"שֶׁן טִינְג"},{"c":"GV 25","py":"Suliao","zh":"素髎(髎)","m":"GV","loc":"On the tip of the nose.","ind":"loss of consciousness, nasal obstruction, epistaxis, rhinorrhea, rosacea.","mth":"Puncture perpendicularly 0.2-0.3 inch, or prick to cause bleeding.","heN":"סוּ לְיָאו"},{"c":"GV 26","py":"Shuigou, Renzhong","zh":"水溝(沟)","m":"GV","loc":"At the junction of the upper third and middle third of the philtrum.","ind":"","mth":"Puncture obliquely upward OJ-0.5 inch.","heN":"שְׁוֵוי גוֹ"},{"c":"GV 27","py":"Duiduan","zh":"兌(兑)端","m":"GV","loc":"On the labial tubercle of the upper lip, on the vermilion border between the philtrum and upper lip.","ind":"mental disorder, lip twitching, lip stiffness, pain and swelling of the gums.","mth":"Puncture obliquely upward 0.2-0.3 inch.","heN":"דְוֵוי דְוָאן"},{"c":"GV 28","py":"Yinjiao","zh":"齦(龈)交","m":"GV","loc":"At the junction of the gum and the frenulum of the upper lip.","ind":"mental disorder, pain and swelling of the gums, rhinorrhea.","mth":"Puncture obliquely upward 0.1 -0.2 inch, or prick to cause bleeding.","heN":"יִין גְ'יָאו"},{"c":"CV 1","py":"Huiyin","zh":"會(会)陰(阴)","m":"CV","loc":"Between the anus and the root of the scrotum in males and between the anus and the posterior labial commissure in females.","ind":"vaginitis, retention of urine, hemorrhoids, nocturnal emission, enuresis, irregular menstruation, mental disorder.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"חְוֵוי יִין"},{"c":"CV 2","py":"Qugu","zh":"曲骨(骨)","m":"CV","loc":"On the midpoint of the upper border of the symphysis pubis.","ind":"retention and dribbling of urine, enuresis, nocturnal emission, impotence, morbid leukorrhea, irregular menstruation, dysmenorrhea, hernia.","mth":"Puncture perpendicularly 0.5-1.0 inch. Great care should be taken to puncture the points from Qugu (CV 2) to Shangwan (CV 13) of this meridian in pregnant women. Moxibustion is applicable.","heN":"צ'וּ גוּ"},{"c":"CV 3","py":"Zhongji","zh":"中極(极)","m":"CV","loc":"On the anterior midline, 4 cun below the umbilicus.","ind":"enuresis, nocturnal emission, impotence, hernia, uterine bleeding, irregular menstruation, dysmenorrhea, morbid leukorrhea, frequency of urination, retention of urine, pain in the lower abdomen, prolapse of the uterus, vaginitis.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"ג'וֹנְג גִּ'י"},{"c":"CV 4","py":"Guanyuan","zh":"關(关,関)元","m":"CV","loc":"On the anterior midline, 3 cun below the umbilicus.","ind":"enuresis, nocturnal emission, frequency of urination, retention of urine, hernia, irregular menstruation, morbid leukorrhea, dysmenorrhea, uterine bleeding, postpartum hemorrhage, lower abdominal pain, indigestion, diarrhea, prolapse of the rectum, flaccid type of apoplexy.","mth":"Puncture perpendicularly 0.8-1.2 inches. This is one of the important points for tonification. Moxibustion is applicable.","heN":"גְוָאן יוּאָן"},{"c":"CV 5","py":"Shimen","zh":"石門(门)","m":"CV","loc":"On the anterior midline, 2 cun below the umbilicus.","ind":"abdominal pain, diarrhea, edema, hernia, anuria, enuresis, amenorrhea, morbid leukorrhea, uterine bleeding, postpartum hemorrhage.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"שִׁי מֶן"},{"c":"CV 6","py":"Qihai","zh":"氣(气,気)海(海)","m":"CV","loc":"On the anterior midline, 1.5 cun below the umbilicus.","ind":"abdominal pain, enuresis, nocturnal emission, impotence, hernia, edema, diarrhea, dysentery, uterine bleeding, irregular menstruation, dysmenorrhea, amenorrhea, morbid leukorrhea, postpartum hemorrhage, constipation, flaccid type of apoplexy, asthma.","mth":"Puncture perpendicularly 0.8-1.2 inches. This is one of the important points for tonification. Moxibustion is applicable.","heN":"צִ'י חַאי"},{"c":"CV 7","py":"Yinjiao","zh":"陰(阴)交","m":"CV","loc":"On the anterior midline, 1 cun below the umbilicus.","ind":"abdominal distension, edema, hernia, irregular menstruation.","mth":"Puncture perpendicularly 0.8-1.2 inches. Moxibustion is applicable.","heN":"יִין גְ'יָאו"},{"c":"CV 8","py":"Shenque","zh":"神(神)闕(阙)","m":"CV","loc":"In the centre of the umbilicus.","ind":"abdominal pain, borborygmus, flaccid type of apoplexy, prolapse of the rectum, unchecked diarrhea.","mth":"Puncture is prohibited! Moxibustion is applicable.","heN":"שֶׁן צְ'וֶוה"},{"c":"CV 9","py":"Shuifen","zh":"水分","m":"CV","loc":"On the anterior midline, 1 cun above the umbilicus.","ind":"abdominal pain, borborygmus, edema, retention of urine, diarrhea.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"שְׁוֵוי פֶן"},{"c":"CV 10","py":"Xiawan","zh":"下脘","m":"CV","loc":"On the anterior midline, 2 cun above the umbilicus.","ind":"epigastric pain, abdominal pain, borborygmus, indigestion, vomiting, diarrhea.","mth":"Puncture perpendicularly 0.5-1.2 inches. Moxibustion is applicable.","heN":"שְׂיָה וָאן"},{"c":"CV 11","py":"Jianli","zh":"建里","m":"CV","loc":"On the anterior midline, 3 cun above the umbilicus.","ind":"stomachache, vomiting, abdominal distension, borborygmus, edema, anorexia.","mth":"Puncture perpendicularly 0.5-1.2 inches. Moxibustion is applicable.","heN":"גְּ'יֶן לִי"},{"c":"CV 12","py":"Zhongwan","zh":"中脘","m":"CV","loc":"On the anterior midline, 4 cun above the umbilicus.)","ind":"stomachache, abdominal distension, borborygmus, nausea, vomiting, acid regurgitation, diarrhea, dysentery, jaundice, indigestion, insomnia.","mth":"Puncture perpendicularly 0.5-1.2 inches. Moxibustion is applicable.","heN":"ג'וֹנְג וָאן"},{"c":"CV 13","py":"Shangwan","zh":"上脘","m":"CV","loc":"On the anterior midline, 5 cun above the umbilicus.","ind":"stomachache, abdominal distension, nausea, vomiting, epilepsy, insomnia.","mth":"Puncture perpendicularly 0.5-1.2 inches. Moxibustion is applicable.","heN":"שָׁאנְג וָאן"},{"c":"CV 14","py":"Juque","zh":"巨闕(阙)","m":"CV","loc":"On the anterior midline of the abdomen, 6 cun above the umbilicus.","ind":"pain in the cardiac region and the chest, nausea, acid regurgitation, difficulty in swallowing, vomiting, mental disorder, epilepsy, palpitation.","mth":"Puncture perpendicularly 0.3-0.8 inch. Moxibustion is applicable.","heN":"גּ'וּ צְ'וֶוה"},{"c":"CV 15","py":"Jiuwei","zh":"鳩(鸠)尾","m":"CV","loc":"On the anterior midline, 1 cun below the xiphosternal synchondrosis. Locate the point in supine position with the arms uplifted.","ind":"pain in the cardiac region and the chest, nausea, mental disorder, epilepsy.","mth":"Puncture obliquely downward 0.4-0.6 inch. Moxibustion is applicable.","heN":"גְ'יוּ וֵיי"},{"c":"CV 16","py":"Zhongting","zh":"中庭","m":"CV","loc":"On the anterior midline, at the level with the 5th intercostal space, on the xiphosternal synchondrosis.","ind":"distension and fullness in the chest and intercostal region, hiccup, nausea, anorexia.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"ג'וֹנְג טִינְג"},{"c":"CV 17","py":"Tanzhong","zh":"膻中","m":"CV","loc":"On the anterior midline, at the level with the 4th intercostal space, midway between the nipples.","ind":"asthma, pain in the chest, fullness in the chest, palpitation, insufficient lactation, hiccup, difficulty in swallowing.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"שָׁאן ג'וֹנְג","heA":"נמצאת על המרידיאן המרכזי הקדמי. במסורת היא משויכת לאזור החזה, לנשימה ולתחושת לחץ בחזה.","heC":"לחצו בעדינות בלבד על עצם החזה; כאב או לחץ בחזה דורשים בירור רפואי ולא עיסוי עצמי."},{"c":"CV 18","py":"Yutang","zh":"玉堂","m":"CV","loc":"On the anterior midline, at the level with the 3rd intercostal space.","ind":"pain in the chest, cough, asthma, vomiting.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"יוּ טָאנְג"},{"c":"CV 19","py":"Zigong","zh":"紫宮(宫)","m":"CV","loc":"On the anterior midline, at the level with the 2nd intercostal space.","ind":"pain in the chest, asthma, cough.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"דְזה גּוֹנְג"},{"c":"CV 20","py":"Huagai","zh":"華(华)蓋(盖)","m":"CV","loc":"On the anterior midline, at the midpoint of the sternal angle, at the level with the 1st intercostal space.","ind":"pain and fullness in the chest and intercostal region, asthma, cough.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"חוּאָה גַאי"},{"c":"CV 21","py":"Xuanji","zh":"璇璣(玑)","m":"CV","loc":"On the anterior midline, in the centre of the sternal manubrium, 1 cun below Tiantu (CV 22).","ind":"pain in the chest, cough, asthma.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"שְׂוֶואן גִּ'י"},{"c":"CV 22","py":"Tiantu","zh":"天突","m":"CV","loc":"In the centre of the suprasternal fossa.","ind":"asthma, cough, sore throat, dry throat, hiccup, sudden hoarseness of the voice, difficulty in swallowing, goiter.","mth":"First puncture perpendicularly 0.2 inch and then insert the needle tip downward along the posterior aspect of the sternum 0.5-1.0 inch. Moxibustion is applicable.","heN":"טְיֵין טוּ"},{"c":"CV 23","py":"Lianquan","zh":"廉泉","m":"CV","loc":"Above the Adam's apple, in the depression of the upper border of the hyoid bone.","ind":"swelling and pain of the subglossal region, salivation with glossoplegia, aphasia with stiffness of tongue by apoplexy, sudden hoarseness of the voice, difficulty in swallowing.","mth":"Puncture obliquely 0.5-1.0 inch toward the tongue root. Moxibustion is applicable.","heN":"לְיֶן צְ'וֶון"},{"c":"CV 24","py":"Chengjiang","zh":"承漿(浆)","m":"CV","loc":"In the depression in the centre of the mentolabial groove.","ind":"facial puffiness, swelling of the gums, toothache, salivation, mental disorder, deviation of the eye and mouth.","mth":"Puncture obliquely upward 0.2-0.3 inch. Moxibustion is applicable.","heN":"צֶ'נְג גְ'יָאנְג"}],"meridians":[{"ab":"LU","name":"Lung Meridian","zh":"手太陰(阴)肺經(经,経)","desc":"The Lung meridian (LU) consists of 11 acupuncture points which begins at LU 1 (Zhongfu) on the upper anterior chest, lateral to the infraclavicular fossa, travels down the anterior-lateral aspect of the arm, and ends at LU 11 (Shaoshang) on the radial side of the thumb near the corner of the nail.","n":11,"heN":"מרידיאן הריאות","hePath":"מתחיל באזור החזה, עובר לאורך הצד הפנימי של הזרוע ומסתיים באגודל.","heAssoc":"במסורת הסינית הוא משויך לנשימה, לגרון, לאף ולעור."},{"ab":"LI","name":"Large Intestine Meridian","zh":"手陽(阳)明大腸(肠)經(经,経)","desc":"The Large Intestine meridian (LI) consists of 20 acupuncture points which begins at LI 1 (Shangyang) on the radial side of the index finger near the corner of the nail, travels up the dorsal-radial aspect of the arm, crosses over the shoulder and the side of the neck to the face, and ends at LI 20 (Yingxiang) in the nasolabial sulcus beside the ala of the nose.","n":20,"heN":"מרידיאן המעי הגס","hePath":"מתחיל באצבע המורה, עולה בצד החיצוני של היד והכתף ומגיע אל הפנים, לצד האף.","heAssoc":"משויך במסורת לפנים, לאף, לגרון, לשיניים ולפעילות המעי."},{"ab":"ST","name":"Stomach Meridian","zh":"足陽(阳)明胃經(经,経)","desc":"The Stomach meridian (ST) consists of 45 acupuncture points which begins at ST 1 (Chengqi) on the face, between the eyeball and the infraorbital margin directly below the pupil, travels down across the face, neck, chest, and abdomen, continues down the anterior-lateral aspect of the leg, and ends at ST 45 (Lidui) on the lateral side of the second toe near the corner of the nail.","n":45,"heN":"מרידיאן הקיבה","hePath":"מתחיל מתחת לעין, יורד דרך הפנים, החזה והבטן וממשיך בקדמת הרגל עד האצבע השנייה.","heAssoc":"משויך במסורת לקיבה, לעיכול, לבטן, לפנים ולחיוניות."},{"ab":"SP","name":"Spleen Meridian","zh":"足太陰(阴)脾經(经,経)","desc":"The Spleen meridian (SP) consists of 21 acupuncture points which begins at SP 1 (Yinbai) on the medial side of the great toe near the corner of the nail, travels up along the medial aspect of the leg, continues up the abdomen and chest, and ends at SP 21 (Dabao) on the lateral thorax in the sixth intercostal space on the midaxillary line.","n":21,"heN":"מרידיאן הטחול","hePath":"מתחיל בבוהן הגדולה, עולה בצד הפנימי של הרגל, עובר בבטן ומגיע לצדי החזה.","heAssoc":"משויך במסורת לעיכול, לנוזלי הגוף, לבטן ולמערכת הרבייה."},{"ab":"HT","name":"Heart Meridian","zh":"手少陰(阴)心經(经,経)","desc":"The Heart meridian (HT) consists of 9 acupuncture points which begins at HT 1 (Jiquan) in the center of the axillary fossa, travels down the medial aspect of the arm, and ends at HT 9 (Shaochong) on the radial side of the little finger near the corner of the nail.","n":9,"heN":"מרידיאן הלב","hePath":"מתחיל באזור בית השחי, עובר בצד הפנימי של הזרוע ומסתיים בזרת.","heAssoc":"משויך במסורת ללב, לדופק, לשינה ולמצב הרגשי."},{"ab":"SI","name":"Small Intestine Meridian","zh":"手太陽(阳)小腸(肠)經(经,経)","desc":"The Small Intestine meridian (SI) consists of 19 acupuncture points which begins at SI 1 (Shaoze) on the ulnar side of the little finger near the corner of the nail, travels up the dorsal-ulnar aspect of the arm, crosses the scapular region, and ascends along the lateral neck and cheek, ending at SI 19 (Tinggong) in the depression between the tragus and the mandibular condyloid process.","n":19,"heN":"מרידיאן המעי הדק","hePath":"מתחיל בזרת, עולה לאורך הצד החיצוני של היד אל השכמה, הצוואר והפנים.","heAssoc":"משויך במסורת לכתף, לצוואר, לאוזן, ללסת ולמעי הדק."},{"ab":"BL","name":"Bladder Meridian","zh":"足太陽(阳)膀胱經(经,経)","desc":"The Bladder meridian (BL) consists of 67 acupuncture points which begins at BL 1 (Jingming) on the face in the depression just superior to the inner canthus of the eye, travels up over the head, descends down the back in two parallel lines flanking the spine, continues along the posterior aspect of the leg, and ends at BL 67 (Zhiyin) on the lateral side of the little toe near the corner of the nail.","n":67,"heN":"מרידיאן שלפוחית השתן","hePath":"מתחיל בזווית הפנימית של העין, עובר מעל הראש ולאורך שני צדי הגב, יורד בחלק האחורי של הרגל ומסתיים בזרת כף הרגל.","heAssoc":"משויך במסורת לגב ולעמוד השדרה, לראש, לעיניים ולמערכת השתן."},{"ab":"KI","name":"Kidney Meridian","zh":"足少陰(阴)腎(肾)經(经,経)","desc":"The Kidney meridian (KI) consists of 27 acupuncture points which begins at KI 1 (Yongquan) on the sole of the foot in the depression formed when the toes are flexed, travels up along the medial aspect of the leg, continues up the abdomen and chest close to the midline, and ends at KI 27 (Shufu) on the anterior chest in the depression at the inferior border of the clavicle.","n":27,"heN":"מרידיאן הכליות","hePath":"מתחיל בסוליית כף הרגל, עולה בצד הפנימי של הרגל וממשיך דרך הבטן אל החזה.","heAssoc":"משויך במסורת לכליות, לגב התחתון, לאוזניים, לעצמות ולחיוניות."},{"ab":"PC","name":"Pericardium Meridian","zh":"手厥陰(阴)心包(包)經(经,経)","desc":"The Pericardium meridian (PC) consists of 9 acupuncture points which begins at PC 1 (Tianchi) on the anterior chest in the fourth intercostal space, lateral to the nipple, travels down the middle of the anterior aspect of the arm, and ends at PC 9 (Zhongchong) at the center of the tip of the middle finger.","n":9,"heN":"מרידיאן מעטפת הלב","hePath":"מתחיל בחזה, עובר במרכז הצד הפנימי של הזרוע ומסתיים באצבע האמצעית.","heAssoc":"משויך במסורת לאזור החזה, לבחילה, לרגיעה ולמחזור הדם."},{"ab":"TE","name":"Triple Energizer Meridian","zh":"手少陽(阳)三焦經(经,経)","desc":"The Triple Energizer meridian (TE) consists of 23 acupuncture points which begins at TE 1 (Guanchong) on the ulnar side of the ring finger near the corner of the nail, travels up the dorsal-middle aspect of the arm, ascends over the shoulder and the side of the neck, and circles around the ear, ending at TE 23 (Sizhukong) in the depression at the lateral end of the eyebrow.","n":23,"heN":"מרידיאן המחמם המשולש","hePath":"מתחיל בקמיצה, עולה בצד החיצוני של הזרוע דרך הכתף והצוואר ומסתיים ליד הגבה.","heAssoc":"משויך במסורת לוויסות נוזלים וחום, לאוזניים, לכתפיים ולצדי הראש."},{"ab":"GB","name":"Gallbladder Meridian","zh":"足少陽(阳)膽(胆)經(经,経)","desc":"The Gallbladder meridian (GB) consists of 44 acupuncture points which begins at GB 1 (Tongziliao) on the head in the depression lateral to the outer canthus of the eye, zigzags across the temporal and occipital regions of the head, descends along the lateral side of the neck, trunk, and leg, and ends at GB 44 (Zuqiaoyin) on the lateral side of the fourth toe near the corner of the nail.","n":44,"heN":"מרידיאן כיס המרה","hePath":"מתחיל ליד העין, עובר בצדי הראש והגוף, יורד בצד החיצוני של הרגל ומסתיים באצבע הרביעית בכף הרגל.","heAssoc":"משויך במסורת לצדי הראש, לעיניים, לכתפיים, לירכיים ולכיס המרה."},{"ab":"LR","name":"Liver Meridian","zh":"足厥陰(阴)肝經(经,経)","desc":"The Liver meridian (LR) consists of 14 acupuncture points which begins at LR 1 (Dadun) on the lateral side of the great toe near the corner of the nail, travels up along the medial aspect of the leg, passes through the genital region and abdomen, and ends at LR 14 (Qimen) on the anterior chest in the sixth intercostal space.","n":14,"heN":"מרידיאן הכבד","hePath":"מתחיל בבוהן הגדולה, עולה בצד הפנימי של הרגל, עובר בבטן התחתונה ומגיע לבית החזה.","heAssoc":"משויך במסורת לכבד, לעיניים, לגידים, למתח ולזרימה חופשית בגוף."},{"ab":"GV","name":"Governor Vessel","zh":"督脈(脉)","desc":"The Governor Vessel (GV / Du Mai) consists of 28 acupuncture points which begins at GV 1 (Changqiang) in the perineal region midway between the tip of the coccyx and the anus, travels up along the posterior midline of the body over the spine and across the top of the head, and ends at GV 28 (Yinjiao) in the oral cavity at the frenulum of the upper lip.","n":28,"heN":"הערוץ השולט — דוּ מַאי","hePath":"עובר בקו האמצע האחורי: מאזור האגן, לאורך עמוד השדרה ומעל הראש עד הפנים.","heAssoc":"משויך במסורת לעמוד השדרה, למוח, לראש ולתפקוד היאנג בגוף."},{"ab":"CV","name":"Conception Vessel","zh":"任脈(脉)","desc":"The Conception Vessel (CV / Ren Mai) consists of 24 acupuncture points which begins at CV 1 (Huiyin) in the perineum at the midpoint of the perineal region, travels up along the anterior midline of the body through the abdomen, chest, and neck, and ends at CV 24 (Chengjiang) on the face in the depression at the center of the mentolabial sulcus.","n":24,"heN":"ערוץ ההתעברות — רֶן מַאי","hePath":"עובר בקו האמצע הקדמי: מאזור האגן, דרך הבטן והחזה ועד הסנטר.","heAssoc":"משויך במסורת לבטן, לחזה, לנשימה, לעיכול ולמערכת הרבייה."}],"zones":[{"c":"R0","he" function favKey(kind,id){return kind+':'+id;}

/* ---------- navigation ---------- */
const NAVS=['home','reflex','points','meridians','learn','favs'];
function renderNav(){
  $('#nav').innerHTML=NAVS.map(s=>`<button class="tab ${screen===s?'active':''}" data-go="${s}">${svg(s)}${t(s==='reflex'?'reflex':s==='points'?'points':s==='meridians'?'meridians':s)} ${s==='favs'?`<span class="count">${favs.length}</span>`:''}</button>`).join('');
}
function route(s){screen=s;query=$('#q').value='';renderNav();window.scrollTo(0,0);
  ({home:homeScreen,reflex:reflexScreen,points:pointsScreen,meridians:meridiansScreen,learn:learnScreen,favs:favsScreen,settings:settingsScreen,about:aboutScreen}[s]||homeScreen)();}

/* ---------- REFLEXOLOGY ---------- */

  const viewFile=footViews.find(v=>v[0]===reflexView)[1];
  const q=query.trim().toLowerCase();
  const zones=D.zones.filter(z=>!q||[z.c,z.he,z.en].some(v=>(v||'').toLowerCase().includes(q)));
  $('#view').innerHTML=`<div class="screen">
   <div class="section-head"><div><div class="eyebrow">${t('reflex')}</div><h2>${t('t_reflex')}</h2></div></div>
   <div class="workspace">
     <div class="card">
       <div class="toolbar"><div class="seg">${footViews.map(v=>`<button class="chip ${reflexView===v[0]?'active':''}" data-fv="${v[0]}">${t('v_'+v[0])}</button>`).join('')}</div></div>
       <div class="stage" id="stage"><img src="assets/${viewFile}" alt="${t('t_reflex')}"></div>
       <div class="zoombar"><span>${t('zoom')}</span><button data-zoom="-1">−</button><input id="zoom" type="range" min="100" max="360" step="20" value="${zoom}"><button data-zoom="1">+</button><span id="zval">${zoom}%</span></div>
       <div class="zonegrid">${D.zones.map(z=>`<button data-zone="${z.c}" title="${z.he}">${z.c.replace(/^R/,'')}</button>`).join('')}</div>
       <p class="map-note">${t('reflexNote')}</p>
     </div>

   </div></div>`;
  bindStage(); applyZoom();
}

/* ---------- POINTS (body) ---------- */
function pointsScreen(){
  const q=query.trim().toLowerCase().replace(/\s/g,'');
  let pts=D.points;
  if(merFilter) pts=pts.filter(p=>p.m===merFilter);
  if(q) pts=pts.filter(p=>[p.c,p.py,p.zh,heName(p),p.m].some(v=>(v||'').toLowerCase().replace(/\s/g,'').includes(q)));
  const placements=(D.placements[bodySubject]||[]);
  const byCode={}; D.points.forEach(p=>byCode[p.c]=p);
  const pins=placements.filter(pl=>byCode[pl.c]).map(pl=>`<button class="acupin" data-point="${pl.c}" title="${pl.c}" style="left:${pl.x*100}%;top:${pl.y*100}%"></button>`).join('');
  $('#view').innerHTML=`<div class="screen">
   <div class="section-head"><div><div class="eyebrow">${t('points')}</div><h2>${t('t_points')}</h2></div></div>
   <div class="workspace">
     <div class="card">
       <div class="toolbar"><span class="chip" style="pointer-events:none">${t('bodySubject')}</span>
         <select class="chip" id="subject">${Object.keys(subjFile).map(s=>`<option value="${s}" ${bodySubject===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></div>
       <div class="stage body" id="stage"><img src="assets/acusim/${subjFile[bodySubject]}.webp" alt="${t('points')}">${pins}</div>
       <p class="map-note">${t('pointsNote',placements.filter(pl=>byCode[pl.c]).length)}</p>
     </div>
     ${listPanel(t('listPoints'),pts.slice(0,120).map(p=>rowHtml(p.c,heName(p),(p.zh?p.zh+' · ':'')+p.py,MER_HE[p.m]||p.m,'point:'+p.c)),pts.length,`
        <select class="chip" id="merfilter"><option value="">${t('allMer')}</option>${D.meridians.map(m=>`<option value="${m.ab}" ${merFilter===m.ab?'selected':''}>${m.ab} · ${m.heN||m.name}</option>`).join('')}</select>`)}
   </div></div>`;
  $('#subject').onchange=e=>{bodySubject=e.target.value;pointsScreen();};
  $('#merfilter').onchange=e=>{merFilter=e.target.value;pointsScreen();};
}

/* ---------- MERIDIANS ---------- */

  if(curMer){return meridianDetail(curMer);}
  $('#view').innerHTML=`<div class="screen">
   <div class="section-head"><div><div class="eyebrow">${t('meridians')}</div><h2>${t('t_meridians')}</h2></div></div>
   <p style="color:var(--muted);margin:0 0 16px">${t('merIntro')}</p>
   <div class="mgrid">${D.meridians.map(m=>`<button class="mcard" data-mer="${m.ab}"><span class="ab">${m.ab}</span><b>${m.heN||m.name}</b><small>${m.n} ${t('pts')}</small><span class="mdot"></span></button>`).join('')}</div>

}
function meridianDetail(ab){
  const m=MER[ab]; const pts=D.points.filter(p=>p.m===ab);
  $('#view').innerHTML=`<div class="screen">
   <button class="chip" data-mer-back style="margin-bottom:14px">‹ ${t('meridians')}</button>
   <div class="section-head"><div><div class="eyebrow" style="direction:ltr">${m.ab} · ${m.zh||''}</div><h2>${m.heN||m.name}</h2></div></div>

   ${listPanel(t('listPoints')+' · '+m.ab,pts.map(p=>rowHtml(p.c,heName(p),(p.zh?p.zh+' · ':'')+p.py,'','point:'+p.c)),pts.length)}
