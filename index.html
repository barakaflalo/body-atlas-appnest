estion.","mth":"","heN":"פוּ טוֹנְג גוּ","heL":"5 צוּן מעל הטבור, 0.5 צוּן לרוחב משָׁאנְג וָאן (CV 13)."},{"c":"KI 21","py":"Youmen","zh":"幽門(门)","m":"KI","loc":"6 cun above the umbilicus, 0.5 cun lateral to Juque (CV 14).","ind":"abdominal pain and distension, indigestion, vomiting, diarrhea, nausea, morning sickness.","mth":"","heN":"יוֹ מֶן","heL":"6 צוּן מעל הטבור, 0.5 צוּן לרוחב מגּ'וּ צְ'וֶוה (CV 14)."},{"c":"KI 22","py":"Bulang","zh":"步(歩)廊","m":"KI","loc":"In the fifth intercostal space, 2 cun lateral to the Conception Vessel.","ind":"cough, asthma, distension and fullness in the chest and hypochondriac region, vomiting, anorexia.","mth":"","heN":"בּוּ לָאנְג","heL":"במרווח הבין־צלעי החמישי, 2 צוּן לרוחב ממרידיאן ההתעברות (CV)."},{"c":"KI 23","py":"Shengfeng","zh":"神(神)封","m":"KI","loc":".In the fourth intercostal space, 2 cun lateral to the anterior midline.","ind":"cough, asthma, fullness in the chest and hypochondriac region, mastitis.","mth":"","heN":"שֶׁן פֶנְג","heL":"במרווח הבין־צלעי הרביעי, 2 צוּן לרוחב מקו האמצע הקדמי."},{"c":"KI 24","py":"Lingxu","zh":"靈(灵,霊)墟(墟)","m":"KI","loc":"In the third intercostal space, 2 cun lateral to the anterior midline.","ind":"cough, asthma, fullness in the chest and hypochondriac region, mastitis.","mth":"","heN":"לִינְג שׂוּ","heL":"במרווח הבין־צלעי השלישי, 2 צוּן לרוחב מקו האמצע הקדמי."},{"c":"KI 25","py":"Shencang","zh":"神(神)藏(蔵)","m":"KI","loc":"In the second intercostal space, 2 cun lateral to the anterior midline.","ind":"cough, asthma, chest pain.","mth":"","heN":"שֶׁן צָאנְג","heL":"במרווח הבין־צלעי השני, 2 צוּן לרוחב מקו האמצע הקדמי."},{"c":"KI 26","py":"Yuzhong","zh":"彧中","m":"KI","loc":"In the first intercostal space, 2 cun lateral to the anterior midline.","ind":"cough, asthma, accumulation of phlegm, fullness in the chest and hypochondriac region.","mth":"","heN":"יוּ ג'וֹנְג","heL":"במרווח הבין־צלעי הראשון, 2 צוּן לרוחב מקו האמצע הקדמי."},{"c":"KI 27","py":"Shufu","zh":"兪(俞)府","m":"KI","loc":"In the depression on the lower border of the clavicle, 2 cun lateral to the anterior midline.","ind":"cough, asthma, chest pain.","mth":"","heN":"שׁוּ פוּ","heL":"בשקע שבשוליים התחתונים של עצם הבריח, 2 צוּן לרוחב מקו האמצע הקדמי."},{"c":"PC 1","py":"Tianchi","zh":"天池","m":"PC","loc":"In the fourth intercostal space, 1 cun lateral to the nipple and 5 cun lateral to the anterior midline.","ind":"suffocating sensation in the chest, pain in the hypochondriac region, swelling and pain of the axillary region.","mth":"Puncture obliquely 0.2-0.4 inch. Deep puncture is not advisable.","heN":"טְיֵין צְ'ה","heL":"במרווח הבין־צלעי הרביעי, 1 צוּן לרוחב מהפטמה ו־5 צוּן לרוחב מקו האמצע הקדמי."},{"c":"PC 2","py":"Tianquan","zh":"天泉","m":"PC","loc":"2 cun below the level of the anterior axillary fold, between the two heads of m. biceps brachii.","ind":"cardiac pain, distension of the hypochondriac region, cough, pain in the chest, back and the medial aspect of the arm.","mth":"Puncture perpendicularly 0.5-0.7 inch. Moxibustion is applicable.","heN":"טְיֵין צְ'וֶון","heL":"2 צוּן מתחת לגובה הקצה הקדמי של קפל בית השחי, בין שני ראשי השריר הדו־ראשי הזרועי."},{"c":"PC 3","py":"Quze","zh":"曲澤(泽,沢)","m":"PC","loc":"On the transverse cubital crease, at the ulnar side of the tendon of m. biceps brachii.","ind":"cardiac pain, palpitation, febrile diseases, irritability, stomachache, vomiting, pain in the elbow and arm, tremor of the hand and arm.","mth":"Puncture perpendicularly 0.5-0.7 inch, or prick with a three-edged needle to cause bleeding. Moxibustion is applicable.","heN":"צ'וּ דְזֶה","heL":"על קפל המרפק הרוחבי, בצד האולנרי של גיד השריר הדו־ראשי הזרועי."},{"c":"PC 4","py":"Ximen","zh":"郄門(门)","m":"PC","loc":"5 cun above the transverse crease of the wrist, on the line connecting Quze (PC 3) and Daling (PC 7), between the tendons of m. palmaris longus and m. flexor carpi radialis.","ind":"cardiac pain, palpitation, epistaxis, hematemesis, hemoptysis, chest pain, furuncle, epilepsy.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"שִׂי מֶן","heL":"5 צוּן מעל קפל שורש כף היד, על הקו המחבר בין צ'וּ דְזֶה (PC 3) לדָא לִינְג (PC 7), בין גידי השריר הכף־ידי הארוך (palmaris longus) ומכופף שורש כף היד הרדיאלי."},{"c":"PC 5","py":"Jianshi","zh":"間(间)使","m":"PC","loc":"3 cun above the transverse crease of the wrist, between the tendons of m. palmaris longus and m. flexor carpi radialis. (See Fig. 93)","ind":"cardiac pain, palpitation, stomachache, vomiting, febrile diseases, irritability, malaria, mental disorder, epilepsy, swelling of the axilla, contracture of the elbow and arm.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"גְּ'יֶן שִׁי","heL":"3 צוּן מעל קפל שורש כף היד, בין גידי השריר הכף־ידי הארוך ומכופף שורש כף היד הרדיאלי."},{"c":"PC 6","py":"Neiguan","zh":"內關(关,関)","m":"PC","loc":"2 cun above the transverse crease of the wrist, between the tendons of m. palmaris longus and m. flexor radialis.","ind":"cardiac pain, palpitation, stuffy chest, pain in the hypochondriac region, stomachache, nausea, vomiting, hiccup, mental disorder, epilepsy, insomnia, febrile diseases, irritability, malaria, contracture and pain of the elbow and arm.","mth":"Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.","heN":"נֵיי גוּאָן","heL":"בצד הפנימי של האמה, כשלוש אצבעות מעל קפל שורש כף היד, בין שני הגידים המרכזיים.","heA":"שייכת למרידיאן מעטפת הלב. משויכת במסורת לבחילה, לאזור החזה, לרגיעה ולמתח באמה ובשורש כף היד."},{"c":"PC 7","py":"Daling","zh":"大陵","m":"PC","loc":"In the middle of the transverse crease of the wrist, between the tendons of m. palmaris longus and m. flexor carpi radialis.","ind":"cardiac pain, palpitation, stomachache, vomiting, mental disorder, epilepsy, stuffy chest, pain in the hypochondriac region, convulsion, insomnia, irritability, foul breath.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"דָא לִינְג","heL":"באמצע קפל שורש כף היד, בין גידי ה ustion is applicable.","heN":"יֶה מֶן","heL":"כשהאגרוף קפוץ — בשקע פרוקסימלית לשולי הקרום שבין הקמיצה לזרת, במפגש העור האדום והלבן."},{"c":"TE 3","py":"Zhongzhu","zh":"中渚(渚)","m":"TE","loc":"When the fist is clenched, the point is on dorsum of the hand between the fourth and fifth metacarpal bones, in the depression proximal to the fourth metacarpophalangeal joint.","ind":"headache, redness of the eye, deafness, tinnitus, sore throat, febrile diseases, pain in the elbow and arm, motor impairment of fingers.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"ג'וֹנְג ג'וּ","heL":"כשהאגרוף קפוץ — בגב כף היד, בין עצמות כף היד הרביעית והחמישית, בשקע פרוקסימלית למפרק כף־היד–אצבע הרביעי."},{"c":"TE 4","py":"Yangchi","zh":"陽(阳)池","m":"TE","loc":"On the transverse crease of the dorsum of wrist, in the depression lateral to the tendon of m. extensor digitorum communis.","ind":"pain in the arm, shoulder and wrist, malaria, deafness, thirst.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"יָאנְג צְ'ה","heL":"על הקפל הרוחבי בגב שורש כף היד, בשקע הלטרלי לגיד מיישר האצבעות המשותף."},{"c":"TE 5","py":"Waiguan","zh":"外關(关,関)","m":"TE","loc":"2 cun proximal to the dorsal crease of the wrist, on the line connecting Yangchi (TE 4) and the tip of olecranon, between the radius and ulna.","ind":"febrile diseases, headache, pain in the cheek, strained neck, deafness, tinnitus, pain in the hypochondriac region, motor impairment of the elbow and arm, pain of the fingers, hand tremor.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"וַאי גְוָאן","heL":"2 צוּן פרוקסימלית לקפל שורש כף היד הגבי, על הקו המחבר בין יָאנְג צְ'ה (TE 4) לקצה בליטת המרפק, בין עצם החישור לעצם הגומד."},{"c":"TE 6","py":"Zhigou","zh":"支溝(沟)","m":"TE","loc":"3 cun proximal to the dorsal crease of the wrist, on the line connecting Yangchi (TE 4) and the tip of olecranon, between the radius and ulna, on the radial side of m. extensor digitorum.","ind":"tinnitus, deafness, pain in the hypochondriac region, vomiting, constipation, febrile diseases, aching and heavy sensation of the shoulder and back, sudden hoarseness of the voice.","mth":"Puncture perpendicularly 0.8-1.2 inches. Moxibustion is applicable.","heN":"ג'ה גוֹ","heL":"3 צוּן פרוקסימלית לקפל שורש כף היד הגבי, על אותו קו, בין עצם החישור לעצם הגומד, בצד הרדיאלי של מיישר האצבעות."},{"c":"TE 7","py":"Huizong","zh":"會(会)宗","m":"TE","loc":"At the level with Zhigou (TE 6), on the ulnar side of Zhigou (TE 6), on the radial border of the ulna.","ind":"deafness, pain in the ear, epilepsy, pain of the arm.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"חְוֵוי דְזוֹנְג","heL":"בגובה ג'ה גוֹ (TE 6), בצד האולנרי שלה, על השוליים הרדיאליים של עצם הגומד."},{"c":"TE 8","py":"Sanyangluo","zh":"三陽(阳)絡(络)","m":"TE","loc":"4 cun proximal to the dorsal crease of the wrist, between the radius and ulna.","ind":"deafness, sudden hoarseness of the voice, pain in the chest and hypochondriac region, pain in the hand and arm, toothache.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"סָאן יָאנְג לוֹ","heL":"4 צוּן פרוקסימלית לקפל שורש כף היד הגבי, בין עצם החישור לעצם הגומד."},{"c":"TE 9","py":"Sidu","zh":"四瀆(渎)","m":"TE","loc":"On the lateral side of the forearm, 5 cun below the olecranon, between the radius and ulna.","ind":"deafness, toothache, migraine, sudden hoarseness of the voice, pain in the forearm.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"סְה דוּ","heL":"בצד החיצוני של האמה, 5 צוּן מתחת לבליטת המרפק, בין עצם החישור לעצם הגומד."},{"c":"TE 10","py":"Tianjing","zh":"天井","m":"TE","loc":"When the elbow is flexed, the point is in the depression about 1 cun superior to the olecranon.","ind":"migraine, pain in the neck, shoulder and arm, epilepsy, scrofula, goiter.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"טְיֵין גִּ'ינְג","heL":"כשהמרפק כפוף — בשקע כ־1 צוּן מעל בליטת המרפק."},{"c":"TE 11","py":"Qinglengyuan","zh":"淸(清)冷(令)淵(渊)","m":"TE","loc":"1 cun above Tianjing (TE 10) when the elbow is flexed.","ind":"","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"צִ'ינְג לֶנְג יוּאָן","heL":"1 צוּן מעל טְיֵין גִּ'ינְג (TE 10) כשהמרפק כפוף."},{"c":"TE 12","py":"Xiaoluo","zh":"消濼(泺)","m":"TE","loc":"On the line joining the olecranon and Jianliao (TE 14), midway between Qinglengyuan (TE 11) and Naohui (TE 13).","ind":"headache, neck rigidity, motor impairment and pain of the arm.","mth":"Puncture perpendicularly 0.5-0.7 inch. Moxibustion is applicable.","heN":"שְׂיָאו לוֹ","heL":"על הקו המחבר בין בליטת המרפק לגְ'יֶן לְיָאו (TE 14), באמצע הדרך בין צִ'ינְג לֶנְג יוּאָן (TE 11) לנָאו חְווֵי (TE 13)."},{"c":"TE 13","py":"Naohui","zh":"臑會(会)","m":"TE","loc":"On the line joining Jianliao (TE 14) and the olecranon, on the posterior border of m. deltoideus.","ind":"goiter, pain in the shoulder and arm.","mth":"Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.","heN":"נָאו חְוֵוי","heL":"על הקו המחבר בין גְ'יֶן לְיָאו (TE 14) לבליטת המרפק, על השוליים האחוריים של השריר הדלטואידי."},{"c":"TE 14","py":"Jianliao","zh":"肩髎(髎)","m":"TE","loc":"On the shoulder, posterior to Jianyu (LI 15), in the depression inferior and posterior to the acromion when the arm is abducted.","ind":"pain and motor impairment of the shoulder and upper arm.","mth":"Puncture perpendicularly 0.7-1.0 inch. Moxibustion is applicable.","heN":"גְ'יֶן לְיָאו","heL":"על הכתף, אחורית לגְ'יֶן יוּ (LI 15), בשקע התחתי־אחורי לאקרומיון כשהזרוע מורחקת."},{"c":"TE 15","py":"Tianliao","zh":"天髎(髎)","m":"TE","loc":"Midway between Jianjing (GB 21) and Quyuan (S I 13), on the superior angle of the scapula.","ind":"pain in the shoulder and elbow, stiffness of the neck.","mth":"Puncture perpendicularly 0.3-0.5 inch. Moxibustion is applicable.","heN":"טְיֵין לְיָאו","heL":"באמצע הדרך בין גְ'יֶן ג n of the eye and mouth.","mth":"Puncture subcutaneously 0.3-0.5 inch.","heN":"טוֹנְג דְזה לְיָאו","heL":"0.5 צוּן לרוחב מזווית העין החיצונית, בשקע שבצד החיצוני של ארובת העין."},{"c":"GB 2","py":"Tinghui","zh":"聽(听,聴)會(会)","m":"GB","loc":"Anterior to the intertragic notch, at the posterior border of the condyloid process of the mandible. The point is located with the mouth open.","ind":"deafness, tinnitus, toothache, motor impairment of the temporomandibular joint, mumps, deviation of the eye and mouth.","mth":"Puncture perpendicularly 0.5-0.7 inch. Moxibustion is applicable.","heN":"טִינְג חְוֵוי","heL":"קדמית לחריץ הבין־טראגוסי, בשוליים האחוריים של הזיז הפרקי של הלסת התחתונה. מאתרים כשהפה פתוח."},{"c":"GB 3","py":"Shangguan","zh":"上關(关,関)","m":"GB","loc":"In the front of the ear, on the upper border of the zygomatic arch, in the depression directly above Xiaguan (ST 7).","ind":"headache, deafness, tinnitus, diplacusis, deviation of the eye and mouth, toothache.","mth":"Puncture perpendicularly 0.3-0.5 inch. Deep puncture is not advisable. Moxibustion is applicable.","heN":"שָׁאנְג גְוָאן","heL":"לפני האוזן, בשוליים העליונים של קשת עצם הלחי, בשקע ישירות מעל שְׂיָה גְוָאן (ST 7)."},{"c":"GB 4","py":"Hanyan","zh":"頷(颔)厭(厌)","m":"GB","loc":"Within the hairline of the temporal region, at the junction of the upper 1/4 and lower 3/4 of the distance between Touwei (ST 8) and Qubin (GB 7).","ind":"migraine, vertigo, tinnitus, pain in the outer canthus, toothache, convulsion, epilepsy.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"חָאן יֶן","heL":"בתוך קו השיער באזור הרקה, במפגש הרבע העליון ושלושת הרבעים התחתונים של המרחק בין טוֹ וֵיי (ST 8) לצ'וּ בִּין (GB 7)."},{"c":"GB 5","py":"Xuanlu","zh":"懸(悬)顱(颅)","m":"GB","loc":"Within the hairline of the temporal region, midway of the border line connecting Touwei (ST 8) and Qubin (GB 7).","ind":"migraine, pain in the outer canthus, facial swelling.","mth":"Puncture subcutaneously 0.3-0.5 inch. Mox ","zh":"膝關(关,関)","m":"LR","loc":"Posterior and inferior to the medial condyle of the tibia, in the upper portion of the medial head of m. gastrocnemius, 1 cun posterior to Yinlingquan (SP 9).","ind":"","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"שִׂי גְוָאן","heL":"אחורית ותחתית לבליטה הפרקית המדיאלית של עצם השוק, בחלק העליון של הראש המדיאלי של שריר התאומים, 1 צוּן אחורית ליִין לִינְג צְ'וֶון (SP 9)."},{"c":"LR 8","py":"Ququan","zh":"曲泉","m":"LR","loc":"When knee is flexed, the point is at the medial end of the transverse popliteal crease, posterior to the medial epicondyle of the tibia, in the depression of the anterior border of the insertions of m. semimembranosus and m. semitendinosus.","ind":"prolapse of the uterus, lower abdominal pain, retention of urine, nocturnal emission, pain in the external genitalia, pruritus vulvae, pain in the medial aspect of the knee and thigh.","mth":"Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.","heN":"צ'וּ צְ'וֶון","heL":"כשהברך כפופה — בקצה המדיאלי של קפל הברך הרוחבי, אחורית לבליטה הפרקית המדיאלית של עצם השוק, בשקע שבשוליים הקדמיים של היאחזות השרירים החצי־קרומי והחצי־גידי."},{"c":"LR 9","py":"Yinbao","zh":"陰(阴)包(包)","m":"LR","loc":"4 cun above the medial epicondyle of the femur, between m. vastus medialis and m. sartorius.","ind":"pain in the lumbosacral region, lower abdominal pain, enuresis, retention of urine, irregular menstruation.","mth":"Puncture perpendicularly 0.5-0.7 inch. Moxibustion is applicable.","heN":"יִין בָּאו","heL":"4 צוּן מעל הבליטה הפרקית המדיאלית של עצם הירך, בין הראש המדיאלי הרחב לשריר החייטי (sartorius)."},{"c":"LR 10","py":"Zuwuli","zh":"足五里","m":"LR","loc":"3 cun directly below Qichong (ST 30), at the proximal end of the thigh, below the pubic tubercle and on the lateral border of m. abductor longus.","ind":"lower abdominal distension and fullness, retention of urine.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"דְזוּ ווּ לִי","heL":"3 צוּן ישירות מתחת לצִ'י צ'וֹנְג (ST 30), בקצה העליון של הירך, מתחת לפקעת החיק, על השוליים החיצוניים של המקרב הארוך."},{"c":"LR 11","py":"Yinlian","zh":"陰(阴)廉","m":"LR","loc":"2 cun directly below Qichong (ST 30), at the proximal end of the thigh, below the pubic tubercle and on the lateral border of m. abductor longus.","ind":"irregular menstruation, leukorrhea, lower abdominal pain, pain in the thigh and leg.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"יִין לְיֶן","heL":"2 צוּן ישירות מתחת לצִ'י צ'וֹנְג (ST 30), בקצה העליון של הירך, מתחת לפקעת החיק, על השוליים החיצוניים של המקרב הארוך."},{"c":"LR 12","py":"Jimai","zh":"急脈(脉)","m":"LR","loc":"Lateral to the pubic tubercle, lateral and inferior to Qichong (ST 30), in the inguinal groove where the pulsation of femoral artery is palpable, 2.5 cun lateral to the anterior midline.","ind":"lower abdominal pain, hernia, pain in the external genitalia.","mth":"Moxibustion is applicable.","heN":"גִּ'י מַאי","heL":"לרוחב מפקעת החיק, לרוחב ותחתית לצִ'י צ'וֹנְג (ST 30), בחריץ המפשעה שבו ניתן למשש את פעימת עורק הירך, 2.5 צוּן לרוחב מקו האמצע הקדמי."},{"c":"LR 13","py":"Zhangmen","zh":"章門(门)","m":"LR","loc":"On the lateral side of the abdomen, below the free end of the eleventh rib.","ind":"abdominal distension, borborygmus, pain in the hypochondriac region, vomiting, diarrhea, indigestion.","mth":"Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.","heN":"ג'ָאנְג מֶן","heL":"בצד של הבטן, מתחת לקצה החופשי של הצלע האחת־עשרה."},{"c":"LR 14","py":"Qimen","zh":"期門(门)","m":"LR","loc":"Directly below the nipple, in the sixth intercostal space, 4 cun lateral to the anterior midline.","ind":"hypochondriac pain, abdominal distension, hiccup, acid regurgitation, mastitis, depression, febrile diseases.","mth":"Puncture obliquely 0.3-0.5 inch. Moxibustion is applicable.","heN":"צִ'י מֶן","heL":"ישירות מתחת לפטמה, במרווח הבין־צלעי השישי, 4 צוּן לרוחב מקו האמצע הקדמי."},{"c":"GV 1","py":"Changqiang","zh":"長(长)強","m":"GV","loc":"Midway between the tip of the coccyx and the anus, locating the point in prone position.","ind":"diarrhea, bloody stools, hemorrhoids, prolapse of the rectum, constipation, pain in the lower back, epilepsy.","mth":"Puncture perpendicularly 0.5-0.1 inch. Moxibustion is applicable.","heN":"צָ'אנְג צְ'יָאנְג","heL":"באמצע הדרך בין קצה עצם הזנב (coccyx) לפי הטבעת; מאתרים בשכיבה על הבטן."},{"c":"GV 2","py":"Yaoshu","zh":"腰兪(俞)","m":"GV","loc":"In the hiatus of the sacrum.","ind":"irregular menstruation, pain and stiffness of the lower back, hemorrhoids, muscular atrophy of the lower extremities, epilepsy.","mth":"Puncture obliquely upward 0.5-1.0 inch. Moxibustion is applicable.","heN":"יָאו שׁוּ","heL":"במפתח העצה (sacral hiatus)."},{"c":"GV 3","py":"Yaoyangguan","zh":"腰陽(阳)關(关,関)","m":"GV","loc":"Below the spinous process of the fourth lumbar vertebra, at the level with the crista iliaca.","ind":"","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"יָאו יָאנְג גְוָאן","heL":"מתחת לזיז הקוצני של החוליה המותנית הרביעית, בגובה ציצת הכסל."},{"c":"GV 4","py":"Mingmen","zh":"命門(门)","m":"GV","loc":"Below the spinous process of the second lumbar vertebra.","ind":"stiffness of the back, lumbago, impotence, nocturnal emission, irregular menstruation, diarrhea, indigestion, leukorrhea.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"מִינְג מֶן","heL":"מתחת לזיז הקוצני של החוליה המותנית השנייה."},{"c":"GV 5","py":"Xuanshu","zh":"懸(悬)樞(枢)","m":"GV","loc":"Below the spinous process of the first lumbar vertebra.","ind":"pain and stiffness of the lower back, diarrhea, indigestion.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"שְׂוֶואן שׁוּ","heL":"מתחת לזיז הקוצני של החוליה המותנית הראשונה."},{"c":"GV 6","py":"Jizhong","zh":"脊中","m":"GV","loc":"Below the spinous process of the eleventh thoracic vertebra.","ind":"pain in the epigastric region, diarrhea, jaundice, epilepsy, stiffness and pain of the back.","mth":"Puncture perpendicularly 0.5-1.0 inch.","heN":"גִּ'י ג'וֹנְג","heL":"מתחת לזיז הקוצני של החוליה החזית האחת־עשרה."},{"c":"GV 7","py":"Zhongshu","zh":"中樞(枢)","m":"GV","loc":"Below the spinous process of the tenth thoracic vertebra.","ind":"pain in the epigastric region, low back pain, stiffness of the back.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"ג'וֹנְג שׁוּ","heL":"מתחת לזיז הקוצני של החוליה החזית העשירית."},{"c":"GV 8","py":"Jinsuo","zh":"筋縮(缩)","m":"GV","loc":"Below the spinous process of the ninth thoracic vertebra.","ind":"epilepsy, stiffness of the back, gastric pain.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"גִּ'ין סוֹ","heL":"מתחת לזיז הקוצני של החוליה החזית התשיעית."},{"c":"GV 9","py":"Zhiyang","zh":"至陽(阳)","m":"GV","loc":"Below the spinous process of the seventh thoracic vertebra, approximately at the level with the inferior angle of the scapula.","ind":"jaundice, cough, asthma, stiffness of the back, pain in the chest and back.","mth":"Puncture obliquely upward 0.5-1.0 inch. Moxibustion is applicable.","heN":"ג'ה יָאנְג","heL":"מתחת לזיז הקוצני של החוליה החזית השביעית, בערך בגובה הזווית התחתונה של עצם השכם."},{"c":"GV 10","py":"Lingtai","zh":"靈(灵,霊)臺(台)","m":"GV","loc":"Below the spinous process of the sixth thoracic vertebra.","ind":"cough, asthma, furuncle, back pain, neck rigidity.","mth":"Puncture obliquely upward 0.5-1.0 inch. Moxibustion is applicable.","heN":"לִינְג טַאי","heL":"מתחת לזיז הקוצני של החוליה החזית השישית."},{"c":"GV 11","py":"Shendao","zh":"神(神)道(道)","m":"GV","loc":"Below the spinous process of the fifth thoracic vertebra.","ind":"poor memory, anxiety, palpitation, pain and stiffness of the back, cough, cardiac pain.","mth":"Puncture obliquely upward 0.5-1.0 inch. Moxibustion is applicable.","heN":"שֶׁן דָאו","heL":"מתחת לזיז הקוצני של החוליה החזית החמישית."},{"c":"GV 12","py":"Shenzhu","zh":"身柱","m":"GV","loc":"Below the spinous process of the third thoracic vertebra.","ind":"cough, asthma, epilepsy, pain and stiffness of the back, furuncle.","mth":"Puncture obliquely upward 0.5-1.0 inch. Moxibustion is applicable.","heN":"שֶׁן ג'וּ","heL":"מתחת לזיז הקוצני של החוליה החזית השלישית."},{"c":"GV 13","py":"Taodao","zh":"陶道(道)","m":"GV","loc":"Below the spinous process of the first thoracic vertebra.","ind":"stiffness of the back, headache, malaria, febrile diseases.","mth":"Puncture obliquely upward 0.5-1.0 inch. Moxibustion is applicable.","heN":"טָאו דָאו","heL":"מתחת לזיז הקוצני של החוליה החזית הראשונה."},{"c":"GV 14","py":"Dazhui","zh":"大椎","m":"GV","loc":"Below the spinous process of the seventh cervical vertebra, approximately at the level of the shoulders.","ind":"neck pain and rigidity, malaria, febrile diseases, epilepsy, afternoon fever, cough, asthma, common cold, back stiffness.","mth":"Puncture obliquely upward 0.5-1.0 inch. Moxibustion is applicable.","heN":"דָא ג'וֵוי","heL":"מתחת לזיז הקוצני של החוליה הצווארית השביעית, בערך בגובה הכתפיים."},{"c":"GV 15","py":"Yamen","zh":"瘂(哑)門(门)","m":"GV","loc":"0.5 cun directly above the midpoint of the posterior hairline, in the depression below the spinous process of the first cervical vertebra.","ind":"mental disorder, epilepsy, deafness and mute, sudden hoarseness of the voice, apoplexy, stiffness of the tongue and aphasia, occipital headache, neck rigidity.","mth":"Puncture perpendicularly 0.5-0.8 inch. Neither upward obliquely nor deep puncture is advisable. It is near the medullary bulb in the deep layer, and the depth and angle of the puncture should be paid strict attention to.","heN":"יָא מֶן","heL":"0.5 צוּן ישירות מעל אמצע קו השיער האחורי, בשקע שמתחת לזיז הקוצני של החוליה הצווארית הראשונה."},{"c":"GV 16","py":"Fengfu","zh":"風(风)府","m":"GV","loc":"1 cun directly above the midpoint of the posterior hairline, directly below the external occipital protuberance, in the depression between m. trapezius of both sides.","ind":"headache, neck rigidity, blurred vision, epistaxis, sore throat, post-apoplexy aphasia, hemiplegia, mental disorder.","mth":"Puncture perpendicularly 0.5-0.8 inch. Deep puncture is not advisable. Medullary bulb is in the deep layer, special attention should be paid in acupuncture.","heN":"פֶנְג פוּ","heL":"1 צוּן ישירות מעל אמצע קו השיער האחורי, ישירות מתחת לבליטת העורף החיצונית, בשקע שבין השריר הטרפזי משני הצדדים."},{"c":"GV 17","py":"Naohu","zh":"腦(脑,脳)戶","m":"GV","loc":"2.5 cun directly above the midpoint of the posterior hairline, 1.5 cun directly above Fengfu (GV 16), in the depression on the upper border of the external occipital protuberance.","ind":"epilepsy, dizziness, pain and stiffness of the neck.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"נָאו חוּ","heL":"2.5 צוּן ישירות מעל אמצע קו השיער האחורי, 1.5 צוּן ישירות מעל פֶנְג פוּ (GV 16), בשקע שבשוליים העליונים של בליטת העורף החיצונית."},{"c":"GV 18","py":"Qiangjian","zh":"強間(间)","m":"GV","loc":"4 cun directly above the midpoint of the posterior hairline and 1.5 cun above Naohu (GV 17).","ind":"headache, neck rigidity, blurred vision, mania.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"צְ'יָאנְג גְ'יֶן","heL":"4 צוּן ישירות מעל אמצע קו השיער האחורי, 1.5 צוּן מעל נָאו חוּ (GV 17)."},{"c":"GV 19","py":"Houding","zh":"後(后)頂(顶)","m":"GV","loc":"5.5 cun directly above the midpoint of the posterior hairline, 1.5 cun directly above Qiangjian (GV 18).","ind":"headache, vertigo, mania, epilepsy.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable. .","heN":"חוֹ דִינְג","heL":"5.5 צוּן ישירות מעל אמצע קו השיער האחורי, 1.5 צוּן ישירות מעל צְ'יָאנְג גְ'יֶן (GV 18)."},{"c":"GV 20","py":"Baihui","zh":"百會(会)","m":"GV","loc":"On the midline of the head, 5 cun directly above the midpoint of the anterior hairline, approximately on the midpoint of the line connecting the apexes of both ears.","ind":"headache, vertigo, tinnitus, nasal obstruction, aphasia by apoplexy, coma, mental disorder, prolapse of the rectum and the uterus.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"בָּאי חְווֵי","heA":"נמצאת על המרידיאן המרכזי האחורי. במסורת היא משויכת לראש, לערנות, לסחרחורת ולתחושת יציבות.","heC":"השתמשו במגע קל בלבד באזור הראש.","heL":"על קו האמצע של הראש, 5 צוּן ישירות מעל אמצע קו השיער הקדמי, בערך באמצע הקו המחבר בין קצות שתי האוזניים."},{"c":"GV 21","py":"Qianding","zh":"前頂(顶)","m":"GV","loc":"3.5 cun directly above the midpoint of the anterior hairline and 1.5 cun anterior to Baihui (GV 20).","ind":"epilepsy, dizziness, blurred vision, vertical headache, rhinorrhea.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"צְ'יֶן דִינְג","heL":"3.5 צוּן ישירות מעל אמצע קו השיער הקדמי, 1.5 צוּן קדמית לבָּאי חְווֵי (GV 20)."},{"c":"GV 22","py":"Xinhui","zh":"顖(囟)會(会)","m":"GV","loc":"2 cun posterior to the midpoint of the anterior hairline, 3 cun anterior to Baihui (GV 20).","ind":"headache, blurred vision, rhinorrhea, infantile convulsion.","mth":"Puncture subcutaneously 0.3-0.5 inch. This point is prohibited in infants with metopism. Moxibustion is applicable.","heN":"שִׁין חְוֵוי","heL":"2 צוּן אחורית לאמצע קו השיער הקדמי, 3 צוּן קדמית לבָּאי חְווֵי (GV 20)."},{"c":"GV 23","py":"Shangxing","zh":"上星","m":"GV","loc":"I cun directly above the midpoint of the anterior hairline.","ind":"headache, ophthalmalgia, epistaxis, rhinorrhea, mental disorder.","mth":"Puncture subcutaneously 0.3-0.5 inch or prick to cause bleeding. This point is prohibited in infants with metopism. Moxibustion is applicable.","heN":"שָׁאנְג שִׁינְג","heL":"1 צוּן ישירות מעל אמצע קו השיער הקדמי."},{"c":"GV 24","py":"Shenting","zh":"神(神)庭","m":"GV","loc":"0.5 cun directly above the midpoint of the anterior hairline.","ind":"epilepsy, anxiety, palpitation, insomnia, headache, vertigo, rhinorrhea.","mth":"Puncture subcutaneously 0.3-0.5 inch, or prick to cause bleeding.","heN":"שֶׁן טִינְג","heL":"0.5 צוּן ישירות מעל אמצע קו השיער הקדמי."},{"c":"GV 25","py":"Suliao","zh":"素髎(髎)","m":"GV","loc":"On the tip of the nose.","ind":"loss of consciousness, nasal obstruction, epistaxis, rhinorrhea, rosacea.","mth":"Puncture perpendicularly 0.2-0.3 inch, or prick to cause bleeding.","heN":"סוּ לְיָאו","heL":"על קצה האף."},{"c":"GV 26","py":"Shuigou, Renzhong","zh":"水溝(沟)","m":"GV","loc":"At the junction of the upper third and middle third of the philtrum.","ind":"","mth":"Puncture obliquely upward OJ-0.5 inch.","heN":"שְׁוֵוי גוֹ","heL":"במפגש השליש העליון והשליש האמצעי של התלם השפתי (philtrum)."},{"c":"GV 27","py":"Duiduan","zh":"兌(兑)端","m":"GV","loc":"On the labial tubercle of the upper lip, on the vermilion border between the philtrum and upper lip.","ind":"mental disorder, lip twitching, lip stiffness, pain and swelling of the gums.","mth":"Puncture obliquely upward 0.2-0.3 inch.","heN":"דְוֵוי דְוָאן","heL":"על פקעת השפה העליונה, על שפת האדום שבין התלם השפתי לשפה העליונה."},{"c":"GV 28","py":"Yinjiao","zh":"齦(龈)交","m":"GV","loc":"At the junction of the gum and the frenulum of the upper lip.","ind":"mental disorder, pain and swelling of the gums, rhinorrhea.","mth":"Puncture obliquely upward 0.1 -0.2 inch, or prick to cause bleeding.","heN":"יִין גְ'יָאו","heL":"במפגש החניכיים והרסן (frenulum) של השפה העליונה."},{"c":"CV 1","py":"Huiyin","zh":"會(会)陰(阴)","m":"CV","loc":"Between the anus and the root of the scrotum in males and between the anus and the posterior labial commissure in females.","ind":"vaginitis, retention of urine, hemorrhoids, nocturnal emission, enuresis, irregular menstruation, mental disorder.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"חְוֵוי יִין","heL":"בין פי הטבעת לשורש שק האשכים אצל גברים, ובין פי הטבעת למפתח השפתיים האחורי אצל נשים."},{"c":"CV 2","py":"Qugu","zh":"曲骨(骨)","m":"CV","loc":"On the midpoint of the upper border of the symphysis pubis.","ind":"retention and dribbling of urine, enuresis, nocturnal emission, impotence, morbid leukorrhea, irregular menstruation, dysmenorrhea, hernia.","mth":"Puncture perpendicularly 0.5-1.0 inch. Great care should be taken to puncture the points from Qugu (CV 2) to Shangwan (CV 13) of this meridian in pregnant women. Moxibustion is applicable.","heN":"צ'וּ גוּ","heL":"על אמצע השוליים העליונים של צמת החיק."},{"c":"CV 3","py":"Zhongji","zh":"中極(极)","m":"CV","loc":"On the anterior midline, 4 cun below the umbilicus.","ind":"enuresis, nocturnal emission, impotence, hernia, uterine bleeding, irregular menstruation, dysmenorrhea, morbid leukorrhea, frequency of urination, retention of urine, pain in the lower abdomen, prolapse of the uterus, vaginitis.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"ג'וֹנְג גִּ'י","heL":"על קו האמצע הקדמי, 4 צוּן מתחת לטבור."},{"c":"CV 4","py":"Guanyuan","zh":"關(关,関)元","m":"CV","loc":"On the anterior midline, 3 cun below the umbilicus.","ind":"enuresis, nocturnal emission, frequency of urination, retention of urine, hernia, irregular menstruation, morbid leukorrhea, dysmenorrhea, uterine bleeding, postpartum hemorrhage, lower abdominal pain, indigestion, diarrhea, prolapse of the rectum, flaccid type of apoplexy.","mth":"Puncture perpendicularly 0.8-1.2 inches. This is one of the important points for tonification. Moxibustion is applicable.","heN":"גְוָאן יוּאָן","heL":"על קו האמצע הקדמי, 3 צוּן מתחת לטבור."},{"c":"CV 5","py":"Shimen","zh":"石門(门)","m":"CV","loc":"On the anterior midline, 2 cun below the umbilicus.","ind":"abdominal pain, diarrhea, edema, hernia, anuria, enuresis, amenorrhea, morbid leukorrhea, uterine bleeding, postpartum hemorrhage.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"שִׁי מֶן","heL":"על קו האמצע הקדמי, 2 צוּן מתחת לטבור."},{"c":"CV 6","py":"Qihai","zh":"氣(气,気)海(海)","m":"CV","loc":"On the anterior midline, 1.5 cun below the umbilicus.","ind":"abdominal pain, enuresis, nocturnal emission, impotence, hernia, edema, diarrhea, dysentery, uterine bleeding, irregular menstruation, dysmenorrhea, amenorrhea, morbid leukorrhea, postpartum hemorrhage, constipation, flaccid type of apoplexy, asthma.","mth":"Puncture perpendicularly 0.8-1.2 inches. This is one of the important points for tonification. Moxibustion is applicable.","heN":"צִ'י חַאי","heL":"על קו האמצע הקדמי, 1.5 צוּן מתחת לטבור."},{"c":"CV 7","py":"Yinjiao","zh":"陰(阴)交","m":"CV","loc":"On the anterior midline, 1 cun below the umbilicus.","ind":"abdominal distension, edema, hernia, irregular menstruation.","mth":"Puncture perpendicularly 0.8-1.2 inches. Moxibustion is applicable.","heN":"יִין גְ'יָאו","heL":"על קו האמצע הקדמי, 1 צוּן מתחת לטבור."},{"c":"CV 8","py":"Shenque","zh":"神(神)闕(阙)","m":"CV","loc":"In the centre of the umbilicus.","ind":"abdominal pain, borborygmus, flaccid type of apoplexy, prolapse of the rectum, unchecked diarrhea.","mth":"Puncture is prohibited! Moxibustion is applicable.","heN":"שֶׁן צְ'וֶוה","heL":"במרכז הטבור."},{"c":"CV 9","py":"Shuifen","zh":"水分","m":"CV","loc":"On the anterior midline, 1 cun above the umbilicus.","ind":"abdominal pain, borborygmus, edema, retention of urine, diarrhea.","mth":"Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.","heN":"שְׁוֵוי פֶן","heL":"על קו האמצע הקדמי, 1 צוּן מעל הטבור."},{"c":"CV 10","py":"Xiawan","zh":"下脘","m":"CV","loc":"On the anterior midline, 2 cun above the umbilicus.","ind":"epigastric pain, abdominal pain, borborygmus, indigestion, vomiting, diarrhea.","mth":"Puncture perpendicularly 0.5-1.2 inches. Moxibustion is applicable.","heN":"שְׂיָה וָאן","heL":"על קו האמצע הקדמי, 2 צוּן מעל הטבור."},{"c":"CV 11","py":"Jianli","zh":"建里","m":"CV","loc":"On the anterior midline, 3 cun above the umbilicus.","ind":"stomachache, vomiting, abdominal distension, borborygmus, edema, anorexia.","mth":"Puncture perpendicularly 0.5-1.2 inches. Moxibustion is applicable.","heN":"גְּ'יֶן לִי","heL":"על קו האמצע הקדמי, 3 צוּן מעל הטבור."},{"c":"CV 12","py":"Zhongwan","zh":"中脘","m":"CV","loc":"On the anterior midline, 4 cun above the umbilicus.)","ind":"stomachache, abdominal distension, borborygmus, nausea, vomiting, acid regurgitation, diarrhea, dysentery, jaundice, indigestion, insomnia.","mth":"Puncture perpendicularly 0.5-1.2 inches. Moxibustion is applicable.","heN":"ג'וֹנְג וָאן","heL":"על קו האמצע הקדמי, 4 צוּן מעל הטבור."},{"c":"CV 13","py":"Shangwan","zh":"上脘","m":"CV","loc":"On the anterior midline, 5 cun above the umbilicus.","ind":"stomachache, abdominal distension, nausea, vomiting, epilepsy, insomnia.","mth":"Puncture perpendicularly 0.5-1.2 inches. Moxibustion is applicable.","heN":"שָׁאנְג וָאן","heL":"על קו האמצע הקדמי, 5 צוּן מעל הטבור."},{"c":"CV 14","py":"Juque","zh":"巨闕(阙)","m":"CV","loc":"On the anterior midline of the abdomen, 6 cun above the umbilicus.","ind":"pain in the cardiac region and the chest, nausea, acid regurgitation, difficulty in swallowing, vomiting, mental disorder, epilepsy, palpitation.","mth":"Puncture perpendicularly 0.3-0.8 inch. Moxibustion is applicable.","heN":"גּ'וּ צְ'וֶוה","heL":"על קו האמצע הקדמי של הבטן, 6 צוּן מעל הטבור."},{"c":"CV 15","py":"Jiuwei","zh":"鳩(鸠)尾","m":"CV","loc":"On the anterior midline, 1 cun below the xiphosternal synchondrosis. Locate the point in supine position with the arms uplifted.","ind":"pain in the cardiac region and the chest, nausea, mental disorder, epilepsy.","mth":"Puncture obliquely downward 0.4-0.6 inch. Moxibustion is applicable.","heN":"גְ'יוּ וֵיי","heL":"על קו האמצע הקדמי, 1 צוּן מתחת למפגש הזיז החרבי עם עצם החזה. מאתרים בשכיבה על הגב כשהזרועות מורמות."},{"c":"CV 16","py":"Zhongting","zh":"中庭","m":"CV","loc":"On the anterior midline, at the level with the 5th intercostal space, on the xiphosternal synchondrosis.","ind":"distension and fullness in the chest and intercostal region, hiccup, nausea, anorexia.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"ג'וֹנְג טִינְג","heL":"על קו האמצע הקדמי, בגובה המרווח הבין־צלעי החמישי, על מפגש הזיז החרבי עם עצם החזה."},{"c":"CV 17","py":"Tanzhong","zh":"膻中","m":"CV","loc":"On the anterior midline, at the level with the 4th intercostal space, midway between the nipples.","ind":"asthma, pain in the chest, fullness in the chest, palpitation, insufficient lactation, hiccup, difficulty in swallowing.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"טָאן ג'וֹנְג","heA":"נמצאת על המרידיאן המרכזי הקדמי. במסורת היא משויכת לאזור החזה, לנשימה ולתחושת לחץ בחזה.","heC":"לחצו בעדינות בלבד על עצם החזה; כאב או לחץ בחזה דורשים בירור רפואי ולא עיסוי עצמי.","heL":"על קו האמצע הקדמי, בגובה המרווח הבין־צלעי הרביעי, באמצע הדרך בין הפטמות."},{"c":"CV 18","py":"Yutang","zh":"玉堂","m":"CV","loc":"On the anterior midline, at the level with the 3rd intercostal space.","ind":"pain in the chest, cough, asthma, vomiting.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"יוּ טָאנְג","heL":"על קו האמצע הקדמי, בגובה המרווח הבין־צלעי השלישי."},{"c":"CV 19","py":"Zigong","zh":"紫宮(宫)","m":"CV","loc":"On the anterior midline, at the level with the 2nd intercostal space.","ind":"pain in the chest, asthma, cough.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"דְזה גּוֹנְג","heL":"על קו האמצע הקדמי, בגובה המרווח הבין־צלעי השני."},{"c":"CV 20","py":"Huagai","zh":"華(华)蓋(盖)","m":"CV","loc":"On the anterior midline, at the midpoint of the sternal angle, at the level with the 1st intercostal space.","ind":"pain and fullness in the chest and intercostal region, asthma, cough.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"חוּאָה גַאי","heL":"על קו האמצע הקדמי, באמצע זווית עצם החזה, בגובה המרווח הבין־צלעי הראשון."},{"c":"CV 21","py":"Xuanji","zh":"璇璣(玑)","m":"CV","loc":"On the anterior midline, in the centre of the sternal manubrium, 1 cun below Tiantu (CV 22).","ind":"pain in the chest, cough, asthma.","mth":"Puncture subcutaneously 0.3-0.5 inch. Moxibustion is applicable.","heN":"שְׂוֶואן גִּ'י","heL":"על קו האמצע הקדמי, במרכז ידית עצם החזה, 1 צוּן מתחת לטְיֵין טוּ (CV 22)."},{"c":"CV 22","py":"Tiantu","zh":"天突","m":"CV","loc":"In the centre of the suprasternal fossa.","ind":"asthma, cough, sore throat, dry throat, hiccup, sudden hoarseness of the voice, difficulty in swallowing, goiter.","mth":"First puncture perpendicularly 0.2 inch and then insert the needle tip downward along the posterior aspect of the sternum 0.5-1.0 inch. Moxibustion is applicable.","heN":"טְיֵין טוּ","heL":"במרכז הבור העל־חזי."},{"c":"CV 23","py":"Lianquan","zh":"廉泉","m":"CV","loc":"Above the Adam's apple, in the depression of the upper border of the hyoid bone.","ind":"swelling and pain of the subglossal region, salivation with glossoplegia, aphasia with stiffness of tongue by apoplexy, sudden hoarseness of the voice, difficulty in swallowing.","mth":"Puncture obliquely 0.5-1.0 inch toward the tongue root. Moxibustion is applicable.","heN":"לְיֶן צְ'וֶון","heL":"מעל פיקת הגרון, בשקע שבשוליים העליונים של עצם הלשון (hyoid)."},{"c":"CV 24","py":"Chengjiang","zh":"承漿(浆)","m":"CV","loc":"In the depression in the centre of the mentolabial groove.","ind":"facial puffiness, swelling of the gums, toothache, salivation, mental disorder, deviation of the eye and mouth.","mth":"Puncture obliquely upward 0.2-0.3 inch. Moxibustion is applicable.","heN":"צֶ'נְג גְ'יָאנְג","heL":"בשקע שבמרכז החריץ הסנטר־שפתי."}],"meridians":[{"ab":"LU","name":"Lung Meridian","zh":"手太陰(阴)肺經(经,経)","desc":"The Lung meridian (LU) consists of 11 acupuncture points which begins at LU 1 (Zhongfu) on the upper anterior chest, lateral to the infraclavicular fossa, travels down the anterior-lateral aspect of the arm, and ends at LU 11 (Shaoshang) on the radial side of the thumb near the corner of the nail.","n":11,"heN":"מרידיאן הריאות","hePath":"מתחיל באזור החזה, עובר לאורך הצד הפנימי של הזרוע ומסתיים באגודל.","heAssoc":"במסורת הסינית הוא משויך לנשימה, לגרון, לאף ולעור."},{"ab":"LI","name":"Large Intestine Meridian","zh":"手陽(阳)明大腸(肠)經(经,経)","desc":"The Large Intestine meridian (LI) consists of 20 acupuncture points which begins at LI 1 (Shangyang) on the radial side of the index finger near the corner of the nail, travels up the dorsal-radial aspect of the arm, crosses over the shoulder and the side of the neck to the face, and ends at LI 20 (Yingxiang) in the nasolabial sulcus beside the ala of the nose.","n":20,"heN":"מרידיאן המעי הגס","hePath":"מתחיל באצבע המורה, עולה בצד החיצוני של היד והכתף ומגיע אל הפנים, לצד האף.","heAssoc":"משויך במסורת לפנים, לאף, לגרון, לשיניים ולפעילות המעי."},{"ab":"ST","name":"Stomach Meridian","zh":"足陽(阳)明胃經(经,経)","desc":"The Stomach meridian (ST) consists of 45 acupuncture points which begins at ST 1 (Chengqi) on the face, between the eyeball and the infraorbital margin directly below the pupil, travels down across the face, neck, chest, and abdomen, continues down the anterior-lateral aspect of the leg, and ends at ST 45 (Lidui) on the lateral side of the second toe near the corner of the nail.","n":45,"heN":"מרידיאן הקיבה","hePath":"מתחיל מתחת לעין, יורד דרך הפנים, החזה והבטן וממשיך בקדמת הרגל עד האצבע השנייה.","heAssoc":"משויך במסורת לקיבה, לעיכול, לבטן, לפנים ולחיוניות."},{"ab":"SP","name":"Spleen Meridian","zh":"足太陰(阴)脾經(经,経)","desc":"The Spleen meridian (SP) consists of 21 acupuncture points which begins at SP 1 (Yinbai) on the medial side of the great toe near the corner of the nail, travels up along the medial aspect of the leg, continues up the abdomen and chest, and ends at SP 21 (Dabao) on the lateral thorax in the sixth intercostal space on the midaxillary line.","n":21,"heN":"מרידיאן הטחול","hePath":"מתחיל בבוהן הגדולה, עולה בצד הפנימי של הרגל, עובר בבטן ומגיע לצדי החזה.","heAssoc":"משויך במסורת לעיכול, לנוזלי הגוף, לבטן ולמערכת הרבייה."},{"ab":"HT","name":"Heart Meridian","zh":"手少陰(阴)心經(经,経)","desc":"The Heart meridian (HT) consists of 9 acupuncture points which begins at HT 1 (Jiquan) in the center of the axillary fossa, travels down the medial aspect of the arm, and ends at HT 9 (Shaochong) on the radial side of the little finger near the corner of the nail.","n":9,"heN":"מרידיאן הלב","hePath":"מתחיל באזור בית השחי, עובר בצד הפנימי של הזרוע ומסתיים בזרת.","heAssoc":"משויך במסורת ללב, לדופק, לשינה ולמצב הרגשי."},{"ab":"SI","name":"Small Intestine Meridian","zh":"手太陽(阳)小腸(肠)經(经,経)","desc":"The Small Intestine meridian (SI) consists of 19 acupuncture points which begins at SI 1 (Shaoze) on the ulnar side of the little finger near the corner of the nail, travels up the dorsal-ulnar aspect of the arm, crosses the scapular region, and ascends along the lateral neck and cheek, ending at SI 19 (Tinggong) in the depression between the tragus and the mandibular condyloid process.","n":19,"heN":"מרידיאן המעי הדק","hePath":"מתחיל בזרת, עולה לאורך הצד החיצוני של היד אל השכמה, הצוואר והפנים.","heAssoc":"משויך במסורת לכתף, לצוואר, לאוזן, ללסת ולמעי הדק."},{"ab":"BL","name":"Bladder Meridian","zh":"足太陽(阳)膀胱經(经,経)","desc":"The Bladder meridian (BL) consists of 67 acupuncture points which begins at BL 1 (Jingming) on the face in the depression just superior to the inner canthus of the eye, travels up over the head, descends down the back in two parallel lines flanking the spine, continues along the posterior aspect of the leg, and ends at BL 67 (Zhiyin) on the lateral side of the little toe near the corner of the nail.","n":67,"heN":"מרידיאן שלפוחית השתן","hePath":"מתחיל בזווית הפנימית של העין, עובר מעל הראש ולאורך שני צדי הגב, יורד בחלק האחורי של הרגל ומסתיים בזרת כף הרגל.","heAssoc":"משויך במסורת לגב ולעמוד השדרה, לראש, לעיניים ולמערכת השתן."},{"ab":"KI","name":"Kidney Meridian","zh":"足少陰(阴)腎(肾)經(经,経)","desc":"The Kidney meridian (KI) consists of 27 acupuncture points which begins at KI 1 (Yongquan) on the sole of the foot in the depression formed when the toes are flexed, travels up along the medial aspect of the leg, continues up the abdomen and chest close to the midline, and ends at KI 27 (Shufu) on the anterior chest in the depression at the inferior border of the clavicle.","n":27,"heN":"מרידיאן הכליות","hePath":"מתחיל בסוליית כף הרגל, עולה בצד הפנימי של הרגל וממשיך דרך הבטן אל החזה.","heAssoc":"משויך במסורת לכליות, לגב התחתון, לאוזניים, לעצמות ולחיוניות."},{"ab":"PC","name":"Pericardium Meridian","zh":"手厥陰(阴)心包(包)經(经,経)","desc":"The Pericardium meridian (PC) consists of 9 acupuncture points which begins at PC 1 (Tianchi) on the anterior chest in the fourth intercostal space, lateral to the nipple, travels down the middle of the anterior aspect of the arm, and ends at PC 9 (Zhongchong) at the center of the tip of the middle finger.","n":9,"heN":"מרידיאן מעטפת הלב","hePath":"מתחיל בחזה, עובר במרכז הצד הפנימי של הזרוע ומסתיים באצבע האמצעית.","heAssoc":"משויך במסורת לאזור החזה, לבחילה, לרגיעה ולמחזור הדם."},{"ab":"TE","name":"Triple Energizer Meridian","zh":"手少陽(阳)三焦經(经,経)","desc":"The Triple Energizer meridian (TE) consists of 23 acupuncture points which begins at TE 1 (Guanchong) on the ulnar side of the ring finger near the corner of the nail, travels up the dorsal-middle aspect of the arm, ascends over the shoulder and the side of the neck, and circles around the ear, ending at TE 23 (Sizhukong) in the depression at the lateral end of the eyebrow.","n":23,"heN":"מרידיאן המחמם המשולש","hePath":"מתחיל בקמיצה, עולה בצד החיצוני של הזרוע דרך הכתף והצוואר ומסתיים ליד הגבה.","heAssoc":"משויך במסורת לוויסות נוזלים וחום, לאוזניים, לכתפיים ולצדי הראש."},{"ab":"GB","name":"Gallbladder Meridian","zh":"足少陽(阳)膽(胆)經(经,経)","desc":"The Gallbladder meridian (GB) consists of 44 acupuncture points which begins at GB 1 (Tongziliao) on the head in the depression lateral to the outer canthus of the eye, zigzags across the temporal and occipital regions of the head, descends along the lateral side of the neck, trunk, and leg, and ends at GB 44 (Zuqiaoyin) on the lateral side of the fourth toe near the corner of the nail.","n":44,"heN":"מרידיאן כיס המרה","hePath":"מתחיל ליד העין, עובר בצדי הראש והגוף, יורד בצד החיצוני של הרגל ומסתיים באצבע הרביעית בכף הרגל.","heAssoc":"משויך במסורת לצדי הראש, לעיניים, לכתפיים, לירכיים ולכיס המרה."},{"ab":"LR","name":"Liver Meridian","zh":"足厥陰(阴)肝經(经,経)","desc":"The Liver meridian (LR) consists of 14 acupuncture points which begins at LR 1 (Dadun) on the lateral side of the great toe near the corner of the nail, travels up along the medial aspect of the leg, passes through the genital region and abdomen, and ends at LR 14 (Qimen) on the anterior chest in the sixth intercostal space.","n":14,"heN":"מרידיאן הכבד","hePath":"מתחיל בבוהן הגדולה, עולה בצד הפנימי של הרגל, עובר בבטן התחתונה ומגיע לבית החזה.","heAssoc":"משויך במסורת לכבד, לעיניים, לגידים, למתח ולזרימה חופשית בגוף."},{"ab":"GV","name":"Governor Vessel","zh":"督脈(脉)","desc":"The Governor Vessel (GV / Du Mai) consists of 28 acupuncture points which begins at GV 1 (Changqiang) in the perineal region midway between the tip of the coccyx and the anus, travels up along the posterior midline of the body over the spine and across the top of the head, and ends at GV 28 (Yinjiao) in the oral cavity at the frenulum of the upper lip.","n":28,"heN":"הערוץ השולט — דוּ מַאי","hePath":"עובר בקו האמצע האחורי: מאזור האגן, לאורך עמוד השדרה ומעל הראש עד הפנים.","heAssoc":"משויך במסורת לעמוד השדרה, למוח, לראש ולתפקוד היאנג בגוף."},{"ab":"CV","name":"Conception Vessel","zh":"任脈(脉)","desc":"The Conception Vessel (CV / Ren Mai) consists of 24 acupuncture points which begins at CV 1 (Huiyin) in the perineum at the midpoint of the perineal region, travels up along the anterior midline of the body through the abdomen, chest, and neck, and ends at CV 24 (Chengjiang) on the face in the depression at the center of the mentolabial sulcus.","n":24,"heN":"ערוץ ההתעברות — רֶן מַאי","hePath":"עובר בקו האמצע הקדמי: מאזור האגן, דרך הבטן והחזה ועד const RTL=['he','ar'];
let LANG=store.get('lang','he');
function t(k,...a){const base=I18N[LANG]||{}, en=I18N.en; let v=base[k]; if(v===undefined) v=en[k]; return typeof v==='function'?v(...a):v;}

/* ---------- state ---------- */
const D=window.ATLAS;
const MER_HE={}, MER={}; D.meridians.forEach(m=>{MER[m.ab]=m;MER_HE[m.ab]=m.heN||m.name;});
let favs=store.get('favs',[]);
let screen='home', query='';
const subjFile={asher:'asher_c',grace:'grace_e',minami:'minami_a',novak:'novak_e'};
const footViews=[['soles','reflexology-soles.jpg'],['top','reflexology-top.jpg'],['inner','reflexology-side-inner.jpg'],['outer','reflexology-side-outer.jpg'],['sidestop','reflexology-sides-top.jpg'],['full','foot-reflexology-chart.jpg']];
let reflexView='full', bodySubject='asher', merFilter='', zoom=100, curMer=null;

/* ---------- helpers ---------- */
function heName(p){return p.heN||p.py||p.c;}
function favKey(kind,id){return kind+':'+id;}
function isFav(k){return favs.includes(k);}
function toggleFav(k){favs=isFav(k)?favs.filter(x=>x!==k):[...favs,k];store.set('favs',favs);renderNav();if(screen==='favs')route('favs');refreshSheetFav(k);}
const ICON={
 home:'<path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/>',

function svg(name,cls=''){return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${ICON[name]}</svg>`;}

/* ---------- navigation ---------- */
const NAVS=['home','reflex','points','meridians','learn','favs'];
function renderNav(){
  $('#nav').innerHTML=NAVS.map(s=>`<button class="tab ${screen===s?'active':''}" data-go="${s}">${svg(s)}${t(s==='reflex'?'reflex':s==='points'?'points':s==='meridians'?'meridians':s)} ${s==='favs'?`<span class="count">${favs.length}</span>`:''}</button>`).join('');
}
function route(s){screen=s;query=$('#q').value='';renderNav();window.scrollTo(0,0);
  ({home:homeScreen,reflex:reflexScreen,points:pointsScreen,meridians:meridiansScreen,learn:learnScreen,favs:favsScreen,settings:settingsScreen,about:aboutScreen}[s]||homeScreen)();}

/* ---------- HOME ---------- */
function homeScreen(){
  const tiles=[['reflex','reflex',D.zones.length+' '+t('reflex')],['points','points',D.points.length],['meridians','meridians',D.meridians.length],['learn','learn','']];
  $('#view').innerHTML=`<div class="screen">
   <div class="hero"><div><div class="eyebrow">${t('heroEye')}</div><h1>${t('heroH')}</h1><p>${t('heroP')}</p></div>
     <button class="favpill" data-go="favs">${svg('favs')} ${favs.length} ${t('favs')}</button></div>
   <div class="tiles">
     ${tiles.map(([go,ic,cnt])=>`<button class="tile" data-go="${go}"><span class="ic">${svg(ic)}</span>
        <div><b>${t(go)}</b><small>${t('t_'+go)}</small></div><span class="cnt">${cnt||''}</span></button>`).join('')}
   </div>
   <div class="card warn" style="margin-top:22px">${t('safety')}</div>
  </div>`;

/* ---------- LEARN ---------- */
let learnMode='flashcards', quizIdx=0, quizScore=0, quizSet=[];
function buildQuiz(){
  const pool=D.points.filter(p=>p.m); quizSet=[];
  const shuffled=[...pool].sort(()=>Math.random()-.5).slice(0,8);
  shuffled.forEach(p=>{
    const correct=MER[p.m]; const others=D.meridians.filter(m=>m.ab!==p.m).sort(()=>Math.random()-.5).slice(0,3);
    const opts=[correct,...others].sort(()=>Math.random()-.5);
    quizSet.push({q:`${p.c} — ${p.py}`,sub:LANG==='en'?'Which meridian?':'לאיזה מרידיאן שייכת?',opts:opts.map(o=>({txt:(o.heN||o.name)+' ('+o.ab+')',ok:o.ab===p.m}))});
  });
  quizIdx=0;quizScore=0;
}
function learnScreen(){
  $('#view').innerHTML=`<div class="screen learn-wrap">
    <div class="seg-toggle" style="margin-bottom:16px"><button class="${learnMode==='flashcards'?'active':''}" data-lm="flashcards">${t('flashcards')}</button><button class="${learnMode==='quiz'?'active':''}" data-lm="quiz">${t('quiz')}</button></div>
    <div id="learnBody"></div></div>`;
  learnMode==='flashcards'?flashcard():(buildQuiz(),quizStep());
}
let flashCard=null, flashFlipped=false;
function flashcard(){
  if(!flashCard) flashCard=D.points[Math.floor(Math.random()*D.points.length)];
  const p=flashCard;
  $('#learnBody').innerHTML=`<div class="card flash">
    <span class="code">${p.c}</span>
    ${flashFlipped?`<div class="q">${heName(p)}</div><div class="a">${MER_HE[p.m]||p.m} · ${p.py}<br>${(LANG==='en'?p.loc:(p.heL||p.loc))||''}</div>`:`<div class="q">${LANG==='en'?'Which point is this?':'איזו נקודה זו?'}</div>`}
    <div class="opts" style="grid-template-columns:1fr 1fr"><button class="opt" style="text-align:center" data-flip>${t('flip')}</button><button class="opt" style="text-align:center" data-fnext>${t('next')}</button></div></div>`;
}
function quizStep(){
  if(quizIdx>=quizSet.length){
    $('#learnBody').innerHTML=`<div class="card flash"><div class="q">${t('quizScore',quizScore+'/'+quizSet.length)}</div><button class="btn" data-qagain>${t('again')}</button></div>`;return;}
  const it=quizSet[quizIdx];
  $('#learnBody').innerHTML=`<div class="progress"><i style="width:${quizIdx/quizSet.length*100}%"></i></div>
   <div class="card flash"><span class="code">${it.q.split(' — ')[0]}</span><div class="q">${it.q.split(' — ')[1]}</div><div class="a">${it.sub}</div>
   <div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-opt="${i}">${o.txt}</button>`).join('')}</div></div>`;
}

    const p=D.points.find(x=>x.c===id); if(!p)return;
    html=sheetHtml(p.c,t('points'),heName(p),(p.zh?p.zh+' · ':'')+p.py+' · '+(MER_HE[p.m]||p.m),[
      [t('loc'),(LANG==='en'?p.loc:(p.heL||p.loc))],
      [t('assoc'),p.heA||''],
      [t('ind'),p.ind?(LANG==='en'?p.ind:('שימושים מסורתיים במקור: '+p.ind)):''],
      [t('method'),p.mth||''],
      [t('caution'),p.heC||'']
    ],favk);
  } else if(kind==='zone'){
    const z=D.zones.find(x=>x.c===id); if(!z)return;
    html=sheetHtml('R'+z.c.replace(/^R/,''),t('reflex'),z.he,z.en,[

<script>
/* ═══ AppNest Assistant — מנוע קבוע (inline) ═══ */
/* ═══════════════════════════════════════════════════════════════════════
   AppNest Assistant — המנוע הקבוע (זהה בכל האפליקציות)
   ─────────────────────────────────────────────────────────────────────
   צ'אטבוט היברידי: מדבר בשפה טבעית, עונה על שאלות, ויכול לבצע פעולות
   באפליקציה (לכתוב לשדה, לנווט בין מסכים, להדגיש כפתור).

   איך זה בנוי:
   • המנוע (הקובץ הזה) — לא משתנה בין אפליקציות. מעתיקים אותו כמו שהוא.
   • ה"מפה" — window.APPNEST_ASSISTANT_CONFIG, מוגדרת בכל אפליקציה בנפרד,
     ומתארת למנוע את המסכים/השדות/הכפתורים והרקע של אותה אפליקציה.

   ה-AI: משתמש ב-BYOK הקיים (המפתח שהמשתמש כבר חיבר). נקרא בשפת-האם של כל
   ספק (Claude / Gemini / OpenAI / מקומי / מותאם) — בלי שכבות תרגום.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var CFG = window.APPNEST_ASSISTANT_CONFIG;
  if (!CFG) { console.warn('[AppNest Assistant] אין הגדרות (APPNEST_ASSISTANT_CONFIG) — המנוע לא הופעל.'); return; }

  /* ─────────────── 1. קריאת ה-AI לפי הספק שהמשתמש חיבר ─────────────── */
  // קורא את הגדרות ה-BYOK של האפליקציה. שם המפתח ב-localStorage ניתן להתאמה
  // דרך המפה (CFG.aiConfigKey); ברירת מחדל מתאימה ל-SunoPrep/AppNest.
  function readAiConfig() {
    // אם האפליקציה מגדירה קריאת config משלה (כי היא שומרת מפתחות אחרת) — נשתמש בה.
    if (typeof CFG.readAiConfig === 'function') { try { return CFG.readAiConfig(); } catch (e) { return null; } }
    var storeKey = CFG.aiConfigKey || 'sp_ai-config';
    try {
      var raw = localStorage.getItem(storeKey);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function clean(s) { return (s || '').replace(/[\r\n\t]/g, '').trim(); }
  // מפצל שדה מפתחות (שיכול להכיל כמה מפתחות מופרדים בפסיק/שורה) ומחזיר את הראשון הנקי,
  // בדיוק כמו שהאפליקציה עצמה עושה. מונע מצב של פסיקים/רווחים נסתרים שמשבשים את המפתח.
  function firstKey(s) {
    var arr = (s || '').split(/[\n,;]+/).map(function (x) { return x.trim(); }).filter(Boolean);
    return arr[0] || '';
  }

  // מריץ prompt מול הספק המחובר, מחזיר טקסט. זורק אם אין מפתח/ספק.
  async function callAI(prompt) {
    var cfg = readAiConfig();
    if (!cfg || !cfg.provider) throw new Error('NO_AI');
    var p = cfg.provider, k = cfg.keys || {};

    if (p === 'gemini') {
      // מתחיל תמיד מהמודל העדכני (alias שמצביע על הכי חדש), עם גיבויים עדכניים.
      // לא נשען על מודל שמור — כדי לא להיתקע על גרסה שכבר לא קיימת.
      var models = ['gemini-flash-latest', 'gemini-3.5-flash', 'gemini-2.0-flash'];
      var key = firstKey(k.gemini), lastErr = null;
      for (var i = 0; i < models.length; i++) {
        var genCfg = { temperature: 0.5, maxOutputTokens: 4000 };
        if (models[i].indexOf('gemini-2.5') === 0 || models[i].indexOf('gemini-3') === 0) genCfg.thinkingConfig = { thinkingBudget: 0 };
        try {
          var r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + models[i] + ':generateContent?key=' + encodeURIComponent(key), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: genCfg })
          });
          if (r.ok) {
            var d = await r.json();
            return (d && d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts[0] && d.candidates[0].content.parts[0].text) || '';
          }
          var ej = await r.json().catch(function () { return {}; });
          lastErr = new Error((ej && ej.error && ej.error.message) || ('HTTP ' + r.status));
          if ([404, 429, 500, 503].indexOf(r.status) === -1) throw lastErr;
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('Gemini unavailable');
    }

    if (p === 'claude') {
      var res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': firstKey(k.claude),
          'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 4000, messages: [{ role: 'user', content: prompt }] })
      });
      if (!res.ok) { var ec = await res.json().catch(function () { return {}; }); throw new Error((ec.error && ec.error.message) || ('HTTP ' + res.status)); }
      var dc = await res.json();
      return (dc.content && dc.content[0] && dc.content[0].text) || '';
    }

    // openai / device / custom — כולם פורמט OpenAI
    var url, okey, model;
    if (p === 'openai') { url = 'https://api.openai.com/v1/chat/completions'; okey = firstKey(k.openai); model = 'gpt-4o-mini'; }
    else if (p === 'device') { url = (k.deviceUrl || '').replace(/\/+$/, '') + '/chat/completions'; okey = ''; model = 'llama3'; }
    else if (p === 'custom') { url = k.customUrl || ''; okey = firstKey(k.customKey); model = 'gpt-4o-mini'; }
    else throw new Error('UNKNOWN_PROVIDER');
    var h = { 'Content-Type': 'application/json' };
    if (okey) h['Authorization'] = 'Bearer ' + okey;
    var ro = await fetch(url, { method: 'POST', headers: h,
      body: JSON.stringify({ model: model, max_tokens: 4000, messages: [{ role: 'user', content: prompt }] }) });
    if (!ro.ok) { var eo = await ro.json().catch(function () { return {}; }); throw new Error((eo.error && eo.error.message) || ('HTTP ' + ro.status)); }
    var do_ = await ro.json();
    return (do_.choices && do_.choices[0] && do_.choices[0].message && do_.choices[0].message.content) || '';
  }

  /* ─────────────── 2. פעולות על האפליקציה (מבוססות המפה) ─────────────── */
  // מציאת אלמנט לפי טקסט גלוי (יציב יותר מ-selectors באפליקציית React)
  function findByText(tag, text) {
    var els = document.querySelectorAll(tag);
    text = text.trim();
    for (var i = 0; i < els.length; i++) {
      var t = (els[i].textContent || '').trim();
      if (t === text || t.indexOf(text) !== -1) return els[i];
    }
    return null;
  }
  function findField(spec) {
    if (spec.placeholder) {
      var els = document.querySelectorAll('textarea, input');
      for (var i = 0; i < els.length; i++) {
        var ph = els[i].getAttribute('placeholder') || '';
        if (ph.indexOf(spec.placeholder) !== -1) return els[i];
      }
    }
    if (spec.selector) return document.querySelector(spec.selector);
    return null;
  }
  // כתיבה לשדה בצורה ש-React "רואה" (native setter + אירוע input)
  function setReactValue(el, value) {
    var proto = el.tagName === 'TEXTAREA' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
    var setter = Object.getOwnPropertyDescriptor(proto, 'value').set;
    setter.call(el, value);
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function flash(el) {
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    var old = el.style.boxShadow, oldT = el.style.transition;
    el.style.transition = 'box-shadow .3s';
    el.style.boxShadow = '0 0 0 3px #C9A84C, 0 0 18px #C9A84C';
    setTimeout(function () { el.style.boxShadow = old; el.style.transition = oldT; }, 2200);
  }

  // מבצע פעולה שה-AI ביקש. מחזיר טקסט-משוב קצר (או null אם נכשל).
  function runAction(act) {
    try {
      if (act.action === 'navigate') {
        var tab = (CFG.tabs || []).filter(function (t) { return t.name === act.target; })[0];
        // אם האפליקציה מגדירה פונקציית ניווט משלה (למשל showScreen) — נשתמש בה.
        if (typeof CFG.navigate === 'function') {
          if (!tab) return null;
          CFG.navigate(tab.screen || tab.match || act.target);
          return 'עברתי למסך "' + act.target + '".';
        }
        // ברירת מחדל: מציאת כפתור לפי טקסט ולחיצה
        var btn = findByText('button', (tab && tab.match) || act.target);
        if (btn) { btn.click(); return 'עברתי למסך "' + act.target + '".'; }
        return null;
      }
      if (act.action === 'writeField') {
        var fld = (CFG.fields || []).filter(function (f) { return f.name === act.target; })[0];
        var el = fld && findField(fld);
        if (el) { setReactValue(el, act.text || ''); flash(el); return 'כתבתי ל' + (fld.label || 'שדה') + '.'; }
        return null;
      }
      if (act.action === 'highlight') {
        var target = act.target;
        var el2 = findByText('button', target) || (CFG.fields || []).filter(function (f) { return f.name === target; }).map(function (f) { return findField(f); })[0];
        if (el2) { flash(el2); return 'הנה זה — סימנתי לך בזהב.'; }
        return null;
      }
      if (act.action === 'appAction') {
        // פעולה ייחודית לאפליקציה — מוגדרת במפה (CFG.actions), מפעילה פונקציה של האפליקציה.
        var custom = (CFG.actions || {})[act.target];
        if (custom && typeof custom.run === 'function') {
          try { custom.run(); return custom.done || 'בוצע ✓'; } catch (e) { return null; }
        }
        return null;
      }
    } catch (e) { return null; }
    return null;
  }

  /* ─────────────── 3. הנחיית ה-AI (system prompt מהמפה) ─────────────── */
  function buildPrompt(history, userMsg) {
    var tabNames = (CFG.tabs || []).map(function (t) { return '"' + t.name + '"'; }).join(', ');
    var fieldList = (CFG.fields || []).map(function (f) { return '"' + f.name + '" (' + (f.label || '') + ')'; }).join(', ');
    var convo = history.slice(-12).map(function (m) { return (m.role === 'user' ? 'משתמש' : 'עוזר') + ': ' + m.text; }).join('\n');

    // "עיניים" — קורא את התוכן הנוכחי של השדות, כדי שהעוזר יוכל להתייחס אליו
    // (לשפר, לתרגם, לענות על "מה כתבתי") בלי לבקש מהמשתמש להדביק.
    var fieldState = (CFG.fields || []).map(function (f) {
      var el = findField(f);
      var val = el ? (el.value || '') : '';
      if (val.length > 1500) val = val.slice(0, 1500) + '…';
      return '• ' + (f.label || f.name) + ': ' + (val ? '"' + val + '"' : '(ריק)');
    }).join('\n');

    // מצב כללי של האפליקציה (אם האפליקציה מספקת תיאור מצב משלה)
    var appState = '';
    if (typeof CFG.readState === 'function') { try { appState = CFG.readState() || ''; } catch (e) {} }

    // פעולות ייחודיות לאפליקציה (מעבר לניווט/כתיבה/הדגשה)
    var customActions = CFG.actions || {};
    var actionList = Object.keys(customActions).map(function (k) { return '"' + k + '" — ' + (customActions[k].desc || ''); }).join('\n');

    return [
      'אתה עוזר חכם בתוך האפליקציה "' + CFG.appName + '".',
      CFG.appDescription || '',
      '',
      'אתה יכול גם לבצע פעולות באפליקציה. כשמתאים, החזר בלוק פעולה בשורה נפרדת בסוף התשובה,',
      'בפורמט הזה בדיוק (JSON בין הסימנים):',
      '<<ACTION>>{"action":"navigate","target":"שם המסך"}<<END>>',
      '<<ACTION>>{"action":"writeField","target":"שם השדה","text":"התוכן המלא"}<<END>>',
      '<<ACTION>>{"action":"highlight","target":"טקסט הכפתור או שם השדה"}<<END>>',
      (actionList ? '<<ACTION>>{"action":"appAction","target":"שם הפעולה"}<<END>>' : ''),
      'אם המשתמש ביקש כמה דברים ברצף (למשל "כתוב שיר ואז עבור לקולות") — החזר כמה בלוקי פעולה, כל אחד בשורה נפרדת, בסדר שבו הם צריכים להתבצע (בדרך כלל: קודם לכתוב לשדה, ורק אחר כך לנווט למסך אחר).',
      '',
      'מסכים זמינים לניווט: ' + (tabNames || '(אין)'),
      'שדות זמינים לכתיבה: ' + (fieldList || '(אין)'),
      (actionList ? 'פעולות ייחודיות זמינות (appAction):\n' + actionList : ''),
      '',
      'התוכן שנמצא כרגע בשדות האפליקציה (כדי שתוכל להתייחס אליו — לשפר, לתרגם, לענות עליו):',
      (fieldState || '(אין שדות)'),
      (appState ? '\nמצב האפליקציה כרגע:\n' + appState : ''),
      '',
      'כללים: דבר בעברית, טבעי וידידותי. תמיד כתוב קודם תשובה קצרה למשתמש, ורק אחריה (אם צריך) את בלוק הפעולה.',
      'אם המשתמש מבקש ליצור או לשנות תוכן (שיר, טקסט) — כתוב את התוצאה המלאה בתוך writeField, לא בגוף הצ\'אט.',
      'אם המשתמש מבקש לשפר/לשנות/לתרגם משהו "שכתבתי" — התבסס על התוכן הנוכחי של השדות למעלה.',
      'לניווט (navigate): השתמש אך ורק בשם מסך שמופיע בדיוק ברשימת המסכים למעלה. אם המשתמש מבקש מסך שלא ברשימה — אל תנחש ואל תנווט למסך אחר; במקום זה אמור לו בקצרה שאין מסך כזה, או שאל למה התכוון.',
      'אם זו רק שאלה/שיחה — אל תחזיר בלוק פעולה בכלל.',
      '',
      (convo ? 'שיחה עד כה:\n' + convo + '\n' : ''),
      'משתמש: ' + userMsg,
      'עוזר:'
    ].join('\n');
  }

  function parseReply(raw) {
    var actions = [], text = raw;
    var re = /<<ACTION>>([\s\S]*?)<<END>>/g, m;
    while ((m = re.exec(raw)) !== null) {
      try { actions.push(JSON.parse(m[1].trim())); } catch (e) {}
    }
    text = raw.replace(/<<ACTION>>[\s\S]*?<<END>>/g, '').trim();
    return { text: text, actions: actions };
  }

  /* ─────────────── 4. ממשק המשתמש (חלון צ'אט + כפתור) ─────────────── */
  // זיכרון מתמשך — השיחה נשמרת מקומית (localStorage) ונטענת בביקור הבא.
  // מפתח ייחודי לכל אפליקציה, כדי שאפליקציות שונות לא יחלקו זיכרון.
  var HKEY = 'appnest_asst_hist_' + (CFG.appName || 'app');
  function loadHistory() { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; } }
  function saveHistory() { try { localStorage.setItem(HKEY, JSON.stringify(history.slice(-30))); } catch (e) {} }
  var history = loadHistory(), panelEl = null, bodyEl = null, panelInput = null, panelSend = null, busy = false, open = false;

  function el(tag, css, txt) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (txt != null) e.textContent = txt; return e; }

  // הקראת טקסט בעברית (Text-to-Speech מובנה בדפדפן)
  var activePlayBtn = null;
  function stopSpeak() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (activePlayBtn) { activePlayBtn.textContent = '🔊'; activePlayBtn = null; }
  }
  function speak(text, btn) {
    if (!window.speechSynthesis) return;
    stopSpeak();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'he-IL'; u.rate = 1;
    u.onend = function () { if (btn) btn.textContent = '🔊'; if (activePlayBtn === btn) activePlayBtn = null; };
    if (btn) { btn.textContent = '⏹'; activePlayBtn = btn; }
    window.speechSynthesis.speak(u);
  }

  function addBubble(role, text) {
    var wrap = el('div', 'display:flex;align-items:flex-end;gap:5px;margin:8px 0;' + (role === 'user' ? 'justify-content:flex-start;' : 'justify-content:flex-end;'));
    var b = el('div',
      'max-width:82%;padding:9px 13px;border-radius:14px;font:14px/1.5 "Segoe UI",sans-serif;white-space:pre-wrap;word-break:break-word;direction:rtl;' +
      (role === 'user'
        ? 'background:#2a2a33;color:#eee;border-top-right-radius:4px;'
        : 'background:#C9A84C;color:#0B0B0F;border-top-left-radius:4px;'), text);
    if (role === 'bot' && window.speechSynthesis) {
      var play = el('button', 'background:none;border:none;cursor:pointer;font-size:15px;opacity:.6;padding:2px;flex-shrink:0;', '🔊');
      play.title = 'הקרא / עצור';
      play.onclick = function () {
        // אם הכפתור הזה כרגע מקריא — עצור. אחרת — התחל להקריא (ועצור כל הקראה אחרת).
        if (activePlayBtn === play) stopSpeak();
        else speak(b.textContent, play);
      };
      wrap.appendChild(play);
    }
    if (role === 'bot') {
      var copy = el('button', 'background:none;border:none;cursor:pointer;font-size:14px;opacity:.6;padding:2px;flex-shrink:0;', '📋');
      copy.title = 'העתק';
      copy.onclick = function () {
        var txt = b.textContent;
        var done = function () { copy.textContent = '✓'; setTimeout(function () { copy.textContent = '📋'; }, 1400); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () {});
        else { try { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); } catch (e) {} }
      };
      wrap.appendChild(copy);
    }
    wrap.appendChild(b); bodyEl.appendChild(wrap); bodyEl.scrollTop = bodyEl.scrollHeight;
    return b;
  }

  function setBusy(v) {
    busy = v;
    if (panelSend) { panelSend.disabled = v; panelSend.style.opacity = v ? '.5' : '1'; panelSend.textContent = v ? '…' : 'שלח'; }
    if (panelInput) { panelInput.disabled = v; }
  }

  async function send(input) {
    if (busy) return;                          // מונע שליחה כפולה בזמן שהעוזר עונה
    var msg = input.value.trim(); if (!msg) return;
    input.value = ''; addBubble('user', msg);
    var thinking = addBubble('bot', '…חושב');
    setBusy(true);
    try {
      var prompt = buildPrompt(history, msg);
      var raw = await callAI(prompt);
      var parsed = parseReply(raw);
      thinking.textContent = parsed.text || '✓';
      history.push({ role: 'user', text: msg });
      history.push({ role: 'bot', text: parsed.text });
      if (history.length > 30) history = history.slice(-30);
      saveHistory();
      // מבצע את הפעולות לפי הסדר, עם השהיה קטנה בין פעולות כדי לתת למסך להתעדכן
      for (var ai = 0; ai < parsed.actions.length; ai++) {
        var fb = runAction(parsed.actions[ai]);
        if (fb) addBubble('bot', fb);
        else addBubble('bot', 'ניסיתי לבצע פעולה אבל לא מצאתי את היעד באפליקציה.');
        if (ai < parsed.actions.length - 1) await new Promise(function (r) { setTimeout(r, 450); });
      }
    } catch (e) {
      if (e.message === 'NO_AI') thinking.textContent = 'כדי לדבר איתי, חבר קודם מפתח AI בהגדרות הבינה של האפליקציה 🔌';
      else thinking.textContent = 'אופס, משהו השתבש: ' + e.message;
    } finally {
      setBusy(false);
      if (panelInput) panelInput.focus();
    }
  }

  function addSuggestions(inp) {
    var sugg = CFG.suggestions || [];
    if (!sugg.length) return;
    var row = el('div', 'display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin:4px 0 8px;');
    sugg.forEach(function (s) {
      var chip = el('button', 'background:#1e1e26;color:#C9A84C;border:1px solid #C9A84C55;border-radius:14px;padding:6px 11px;font:13px "Segoe UI",sans-serif;cursor:pointer;direction:rtl;', s);
      chip.onclick = function () { inp.value = s; row.remove(); send(inp); };
      row.appendChild(chip);
    });
    bodyEl.appendChild(row); bodyEl.scrollTop = bodyEl.scrollHeight;
  }

  function buildPanel() {
    panelEl = el('div', 'position:fixed;bottom:78px;left:16px;width:340px;max-width:calc(100vw - 32px);height:460px;max-height:calc(100vh - 120px);' +
      'background:#141418;border:1px solid #2e2e38;border-radius:16px;z-index:100000;display:none;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.55);');
    var head = el('div', 'padding:12px 14px;background:linear-gradient(90deg,#1a1a20,#141418);border-bottom:1px solid #2e2e38;display:flex;align-items:center;gap:8px;');
    head.appendChild(el('span', 'font-size:17px;', '🪄'));
    head.appendChild(el('span', 'color:#C9A84C;font:600 15px "Segoe UI",sans-serif;', 'עוזר ' + CFG.appName));
    var clr = el('span', 'margin-right:auto;cursor:pointer;color:#888;font-size:15px;line-height:1;', '🗑️');
    clr.title = 'נקה שיחה';
    clr.onclick = clearChat;
    head.appendChild(clr);
    var x = el('span', 'cursor:pointer;color:#888;font-size:20px;line-height:1;', '×');
    x.onclick = toggle; head.appendChild(x);
    bodyEl = el('div', 'flex:1;overflow-y:auto;padding:12px;');
    var foot = el('div', 'padding:10px;border-top:1px solid #2e2e38;display:flex;gap:8px;align-items:center;');
    var inp = el('input', 'flex:1;background:#0d0d11;border:1px solid #2e2e38;border-radius:20px;padding:9px 14px;color:#eee;font:14px "Segoe UI",sans-serif;direction:rtl;outline:none;');
    inp.placeholder = 'שאל אותי משהו, או בקש עזרה…';
    inp.onkeydown = function (ev) { if (ev.key === 'Enter') send(inp); };
    // כפתור מיקרופון — דיבור לטקסט (Web Speech API, חינם, מובנה בדפדפן)
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      var rec = new SR();
      rec.lang = 'he-IL'; rec.interimResults = false; rec.maxAlternatives = 1;
      var listening = false, micGranted = false;
      var mic = el('button', 'background:#2a2a33;color:#C9A84C;border:none;border-radius:50%;width:38px;height:38px;font-size:17px;cursor:pointer;flex-shrink:0;', '🎤');
      mic.title = 'דבר במקום להקליד';
      rec.onresult = function (e) { inp.value = e.results[0][0].transcript; inp.focus(); };
      rec.onend = function () { listening = false; mic.style.background = '#2a2a33'; };
      rec.onerror = function (ev) {
        listening = false; mic.style.background = '#2a2a33';
        if (ev && (ev.error === 'not-allowed' || ev.error === 'service-not-allowed'))
          addBubble('bot', 'אין לי גישה למיקרופון. אשר את ההרשאה בהגדרות הדפדפן (ליד כתובת האתר) ונסה שוב 🎤');
        else if (ev && ev.error === 'no-speech')
          addBubble('bot', 'לא שמעתי כלום — נסה לדבר קצת יותר חזק 🙂');
        else if (ev && ev.error === 'not-supported')
          addBubble('bot', 'זיהוי הדיבור לא נתמך בדפדפן הזה — אפשר פשוט להקליד 🙂');
      };
      mic.onclick = async function () {
        if (listening) { rec.stop(); return; }
        // בקשת הרשאה מפורשת — עוזרת בנייד. אם היא נכשלת, עדיין מנסים rec.start()
        // (חלק מהדפדפנים מבקשים הרשאה דרך rec.start עצמו), וההודעה תגיע מ-onerror.
        if (!micGranted && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          try {
            var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(function (t) { t.stop(); });
            micGranted = true;
          } catch (e) { /* לא עוצרים — נותנים ל-rec.start לנסות, ו-onerror יטפל */ }
        }
        try { rec.start(); listening = true; mic.style.background = '#C9A84C'; }
        catch (e) { listening = false; addBubble('bot', 'לא הצלחתי להפעיל את המיקרופון — אפשר פשוט להקליד 🙂'); }
      };
      foot.appendChild(mic);
    }
    var snd = el('button', 'background:#C9A84C;color:#0B0B0F;border:none;border-radius:20px;padding:0 16px;height:38px;font:600 14px "Segoe UI",sans-serif;cursor:pointer;flex-shrink:0;', 'שלח');
    snd.onclick = function () { send(inp); };
    foot.appendChild(inp); foot.appendChild(snd);
    panelEl.appendChild(head); panelEl.appendChild(bodyEl); panelEl.appendChild(foot);
    document.body.appendChild(panelEl);
    panelInput = inp; panelSend = snd;
    renderConversation();
  }

  // מציג את השיחה בגוף החלון: היסטוריה שמורה אם יש, אחרת הודעת פתיחה + הצעות.
  function renderConversation() {
    bodyEl.innerHTML = '';
    if (history.length) {
      history.forEach(function (m) { addBubble(m.role === 'user' ? 'user' : 'bot', m.text); });
    } else {
      addBubble('bot', 'היי! אני העוזר של ' + CFG.appName + '. אפשר לשאול אותי כל דבר, לבקש שאכתוב תוכן ישר לאפליקציה, או לעזור לך למצוא דברים. במה אעזור?');
      if (panelInput) addSuggestions(panelInput);
    }
  }

  function clearChat() {
    history = []; saveHistory(); stopSpeak();
    renderConversation();
  }

  function toggle() {
    if (!panelEl) buildPanel();
    open = !open;
    panelEl.style.display = open ? 'flex' : 'none';
  }

  function addButton() {
    if (document.getElementById('appnest-assistant-btn')) return;
    var b = el('button', 'position:fixed;bottom:16px;left:16px;z-index:100000;background:#C9A84C;color:#0B0B0F;border:none;' +
      'border-radius:24px;padding:10px 18px;font:600 15px "Segoe UI",sans-serif;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);', '🪄 עוזר');
    b.id = 'appnest-assistant-btn';
    b.onclick = toggle;
    document.body.appendChild(b);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addButton);
  else addButton();
})();

</script>
</body>
</html>
