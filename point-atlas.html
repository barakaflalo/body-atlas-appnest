· אחורי</option><option value="armFront">זרוע ואמה · כפי</option><option value="armBack">זרוע ואמה · גבי</option><option value="handPalm">כף יד · כפי</option><option value="handBack">כף יד · גבי</option><option value="legFront">רגל · קדמי</option><option value="legBack">רגל · אחורי</option><option value="legMedial">רגל · פנימי</option><option value="legLateral">רגל · חיצוני</option><option value="footTop">כף רגל · גבי</option><option value="footSole">כף רגל · סוליה</option><option value="footMedial">כף רגל · פנימי</option><option value="footLateral">כף רגל · חיצוני</option><option value="perineum">חיץ הנקבים · יחס בין ציוני דרך</option><option value="mouth">שפה עליונה וחניכיים · תקריב</option><option value="hip">אגן וירך · תרשים יחסים</option></select></label><label>נקודה במבט<select id="point"></select></label></div><div id="chart"></div><div id="caption"></div></main><script src="atlas-data.js"></script><script src="atlas-detail-data.js"></script><script>const D=window.ATLAS,LANG='he';const baT=(h,e)=>h,baName=p=>p.heN||p.py,baEsc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');</script><script src="atlas-detail-diagrams.js"></script><script src="atlas-anatomy.js"></script><script>const v=document.getElementById('view'),p=document.getElementById('point');function draw(){const point=D.points.find(x=>x.c===p.value),same=D.points.filter(x=>AD.points[x.c].view===v.value&&x.m===point.m&&Math.abs(+x.c.split(' ')[1]-+point.c.split(' ')[1])<=1);document.getElementById('chart').innerHTML=adDiagram(v.value,{codes:same.map(x=>x.c),selected:p.value,interactive:false});document.getElementById('caption').innerHTML='<h2 dir="auto">'+point.c+' · '+baEsc(point.heN)+'</h2><p>'+baEsc(point.heL)+'</p><p>'+AD.points[p.value].landmarks.map(x=>baEsc(x.he)).join(' · ')+'</p>';}function change(){p.innerHTML=D.points.filter(x=>AD.points[x.c].view===v.value).map(x=>'<option value="'+x.c+'">'+x.c+' · '+baEsc(x.heN)+'</option>').join('');draw();}v.onchange=change;p.onchange=draw;change();</script></html>
